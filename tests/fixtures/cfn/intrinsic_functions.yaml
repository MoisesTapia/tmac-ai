AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  Env: {Type: String}
Conditions:
  IsProd: !Equals [!Ref Env, prod]
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Env}-data"
      AccessControl: !If [IsProd, Private, PublicRead]
      Tags:
        - Key: arn
          Value: !Join [":", [!Ref "AWS::Region", !GetAtt Role.Arn]]
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: {"Fn::Sub": "${Env}-role"}
      Path: {"Fn::Select": [0, ["/", "/app/"]]}
      PermissionsBoundary: {"Fn::GetAtt": ["Boundary", "Arn"]}
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: !FindInMap [Services, Lambda, Principal]}
            Action: sts:AssumeRole
