AWSTemplateFormatVersion: "2010-09-09"
Resources:
  GetItems:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: GET
      AuthorizationType: NONE
      RestApiId: !Ref Api
      ResourceId: !GetAtt Api.RootResourceId
  Prod:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: prod
      RestApiId: !Ref Api
