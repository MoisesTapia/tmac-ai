AWSTemplateFormatVersion: "2010-09-09"
Resources:
  MainVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      Tags:
        - {Key: Name, Value: main}
        - {Key: FlowLogs, Value: enabled}
  SingleTagVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.1.0.0/16
      Tags:
        - {Key: FlowLogs, Value: enabled}
