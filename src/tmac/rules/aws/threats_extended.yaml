    name: "Bedrock Guardrail KMS key not specified"
    resource_type: "aws_bedrock_guardrail"
    check: { attribute: "kms_key_arn", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The guardrail configuration is not encrypted with a CMK; denied topic definitions or word policies may be stored in plaintext."
    mitigation: "Specify kms_key_arn with a CMK."
    references: ["https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html"]
    tags: ["bedrock", "guardrail", "encryption", "ml", "ai"]

  - id: TMAC-AWS-BEDROCKGR-005
    name: "Bedrock Guardrail without word filters"
    resource_type: "aws_bedrock_guardrail"
    check: { attribute: "word_policy_config", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Tampering"
    description: "No word/phrase block list is configured; the model may be used to produce content that violates acceptable use policies."
    mitigation: "Configure word_policy_config with profanity and custom blocked terms."
    references: ["https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-word-filters.html"]
    tags: ["bedrock", "guardrail", "content-safety", "ml", "ai"]

  - id: TMAC-AWS-BEDROCKGR-006
    name: "Bedrock Guardrail without grounding check"
    resource_type: "aws_bedrock_guardrail"
    check: { attribute: "grounding_policy_config", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Tampering"
    description: "No grounding check is configured; the model may hallucinate facts not present in the retrieved context."
    mitigation: "Configure grounding_policy_config with a grounding_threshold to filter unfounded responses."
    references: ["https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-groundedness.html"]
    tags: ["bedrock", "guardrail", "hallucination", "ml", "ai"]

  - id: TMAC-AWS-BEDROCKGR-007
    name: "Bedrock Guardrail without tags"
    resource_type: "aws_bedrock_guardrail"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The guardrail has no governance tags."
    mitigation: "Add environment and owner tags."
    references: ["https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html"]
    tags: ["bedrock", "guardrail", "tagging", "ml", "ai"]

  - id: TMAC-AWS-BEDROCKGR-008
    name: "Bedrock Guardrail without contextual grounding relevance check"
    resource_type: "aws_bedrock_guardrail"
    check: { attribute: "grounding_policy_config.relevance_threshold", condition: "not_exists", values: [] }
