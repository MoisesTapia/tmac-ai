    resource_type: "aws_frauddetector_event_type"
    check: { attribute: "labels", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Tampering"
    description: "The event type has no labels (FRAUD/LEGIT); the model cannot be trained for binary classification."
    mitigation: "Define labels matching the fraud/legitimate classification scheme."
    references: ["https://docs.aws.amazon.com/frauddetector/latest/ug/create-event-type.html"]
    tags: ["fraud-detector", "ml", "labels"]

  - id: TMAC-AWS-FRAUDDET-005
    name: "Fraud Detector storing PII in entity type without masking"
    resource_type: "aws_frauddetector_entity_type"
    check: { attribute: "name", condition: "regex", values: ["(?i)(customer|user|account|person)"] }
    severity: "High"
    stride: "Information Disclosure"
    description: "Entity types representing customers may store PII; verify that PII attributes are masked in training data."
    mitigation: "Mask or tokenize PII (email, IP, name) before ingesting into Fraud Detector."
    references: ["https://docs.aws.amazon.com/frauddetector/latest/ug/data-protection.html"]
    tags: ["fraud-detector", "ml", "pii", "privacy"]

  - id: TMAC-AWS-FRAUDDET-006
    name: "Fraud Detector variable with sensitive data type"
    resource_type: "aws_frauddetector_variable"
    check: { attribute: "variable_type", condition: "in", values: ["EMAIL_ADDRESS", "IP_ADDRESS", "PHONE_NUMBER"] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The variable stores sensitive PII (email, IP, phone); ensure it is not logged or exposed in GetEventPrediction responses."
    mitigation: "Apply data masking and restrict GetEventPrediction caller permissions to authorized services only."
    references: ["https://docs.aws.amazon.com/frauddetector/latest/ug/create-a-variable.html"]
    tags: ["fraud-detector", "ml", "pii", "privacy"]

  - id: TMAC-AWS-FRAUDDET-007
    name: "Fraud Detector outcome without defined actions"
    resource_type: "aws_frauddetector_outcome"
    check: { attribute: "name", condition: "regex", values: ["(?i)(review|manual)"] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "Outcomes routed to manual review without defined SLAs or escalation paths can accumulate, causing fraud to pass unresolved."
    mitigation: "Define clear SLA and automated escalation for REVIEW outcomes."
    references: ["https://docs.aws.amazon.com/frauddetector/latest/ug/outcomes.html"]
    tags: ["fraud-detector", "ml", "process"]

  - id: TMAC-AWS-FRAUDDET-008
