  - id: TMAC-AWS-PARTYROCK-001
    name: "PartyRock app using Bedrock models without data privacy controls"
    resource_type: "aws_bedrock_model_invocation_logging_configuration"
    check: { attribute: "logging_config.text_data_delivery_enabled", condition: "equals", values: [false] }
    severity: "High"
    stride: "Information Disclosure"
    description: "PartyRock apps share the Bedrock platform; without invocation logging, prompt/response pairs containing PII are not audited."
    mitigation: "Enable Bedrock invocation logging; avoid submitting PII or confidential data to PartyRock apps."
    references: ["https://partyrock.aws"]
    tags: ["partyrock", "bedrock", "privacy", "pii", "ml"]

  - id: TMAC-AWS-PARTYROCK-002
    name: "PartyRock app sharing sensitive enterprise data"
    resource_type: "aws_bedrock_model_invocation_logging_configuration"
    check: { attribute: "logging_config.text_data_delivery_enabled", condition: "equals", values: [false] }
    severity: "High"
    stride: "Information Disclosure"
    description: "PartyRock is a public sandbox; enterprise users submitting internal documents or code may violate data handling policies."
    mitigation: "Implement DLP policies blocking submission of confidential data to PartyRock; use SCP to restrict access."
    references: ["https://partyrock.aws"]
    tags: ["partyrock", "dlp", "data-handling", "ml"]

  - id: TMAC-AWS-PARTYROCK-003
    name: "PartyRock app without content safety guardrails"
    resource_type: "aws_bedrock_guardrail"
    check: { attribute: "tags.Service", condition: "equals", values: ["partyrock"] }
    severity: "High"
    stride: "Tampering"
    description: "PartyRock apps that interact with external users lack guardrails; they can be used to generate harmful or misleading content."
    mitigation: "Associate Bedrock guardrails (content filter, topic deny, PII) with all externally accessible PartyRock apps."
    references: ["https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html"]
    tags: ["partyrock", "guardrail", "content-safety", "ml"]

  - id: TMAC-AWS-PARTYROCK-004
    name: "PartyRock app without rate limiting"
    resource_type: "aws_bedrock_model_invocation_logging_configuration"
    check: { attribute: "logging_config.text_data_delivery_enabled", condition: "equals", values: [false] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "PartyRock apps without rate limiting can be abused to generate excessive Bedrock API costs."
    mitigation: "Set AWS Budgets alerts and API throttling limits for Bedrock usage from PartyRock."
    references: ["https://docs.aws.amazon.com/bedrock/latest/userguide/quotas.html"]
    tags: ["partyrock", "bedrock", "ddos", "cost", "ml"]

  - id: TMAC-AWS-PARTYROCK-005
    name: "PartyRock output used without human review"
    resource_type: "aws_bedrock_model_invocation_logging_configuration"
    check: { attribute: "logging_config.text_data_delivery_enabled", condition: "equals", values: [false] }
    severity: "Medium"
    stride: "Repudiation"
    description: "Content generated by PartyRock apps may be used in business decisions without human verification, leading to hallucination-based errors."
    mitigation: "Implement a mandatory human review workflow for any PartyRock outputs used in business processes."
    references: ["https://partyrock.aws"]
    tags: ["partyrock", "hallucination", "human-review", "ml"]

  - id: TMAC-AWS-PARTYROCK-006
    name: "PartyRock app shared publicly without access controls"
    resource_type: "aws_bedrock_model_invocation_logging_configuration"
    check: { attribute: "logging_config.text_data_delivery_enabled", condition: "equals", values: [false] }
    severity: "High"
    stride: "Information Disclosure"
    description: "PartyRock apps shared publicly can be invoked by anyone; if the app's system prompt contains proprietary information, it may be extracted via jailbreaking."
    mitigation: "Avoid embedding proprietary information in system prompts; use guardrails to prevent prompt extraction."
    references: ["https://partyrock.aws"]
    tags: ["partyrock", "prompt-injection", "information-disclosure", "ml"]

  - id: TMAC-AWS-PARTYROCK-007
    name: "PartyRock not covered by enterprise acceptable use policy"
    resource_type: "aws_bedrock_model_invocation_logging_configuration"
    check: { attribute: "logging_config.text_data_delivery_enabled", condition: "equals", values: [false] }
    severity: "Medium"
    stride: "Repudiation"
    description: "PartyRock usage is not covered by enterprise AUP; employees may use it for inappropriate purposes."
    mitigation: "Include PartyRock in the enterprise AI acceptable use policy; train employees on responsible AI use."
    references: ["https://partyrock.aws"]
    tags: ["partyrock", "compliance", "policy", "ml"]

  - id: TMAC-AWS-PARTYROCK-008
    name: "PartyRock app credentials not rotated"
    resource_type: "aws_bedrock_model_invocation_logging_configuration"
    check: { attribute: "logging_config.text_data_delivery_enabled", condition: "equals", values: [false] }
    severity: "Medium"
    stride: "Spoofing"
    description: "PartyRock authenticates via AWS account credentials; if credentials are not rotated, unauthorized long-term access is possible."
    mitigation: "Use short-lived credentials (IAM Identity Center) for PartyRock access; rotate access keys regularly."
    references: ["https://partyrock.aws"]
    tags: ["partyrock", "credentials", "rotation", "ml"]

  # ==================================================================
  # STORAGE SERVICES — STRIDE + Threat Modeling per Element
  # Covers: AWS Backup, EBS, Elastic Disaster Recovery, EFS,
  #         File Cache, FSx Lustre, FSx NetApp ONTAP, FSx OpenZFS,
  #         FSx Windows File Server, Storage Gateway
  # (S3 is already well covered — skipped)
  # ==================================================================

  # ------------------------------------------------------------------
  # aws_backup_vault  (complements BKP-001)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-BKP-002
    name: "Backup Vault without access policy"
    resource_type: "aws_backup_vault"
    check: { attribute: "policy", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Elevation of Privilege"
    description: "The Backup Vault has no resource-based policy; any IAM principal with backup:RestoreBackupVault can restore or delete recovery points."
    mitigation: "Attach a vault access policy restricting restore and delete operations to break-glass roles."
    references: ["https://docs.aws.amazon.com/aws-backup/latest/devguide/create-a-vault-access-policy.html"]
    tags: ["backup", "vault", "iam"]

  - id: TMAC-AWS-BKP-003
    name: "Backup Vault without Vault Lock"
    resource_type: "aws_backup_vault"
    check: { attribute: "force_destroy", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Tampering"
    description: "Vault Lock (WORM) is not enabled; recovery points can be deleted before their retention period expires, enabling ransomware to destroy backups."
    mitigation: "Enable aws_backup_vault_lock_configuration with a min/max_retention_days and lock the vault."
    references: ["https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html"]
    tags: ["backup", "vault", "ransomware", "worm"]

  - id: TMAC-AWS-BKP-004
    name: "Backup Vault allowing force destroy"
    resource_type: "aws_backup_vault"
    check: { attribute: "force_destroy", condition: "equals", values: [true] }
    severity: "High"
    stride: "Denial of Service"
    description: "force_destroy = true allows deletion of the vault with all recovery points; an accidental terraform destroy causes irreversible data loss."
    mitigation: "Set force_destroy = false in production vaults."
    references: ["https://docs.aws.amazon.com/aws-backup/latest/devguide/create-a-vault.html"]
    tags: ["backup", "vault", "data-loss"]

  - id: TMAC-AWS-BKP-005
    name: "Backup Plan without cross-region copy"
    resource_type: "aws_backup_plan"
    check: { attribute: "rule.copy_action", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "The backup plan does not copy recovery points to another region; a regional outage or ransomware event destroys the only copies."
    mitigation: "Add a copy_action block targeting a different region with its own vault and KMS key."
    references: ["https://docs.aws.amazon.com/aws-backup/latest/devguide/create-cross-region-backup.html"]
    tags: ["backup", "plan", "dr", "cross-region"]

  - id: TMAC-AWS-BKP-006
    name: "Backup Plan without lifecycle transition to cold storage"
    resource_type: "aws_backup_plan"
    check: { attribute: "rule.lifecycle", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "The backup rule has no lifecycle configuration; old recovery points persist in warm storage, increasing the attack surface and cost."
    mitigation: "Define lifecycle { cold_storage_after = 30, delete_after = 365 } per retention policy."
    references: ["https://docs.aws.amazon.com/aws-backup/latest/devguide/creating-a-backup-plan.html"]
    tags: ["backup", "plan", "lifecycle"]

  - id: TMAC-AWS-BKP-007
    name: "Backup Plan rule with no KMS key on copy destination"
    resource_type: "aws_backup_plan"
    check: { attribute: "rule.copy_action.destination_vault_arn", condition: "exists", values: [], and_check: { attribute: "rule.copy_action.lifecycle", condition: "not_exists", values: [] } }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "Cross-region copy action is configured but no lifecycle is defined for the destination vault recovery points."
    mitigation: "Add lifecycle to the copy_action to expire DR copies per retention policy."
    references: ["https://docs.aws.amazon.com/aws-backup/latest/devguide/create-cross-region-backup.html"]
    tags: ["backup", "plan", "dr"]

  - id: TMAC-AWS-BKP-008
    name: "Backup Selection without conditions"
    resource_type: "aws_backup_selection"
    check: { attribute: "condition", condition: "not_exists", values: [], and_check: { attribute: "resources", condition: "regex", values: ["\\*"] } }
    severity: "Medium"
    stride: "Tampering"
    description: "The backup selection targets all resources (wildcard) without tag or ARN conditions; unexpected resources may be backed up, increasing scope."
    mitigation: "Scope the selection with tag-based conditions or explicit resource ARNs."
    references: ["https://docs.aws.amazon.com/aws-backup/latest/devguide/assigning-resources.html"]
    tags: ["backup", "selection", "scope"]

  - id: TMAC-AWS-BKP-009
    name: "Backup Vault without tags"
    resource_type: "aws_backup_vault"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Backup Vault has no governance tags."
    mitigation: "Add environment, owner, and data-classification tags."
    references: ["https://docs.aws.amazon.com/aws-backup/latest/devguide/create-a-vault.html"]
    tags: ["backup", "vault", "tagging"]

  # ------------------------------------------------------------------
  # aws_backup_vault_lock_configuration
  # ------------------------------------------------------------------
  - id: TMAC-AWS-BKVL-001
    name: "Backup Vault Lock with too-short minimum retention"
    resource_type: "aws_backup_vault_lock_configuration"
    check: { attribute: "min_retention_days", condition: "in", values: [1, 2, 3, 4, 5, 6] }
    severity: "Medium"
    stride: "Tampering"
    description: "The vault lock minimum retention is less than 7 days; recovery points can be deleted before meaningful protection is achieved."
    mitigation: "Set min_retention_days >= 7 (30 for regulated workloads)."
    references: ["https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html"]
    tags: ["backup", "vault-lock", "ransomware"]

  - id: TMAC-AWS-BKVL-002
    name: "Backup Vault Lock without a changeable period"
    resource_type: "aws_backup_vault_lock_configuration"
    check: { attribute: "changeable_for_days", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Denial of Service"
    description: "The vault lock does not declare a changeable_for_days window; once applied it is immediately immutable with no grace period to correct mistakes."
    mitigation: "Set changeable_for_days = 3 to allow corrections before the lock becomes permanent."
    references: ["https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html"]
    tags: ["backup", "vault-lock"]

  # ------------------------------------------------------------------
  # aws_ebs_volume  (complements EC2-002)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-EBS-002
    name: "EBS Volume without a CMK"
    resource_type: "aws_ebs_volume"
    check: { attribute: "kms_key_id", condition: "not_exists", values: [], and_check: { attribute: "encrypted", condition: "equals", values: [true] } }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The EBS volume is encrypted but uses the default aws/ebs key instead of a customer-managed CMK, limiting key rotation control and audit."
    mitigation: "Specify kms_key_id with a CMK."
    references: ["https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/EBSEncryption.html"]
    tags: ["ebs", "encryption", "kms"]

  - id: TMAC-AWS-EBS-003
    name: "EBS Volume without deletion protection"
    resource_type: "aws_ebs_volume"
    check: { attribute: "final_snapshot", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "The EBS volume is not configured to take a final snapshot before deletion; data loss on accidental volume deletion."
    mitigation: "Create a data lifecycle policy or snapshot before destroying volumes."
    references: ["https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-deleting-volume.html"]
    tags: ["ebs", "snapshot", "data-loss"]

  - id: TMAC-AWS-EBS-004
    name: "EBS Volume with multi-attach enabled on non-clustered workload"
    resource_type: "aws_ebs_volume"
    check: { attribute: "multi_attach_enabled", condition: "equals", values: [true] }
    severity: "Medium"
    stride: "Tampering"
    description: "Multi-attach allows multiple EC2 instances to write to the same volume simultaneously; without a cluster-aware filesystem, data corruption can occur."
    mitigation: "Only use multi_attach_enabled with cluster-aware filesystems (OCFS2, GFS2)."
    references: ["https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volumes-multi.html"]
    tags: ["ebs", "multi-attach", "data-integrity"]

  - id: TMAC-AWS-EBS-005
    name: "EBS Snapshot without encryption"
    resource_type: "aws_ebs_snapshot"
    check: { attribute: "encrypted", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The EBS snapshot is not encrypted; data at rest in the snapshot is unprotected and can be shared or copied without controls."
    mitigation: "Create snapshots only from encrypted volumes or use encrypted = true on the snapshot."
    references: ["https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-copy-snapshot.html"]
    tags: ["ebs", "snapshot", "encryption"]

  - id: TMAC-AWS-EBS-006
    name: "EBS Snapshot shared publicly"
    resource_type: "aws_ebs_snapshot"
    check: { attribute: "permanent_restore", condition: "exists", values: [] }
    severity: "Critical"
    stride: "Information Disclosure"
    description: "An EBS snapshot may be shared publicly; any AWS account can copy and mount the volume, exposing all data."
    mitigation: "Never make snapshots public; audit sharing permissions regularly with AWS Config rule ec2-ebs-snapshot-public-restorable-check."
    references: ["https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-modifying-snapshot-permissions.html"]
    tags: ["ebs", "snapshot", "public", "exposure"]

  - id: TMAC-AWS-EBS-007
    name: "EBS Volume without throughput optimization"
    resource_type: "aws_ebs_volume"
    check: { attribute: "type", condition: "equals", values: ["standard"] }
    severity: "Low"
    stride: "Denial of Service"
    description: "The EBS volume uses the legacy magnetic 'standard' type; it has the lowest IOPS and is susceptible to performance-based denial of service."
    mitigation: "Upgrade to gp3 or io2 for consistent IOPS and throughput."
    references: ["https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html"]
    tags: ["ebs", "performance", "availability"]

  - id: TMAC-AWS-EBS-008
    name: "EBS Volume without tags"
    resource_type: "aws_ebs_volume"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The EBS volume has no governance tags, hindering ownership tracking and cost attribution."
    mitigation: "Add environment, owner, and data-classification tags."
    references: ["https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Using_Tags.html"]
    tags: ["ebs", "tagging"]

  # ------------------------------------------------------------------
  # aws_efs_file_system  (complements EFS-001)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-EFS-002
    name: "EFS File System without a CMK"
    resource_type: "aws_efs_file_system"
    check: { attribute: "kms_key_id", condition: "not_exists", values: [], and_check: { attribute: "encrypted", condition: "equals", values: [true] } }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The EFS file system is encrypted but uses the default aws/elasticfilesystem key instead of a CMK."
    mitigation: "Specify kms_key_id with a CMK."
    references: ["https://docs.aws.amazon.com/efs/latest/ug/encryption-at-rest.html"]
    tags: ["efs", "encryption", "kms"]

  - id: TMAC-AWS-EFS-003
    name: "EFS File System without lifecycle policy"
    resource_type: "aws_efs_file_system"
    check: { attribute: "lifecycle_policy", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "Without a lifecycle policy, infrequently accessed files remain in Standard storage indefinitely, increasing cost and data surface."
    mitigation: "Configure lifecycle_policy { transition_to_ia = AFTER_30_DAYS }."
    references: ["https://docs.aws.amazon.com/efs/latest/ug/lifecycle-management-efs.html"]
    tags: ["efs", "lifecycle", "cost"]

  - id: TMAC-AWS-EFS-004
    name: "EFS File System without automatic backups"
    resource_type: "aws_efs_file_system"
    check: { attribute: "enable_automatic_backups", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "Automatic backups are not enabled on the EFS file system; data is not protected against accidental deletion or corruption."
    mitigation: "Set enable_automatic_backups = true or create an AWS Backup plan targeting the EFS."
    references: ["https://docs.aws.amazon.com/efs/latest/ug/efs-backup-solutions.html"]
    tags: ["efs", "backup", "availability"]

  - id: TMAC-AWS-EFS-005
    name: "EFS Mount Target in a public subnet"
    resource_type: "aws_efs_mount_target"
    check: { attribute: "subnet_id", condition: "exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "EFS mount targets should only be created in private subnets; a public subnet exposes NFS traffic to the internet."
    mitigation: "Create mount targets only in private subnets with restrictive security groups allowing NFS (2049) from known sources."
    references: ["https://docs.aws.amazon.com/efs/latest/ug/network-access.html"]
    tags: ["efs", "mount-target", "network", "nfs"]

  - id: TMAC-AWS-EFS-006
    name: "EFS File System without a resource-based policy"
    resource_type: "aws_efs_file_system_policy"
    check: { attribute: "policy", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Elevation of Privilege"
    description: "Without a file system policy, any IAM identity with elasticfilesystem:ClientMount can mount the EFS from any VPC."
    mitigation: "Define an aws_efs_file_system_policy requiring TLS (aws:SecureTransport) and restricting principals."
    references: ["https://docs.aws.amazon.com/efs/latest/ug/access-control-overview.html"]
    tags: ["efs", "policy", "iam", "tls"]

  - id: TMAC-AWS-EFS-007
    name: "EFS File System policy without TLS enforcement"
    resource_type: "aws_efs_file_system_policy"
    check: { attribute: "policy", condition: "not_contains", values: ["aws:SecureTransport"] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The EFS file system policy does not enforce TLS (aws:SecureTransport = true); NFS traffic is transmitted in plaintext."
    mitigation: "Add a Deny statement with Condition { Bool: { aws:SecureTransport: false } } to require TLS."
    references: ["https://docs.aws.amazon.com/efs/latest/ug/encryption-in-transit.html"]
    tags: ["efs", "policy", "tls", "encryption-in-transit"]

  - id: TMAC-AWS-EFS-008
    name: "EFS File System without tags"
    resource_type: "aws_efs_file_system"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The EFS file system has no governance tags."
    mitigation: "Add environment, owner, and data-classification tags."
    references: ["https://docs.aws.amazon.com/efs/latest/ug/manage-fs-tags.html"]
    tags: ["efs", "tagging"]

  # ------------------------------------------------------------------
  # aws_fsx_windows_file_system  (complements FSX-001)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-FSXWIN-002
    name: "FSx Windows without daily automatic backups"
    resource_type: "aws_fsx_windows_file_system"
    check: { attribute: "automatic_backup_retention_days", condition: "equals", values: [0] }
    severity: "High"
    stride: "Denial of Service"
    description: "Automatic backups are disabled (retention = 0); a ransomware attack or accidental deletion has no recovery point."
    mitigation: "Set automatic_backup_retention_days >= 7."
    references: ["https://docs.aws.amazon.com/fsx/latest/WindowsGuide/using-backups.html"]
    tags: ["fsx", "windows", "backup", "ransomware"]

  - id: TMAC-AWS-FSXWIN-003
    name: "FSx Windows not deployed in a Multi-AZ configuration"
    resource_type: "aws_fsx_windows_file_system"
    check: { attribute: "deployment_type", condition: "equals", values: ["SINGLE_AZ_1", "SINGLE_AZ_2"] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "Single-AZ deployment has no standby; an AZ failure causes a complete outage of the file system."
    mitigation: "Use deployment_type = MULTI_AZ_1 for production workloads."
    references: ["https://docs.aws.amazon.com/fsx/latest/WindowsGuide/high-availability-multiAZ.html"]
    tags: ["fsx", "windows", "multi-az", "availability"]

  - id: TMAC-AWS-FSXWIN-004
    name: "FSx Windows with SMB without audit logging"
    resource_type: "aws_fsx_windows_file_system"
    check: { attribute: "audit_log_configuration", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Repudiation"
    description: "SMB file access audit logging is not configured; data exfiltration or unauthorized access via SMB shares cannot be detected."
    mitigation: "Configure audit_log_configuration { file_access_audit_log_level = SUCCESS_AND_FAILURE }."
    references: ["https://docs.aws.amazon.com/fsx/latest/WindowsGuide/file-access-auditing.html"]
    tags: ["fsx", "windows", "smb", "audit", "logging"]

  - id: TMAC-AWS-FSXWIN-005
    name: "FSx Windows without Active Directory integration"
    resource_type: "aws_fsx_windows_file_system"
    check: { attribute: "active_directory_id", condition: "not_exists", values: [], and_check: { attribute: "self_managed_active_directory", condition: "not_exists", values: [] } }
    severity: "High"
    stride: "Spoofing"
    description: "The file system is not joined to Active Directory; ACL enforcement and identity-based access control are not available."
    mitigation: "Join the file system to AWS Managed AD or a self-managed AD with MFA enforcement."
    references: ["https://docs.aws.amazon.com/fsx/latest/WindowsGuide/fsx-ad-integration.html"]
    tags: ["fsx", "windows", "active-directory", "auth"]

  - id: TMAC-AWS-FSXWIN-006
    name: "FSx Windows without storage capacity alarm"
    resource_type: "aws_fsx_windows_file_system"
    check: { attribute: "storage_capacity", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Denial of Service"
    description: "Without CloudWatch alarms on FreeStorageCapacity, a full file system causes write failures and application outages."
    mitigation: "Create a CloudWatch alarm on FreeStorageCapacity for the file system."
    references: ["https://docs.aws.amazon.com/fsx/latest/WindowsGuide/monitoring_overview.html"]
    tags: ["fsx", "windows", "monitoring", "availability"]

  - id: TMAC-AWS-FSXWIN-007
    name: "FSx Windows with public security group"
    resource_type: "aws_fsx_windows_file_system"
    check: { attribute: "security_group_ids", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The file system does not declare explicit security groups; it uses the default VPC security group, which may be overly permissive."
    mitigation: "Associate dedicated security groups allowing SMB (445) only from authorized subnets/SGs."
    references: ["https://docs.aws.amazon.com/fsx/latest/WindowsGuide/limit-access-security-groups.html"]
    tags: ["fsx", "windows", "network", "smb"]

  - id: TMAC-AWS-FSXWIN-008
    name: "FSx Windows without tags"
    resource_type: "aws_fsx_windows_file_system"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The FSx Windows file system has no governance tags."
    mitigation: "Add environment, owner, and data-classification tags."
    references: ["https://docs.aws.amazon.com/fsx/latest/WindowsGuide/tag-resources.html"]
    tags: ["fsx", "windows", "tagging"]

  # ------------------------------------------------------------------
  # aws_fsx_lustre_file_system  (complements FSX-002)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-FSXLUS-002
    name: "FSx Lustre without automatic backup retention"
    resource_type: "aws_fsx_lustre_file_system"
    check: { attribute: "automatic_backup_retention_days", condition: "equals", values: [0] }
    severity: "High"
    stride: "Denial of Service"
    description: "Automatic backups are disabled; HPC training data or scratch data is unprotected against accidental deletion."
    mitigation: "Set automatic_backup_retention_days >= 7 for persistent file systems."
    references: ["https://docs.aws.amazon.com/fsx/latest/LustreGuide/using-backups-fsx.html"]
    tags: ["fsx", "lustre", "backup", "hpc"]

  - id: TMAC-AWS-FSXLUS-003
    name: "FSx Lustre with public S3 data repository"
    resource_type: "aws_fsx_lustre_file_system"
    check: { attribute: "import_path", condition: "regex", values: ["^s3://(?!.*private)"] }
    severity: "High"
    stride: "Tampering"
    description: "The Lustre file system imports data from an S3 bucket; if that bucket allows public writes, adversaries can inject malicious training data."
    mitigation: "Block public access on the linked S3 bucket and enforce Object Lock for data integrity."
    references: ["https://docs.aws.amazon.com/fsx/latest/LustreGuide/fsx-data-repositories.html"]
    tags: ["fsx", "lustre", "s3", "data-poisoning"]

  - id: TMAC-AWS-FSXLUS-004
    name: "FSx Lustre export path writing to unencrypted S3"
    resource_type: "aws_fsx_lustre_file_system"
    check: { attribute: "export_path", condition: "exists", values: [] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "Processed HPC output is exported to S3; verify the destination bucket enforces SSE-KMS."
    mitigation: "Ensure the export S3 bucket uses SSE-KMS with a CMK and public access is blocked."
    references: ["https://docs.aws.amazon.com/fsx/latest/LustreGuide/fsx-data-repositories.html"]
    tags: ["fsx", "lustre", "s3", "encryption"]

  - id: TMAC-AWS-FSXLUS-005
    name: "FSx Lustre SCRATCH deployment without data persistence"
    resource_type: "aws_fsx_lustre_file_system"
    check: { attribute: "deployment_type", condition: "in", values: ["SCRATCH_1", "SCRATCH_2"] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "SCRATCH deployments offer no data durability guarantees; data is lost on file system failure or termination."
    mitigation: "Use PERSISTENT_1 or PERSISTENT_2 for workloads where data durability is required."
    references: ["https://docs.aws.amazon.com/fsx/latest/LustreGuide/using-fsx-lustre.html"]
    tags: ["fsx", "lustre", "persistence", "availability"]

  - id: TMAC-AWS-FSXLUS-006
    name: "FSx Lustre without per-unit storage throughput defined"
    resource_type: "aws_fsx_lustre_file_system"
    check: { attribute: "per_unit_storage_throughput", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Denial of Service"
    description: "Without defined throughput, the file system may be under-provisioned, causing I/O contention for HPC workloads."
    mitigation: "Explicitly set per_unit_storage_throughput for PERSISTENT deployment types."
    references: ["https://docs.aws.amazon.com/fsx/latest/LustreGuide/performance.html"]
    tags: ["fsx", "lustre", "performance", "availability"]

  - id: TMAC-AWS-FSXLUS-007
    name: "FSx Lustre without security group restrictions"
    resource_type: "aws_fsx_lustre_file_system"
    check: { attribute: "security_group_ids", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "Without explicit security groups, the Lustre file system uses the default SG which may allow broad NFS/Lustre access."
    mitigation: "Associate security groups allowing Lustre ports (988, 1021-1023) only from compute subnets."
    references: ["https://docs.aws.amazon.com/fsx/latest/LustreGuide/limit-access-security-groups.html"]
    tags: ["fsx", "lustre", "network", "nfs"]

  - id: TMAC-AWS-FSXLUS-008
    name: "FSx Lustre without tags"
    resource_type: "aws_fsx_lustre_file_system"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The FSx Lustre file system has no governance tags."
    mitigation: "Add environment, owner, and project tags."
    references: ["https://docs.aws.amazon.com/fsx/latest/LustreGuide/tag-resources.html"]
    tags: ["fsx", "lustre", "tagging"]

  # ------------------------------------------------------------------
  # aws_fsx_ontap_file_system  (FSx for NetApp ONTAP — 8 new rules)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-FSXONTAP-001
    name: "FSx ONTAP without KMS encryption"
    resource_type: "aws_fsx_ontap_file_system"
    check: { attribute: "kms_key_id", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The FSx ONTAP file system is not encrypted with a customer-managed KMS key; data at rest is protected only by the default aws/fsx key."
    mitigation: "Specify kms_key_id with a CMK."
    references: ["https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/encryption-at-rest.html"]
    tags: ["fsx", "ontap", "encryption", "kms"]

  - id: TMAC-AWS-FSXONTAP-002
    name: "FSx ONTAP single-AZ deployment"
    resource_type: "aws_fsx_ontap_file_system"
    check: { attribute: "deployment_type", condition: "equals", values: ["SINGLE_AZ_1"] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "Single-AZ deployment has no standby HA node; an AZ failure causes complete file system unavailability."
    mitigation: "Use deployment_type = MULTI_AZ_1 for production workloads."
    references: ["https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/high-availability-multiAZ.html"]
    tags: ["fsx", "ontap", "multi-az", "availability"]

  - id: TMAC-AWS-FSXONTAP-003
    name: "FSx ONTAP without automatic backup retention"
    resource_type: "aws_fsx_ontap_file_system"
    check: { attribute: "automatic_backup_retention_days", condition: "equals", values: [0] }
    severity: "High"
    stride: "Denial of Service"
    description: "Automatic backups are disabled; ransomware or accidental deletion leaves no recovery point."
    mitigation: "Set automatic_backup_retention_days >= 7."
    references: ["https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/using-backups.html"]
    tags: ["fsx", "ontap", "backup", "ransomware"]

  - id: TMAC-AWS-FSXONTAP-004
    name: "FSx ONTAP with FSXADMIN password in plaintext"
    resource_type: "aws_fsx_ontap_file_system"
    check: { attribute: "fsx_admin_password", condition: "exists", values: [] }
    severity: "Critical"
    stride: "Information Disclosure"
    description: "The FSXADMIN management password is embedded in the Terraform resource, visible in state and plan output."
    mitigation: "Generate the password with random_password and store it in Secrets Manager; reference via data source."
    references: ["https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/managing-file-systems.html"]
    tags: ["fsx", "ontap", "credentials", "secrets"]

  - id: TMAC-AWS-FSXONTAP-005
    name: "FSx ONTAP without security groups"
    resource_type: "aws_fsx_ontap_file_system"
    check: { attribute: "security_group_ids", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "Without explicit security groups, ONTAP management and NFS/SMB/iSCSI ports are accessible from the default VPC SG."
    mitigation: "Associate dedicated security groups restricting ONTAP ports to trusted subnets."
    references: ["https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/limit-access-security-groups.html"]
    tags: ["fsx", "ontap", "network"]

  - id: TMAC-AWS-FSXONTAP-006
    name: "FSx ONTAP SVM without root volume security style"
    resource_type: "aws_fsx_ontap_storage_virtual_machine"
    check: { attribute: "root_volume_security_style", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Elevation of Privilege"
    description: "The ONTAP SVM does not declare root volume security style; default may allow UNIX-style permission bypass for Windows clients or vice versa."
    mitigation: "Explicitly set root_volume_security_style (UNIX, NTFS, or MIXED) to match the workload's ACL model."
    references: ["https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/security-style.html"]
    tags: ["fsx", "ontap", "svm", "acl"]

  - id: TMAC-AWS-FSXONTAP-007
    name: "FSx ONTAP volume without SnapLock for compliance"
    resource_type: "aws_fsx_ontap_volume"
    check: { attribute: "snaplock_configuration", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Tampering"
    description: "ONTAP volumes supporting regulated data do not enable SnapLock WORM; records can be altered or deleted before retention expiry."
    mitigation: "Enable snaplock_configuration { snaplock_type = COMPLIANCE } for regulated data volumes."
    references: ["https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/snaplock.html"]
    tags: ["fsx", "ontap", "worm", "compliance", "ransomware"]

  - id: TMAC-AWS-FSXONTAP-008
    name: "FSx ONTAP without tags"
    resource_type: "aws_fsx_ontap_file_system"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The FSx ONTAP file system has no governance tags."
    mitigation: "Add environment, owner, and data-classification tags."
    references: ["https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/tag-resources.html"]
    tags: ["fsx", "ontap", "tagging"]

  # ------------------------------------------------------------------
  # aws_fsx_openzfs_file_system  (FSx for OpenZFS — 8 new rules)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-FSXZFS-001
    name: "FSx OpenZFS without KMS encryption"
    resource_type: "aws_fsx_openzfs_file_system"
    check: { attribute: "kms_key_id", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The FSx OpenZFS file system is not encrypted with a CMK; data at rest uses only the default aws/fsx key."
    mitigation: "Specify kms_key_id with a CMK."
    references: ["https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/encryption-at-rest.html"]
    tags: ["fsx", "openzfs", "encryption", "kms"]

  - id: TMAC-AWS-FSXZFS-002
    name: "FSx OpenZFS without automatic backup retention"
    resource_type: "aws_fsx_openzfs_file_system"
    check: { attribute: "automatic_backup_retention_days", condition: "equals", values: [0] }
    severity: "High"
    stride: "Denial of Service"
    description: "Automatic backups are disabled; a ransomware attack or accidental deletion has no recovery point."
    mitigation: "Set automatic_backup_retention_days >= 7."
    references: ["https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/using-backups.html"]
    tags: ["fsx", "openzfs", "backup", "ransomware"]

  - id: TMAC-AWS-FSXZFS-003
    name: "FSx OpenZFS root volume without read-only snapshot"
    resource_type: "aws_fsx_openzfs_file_system"
    check: { attribute: "root_volume_configuration.read_only", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Tampering"
    description: "The root volume configuration does not enforce read-only mode; accidental writes to the root volume can corrupt the file system structure."
    mitigation: "Evaluate root_volume_configuration { read_only = true } when writes are not needed on the root."
    references: ["https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/managing-volumes.html"]
    tags: ["fsx", "openzfs", "volume", "integrity"]

  - id: TMAC-AWS-FSXZFS-004
    name: "FSx OpenZFS root volume without NFS export restrictions"
    resource_type: "aws_fsx_openzfs_file_system"
    check: { attribute: "root_volume_configuration.nfs_exports", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The root volume does not define NFS export restrictions; it may be mountable from any host in the VPC."
    mitigation: "Configure root_volume_configuration.nfs_exports with explicit client_configurations restricting access by IP/CIDR."
    references: ["https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/limit-access-nfs.html"]
    tags: ["fsx", "openzfs", "nfs", "network", "exposure"]

  - id: TMAC-AWS-FSXZFS-005
    name: "FSx OpenZFS volume with no data compression"
    resource_type: "aws_fsx_openzfs_volume"
    check: { attribute: "data_compression_type", condition: "equals", values: ["NONE"] }
    severity: "Info"
    stride: "Denial of Service"
    description: "Data compression is disabled; for large datasets this increases storage consumption and potential cost-based denial of service."
    mitigation: "Enable data_compression_type = LZ4 for general workloads or ZSTD for higher compression."
    references: ["https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/performance.html"]
    tags: ["fsx", "openzfs", "compression", "cost"]

  - id: TMAC-AWS-FSXZFS-006
    name: "FSx OpenZFS without security group restrictions"
    resource_type: "aws_fsx_openzfs_file_system"
    check: { attribute: "security_group_ids", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "Without explicit security groups, NFS access is governed by the default VPC SG."
    mitigation: "Associate security groups restricting NFS (2049) to trusted compute subnets."
    references: ["https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/limit-access-security-groups.html"]
    tags: ["fsx", "openzfs", "network", "nfs"]

  - id: TMAC-AWS-FSXZFS-007
    name: "FSx OpenZFS single-AZ deployment"
    resource_type: "aws_fsx_openzfs_file_system"
    check: { attribute: "deployment_type", condition: "equals", values: ["SINGLE_AZ_1", "SINGLE_AZ_2"] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "Single-AZ deployment has no HA failover; an AZ failure causes a complete outage."
    mitigation: "Use MULTI_AZ_1 for production workloads."
    references: ["https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/high-availability-multiAZ.html"]
    tags: ["fsx", "openzfs", "multi-az", "availability"]

  - id: TMAC-AWS-FSXZFS-008
    name: "FSx OpenZFS without tags"
    resource_type: "aws_fsx_openzfs_file_system"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The FSx OpenZFS file system has no governance tags."
    mitigation: "Add environment, owner, and data-classification tags."
    references: ["https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/tag-resources.html"]
    tags: ["fsx", "openzfs", "tagging"]

  # ------------------------------------------------------------------
  # Amazon File Cache  (aws_fsx_file_cache — 8 new rules)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-FILECACHE-001
    name: "File Cache without KMS encryption"
    resource_type: "aws_fsx_file_cache"
    check: { attribute: "kms_key_id", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The File Cache is not encrypted with a CMK; cached HPC data at rest is protected only by the default aws/fsx key."
    mitigation: "Specify kms_key_id with a CMK."
    references: ["https://docs.aws.amazon.com/fsx/latest/FileCacheGuide/encryption-at-rest.html"]
    tags: ["file-cache", "fsx", "encryption", "hpc"]

  - id: TMAC-AWS-FILECACHE-002
    name: "File Cache without security group restrictions"
    resource_type: "aws_fsx_file_cache"
    check: { attribute: "security_group_ids", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "Without explicit security groups, Lustre ports for File Cache are governed by the default VPC SG."
    mitigation: "Associate security groups restricting Lustre ports (988, 1021-1023) to compute subnets."
    references: ["https://docs.aws.amazon.com/fsx/latest/FileCacheGuide/limit-access-security-groups.html"]
    tags: ["file-cache", "fsx", "network", "lustre"]

  - id: TMAC-AWS-FILECACHE-003
    name: "File Cache linked to a public NFS data repository"
    resource_type: "aws_fsx_file_cache"
    check: { attribute: "data_repository_associations.data_repository_path", condition: "regex", values: ["^nfs://(?!10\\.|172\\.|192\\.168\\.)"] }
    severity: "High"
    stride: "Tampering"
    description: "The File Cache is linked to an NFS path on a public or external IP; adversaries can serve poisoned data from that path."
    mitigation: "Only link to NFS servers within private RFC-1918 ranges with authenticated mounts."
    references: ["https://docs.aws.amazon.com/fsx/latest/FileCacheGuide/create-file-cache.html"]
    tags: ["file-cache", "fsx", "nfs", "data-integrity"]

  - id: TMAC-AWS-FILECACHE-004
    name: "File Cache linked to unencrypted S3 bucket"
    resource_type: "aws_fsx_file_cache"
    check: { attribute: "data_repository_associations.data_repository_path", condition: "regex", values: ["^s3://"] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The File Cache is backed by an S3 bucket; verify the bucket enforces SSE-KMS and public access is blocked."
    mitigation: "Configure the linked S3 bucket with SSE-KMS and block all public access."
    references: ["https://docs.aws.amazon.com/fsx/latest/FileCacheGuide/create-file-cache.html"]
    tags: ["file-cache", "fsx", "s3", "encryption"]

  - id: TMAC-AWS-FILECACHE-005
    name: "File Cache without auto import/export policy defined"
    resource_type: "aws_fsx_file_cache"
    check: { attribute: "data_repository_associations.s3.auto_imported_path_filters", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "Without path filters on the data repository association, all files in the linked S3 bucket or NFS share are accessible through the cache."
    mitigation: "Define s3.auto_imported_path_filters to limit the scope of accessible paths."
    references: ["https://docs.aws.amazon.com/fsx/latest/FileCacheGuide/create-file-cache.html"]
    tags: ["file-cache", "fsx", "data-scope"]

  - id: TMAC-AWS-FILECACHE-006
    name: "File Cache without VPC subnet isolation"
    resource_type: "aws_fsx_file_cache"
    check: { attribute: "subnet_ids", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The File Cache does not declare subnet IDs; it may be reachable beyond intended compute subnets."
    mitigation: "Deploy the File Cache in private subnets used exclusively by HPC compute nodes."
    references: ["https://docs.aws.amazon.com/fsx/latest/FileCacheGuide/create-file-cache.html"]
    tags: ["file-cache", "fsx", "network", "subnet"]

  - id: TMAC-AWS-FILECACHE-007
    name: "File Cache with short retention period"
    resource_type: "aws_fsx_file_cache"
    check: { attribute: "file_cache_type_version", condition: "exists", values: [] }
    severity: "Low"
    stride: "Denial of Service"
    description: "File Cache does not persist data beyond cache eviction; HPC jobs that rely on cached data without re-importing face failures on eviction."
    mitigation: "Implement job-level data pre-staging and validate cache hit rates before running critical workloads."
    references: ["https://docs.aws.amazon.com/fsx/latest/FileCacheGuide/using-file-cache.html"]
    tags: ["file-cache", "fsx", "availability", "hpc"]

  - id: TMAC-AWS-FILECACHE-008
    name: "File Cache without tags"
    resource_type: "aws_fsx_file_cache"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The File Cache has no governance tags."
    mitigation: "Add environment, owner, and project tags."
    references: ["https://docs.aws.amazon.com/fsx/latest/FileCacheGuide/using-file-cache.html"]
    tags: ["file-cache", "fsx", "tagging"]

  # ------------------------------------------------------------------
  # AWS Elastic Disaster Recovery  (aws_drs_replication_configuration_template)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-DRS-001
    name: "DRS Replication Configuration without EBS encryption"
    resource_type: "aws_drs_replication_configuration_template"
    check: { attribute: "ebs_encryption", condition: "not_equals", values: ["CUSTOM"] }
    severity: "High"
    stride: "Information Disclosure"
    description: "DRS replication staging EBS volumes are not encrypted with a CMK; replication data in transit through staging areas is unprotected."
    mitigation: "Set ebs_encryption = CUSTOM and provide ebs_encryption_key_arn with a CMK."
    references: ["https://docs.aws.amazon.com/drs/latest/userguide/encryption-data-protection.html"]
    tags: ["drs", "disaster-recovery", "ebs", "encryption"]

  - id: TMAC-AWS-DRS-002
    name: "DRS Replication Configuration without a CMK key ARN"
    resource_type: "aws_drs_replication_configuration_template"
    check: { attribute: "ebs_encryption_key_arn", condition: "not_exists", values: [], and_check: { attribute: "ebs_encryption", condition: "equals", values: ["CUSTOM"] } }
    severity: "High"
    stride: "Information Disclosure"
    description: "EBS encryption is set to CUSTOM but no KMS key ARN is provided; replication volumes fall back to unencrypted."
    mitigation: "Specify ebs_encryption_key_arn with a valid CMK ARN."
    references: ["https://docs.aws.amazon.com/drs/latest/userguide/encryption-data-protection.html"]
    tags: ["drs", "disaster-recovery", "kms"]

  - id: TMAC-AWS-DRS-003
    name: "DRS Replication using public replication server"
    resource_type: "aws_drs_replication_configuration_template"
    check: { attribute: "create_public_ip", condition: "equals", values: [true] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The replication server is assigned a public IP; replication traffic from source to staging traverses the public internet."
    mitigation: "Set create_public_ip = false and use VPN/Direct Connect or a VPC endpoint for replication traffic."
    references: ["https://docs.aws.amazon.com/drs/latest/userguide/security-bp.html"]
    tags: ["drs", "disaster-recovery", "network", "replication"]

  - id: TMAC-AWS-DRS-004
    name: "DRS Replication Configuration with data plane routing over public internet"
    resource_type: "aws_drs_replication_configuration_template"
    check: { attribute: "data_plane_routing", condition: "equals", values: ["PUBLIC_IP"] }
    severity: "High"
    stride: "Information Disclosure"
    description: "Replication data is routed over public IPs; production data in transit is exposed on the public internet."
    mitigation: "Set data_plane_routing = PRIVATE_IP to route replication through VPC private networking."
    references: ["https://docs.aws.amazon.com/drs/latest/userguide/replication-server-settings.html"]
    tags: ["drs", "disaster-recovery", "network", "replication"]

  - id: TMAC-AWS-DRS-005
    name: "DRS Replication server without instance right-sizing"
    resource_type: "aws_drs_replication_configuration_template"
    check: { attribute: "replication_server_instance_type", condition: "regex", values: ["t2\\.nano|t2\\.micro|t3\\.nano"] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "The replication server uses an undersized instance type; replication lag increases, extending RPO during an outage."
    mitigation: "Use instance types appropriate to the replication bandwidth (e.g. t3.small or larger)."
    references: ["https://docs.aws.amazon.com/drs/latest/userguide/replication-server-settings.html"]
    tags: ["drs", "disaster-recovery", "availability", "rpo"]

  - id: TMAC-AWS-DRS-006
    name: "DRS Replication without bandwidth throttling"
    resource_type: "aws_drs_replication_configuration_template"
    check: { attribute: "bandwidth_throttling", condition: "equals", values: [0] }
    severity: "Low"
    stride: "Denial of Service"
    description: "No bandwidth throttling is set; DRS replication can saturate production network links, impacting source workloads."
    mitigation: "Set bandwidth_throttling to a value that reserves bandwidth for production traffic."
    references: ["https://docs.aws.amazon.com/drs/latest/userguide/replication-server-settings.html"]
    tags: ["drs", "disaster-recovery", "network", "bandwidth"]

  - id: TMAC-AWS-DRS-007
    name: "DRS Replication without dedicated security groups"
    resource_type: "aws_drs_replication_configuration_template"
    check: { attribute: "replication_servers_security_groups_ids", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The replication servers use no explicit security groups; default VPC SG may expose replication ports broadly."
    mitigation: "Assign dedicated security groups restricting inbound replication traffic to the DRS agent port (TCP 1500)."
    references: ["https://docs.aws.amazon.com/drs/latest/userguide/security-groups.html"]
    tags: ["drs", "disaster-recovery", "network", "security-group"]

  - id: TMAC-AWS-DRS-008
    name: "DRS Replication Configuration without tags"
    resource_type: "aws_drs_replication_configuration_template"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The DRS replication configuration template has no governance tags."
    mitigation: "Add environment, owner, and recovery-tier tags."
    references: ["https://docs.aws.amazon.com/drs/latest/userguide/tagging-resources.html"]
    tags: ["drs", "disaster-recovery", "tagging"]

  # ------------------------------------------------------------------
  # AWS Storage Gateway  (complements SGW-001)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-SGW-002
    name: "Storage Gateway without CloudWatch logging"
    resource_type: "aws_storagegateway_gateway"
    check: { attribute: "cloudwatch_log_group_arn", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Repudiation"
    description: "The gateway does not forward logs to CloudWatch; unauthorized data access or gateway errors go undetected."
    mitigation: "Set cloudwatch_log_group_arn to a CloudWatch Logs group encrypted with a KMS key."
    references: ["https://docs.aws.amazon.com/storagegateway/latest/userguide/monitoring-file-gateway.html"]
    tags: ["storage-gateway", "logging", "cloudwatch"]

  - id: TMAC-AWS-SGW-003
    name: "Storage Gateway without maintenance window"
    resource_type: "aws_storagegateway_gateway"
    check: { attribute: "maintenance_start_time", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Denial of Service"
    description: "No maintenance window is defined; firmware/software updates may be applied during business hours, causing unexpected I/O disruptions."
    mitigation: "Define maintenance_start_time during low-traffic hours."
    references: ["https://docs.aws.amazon.com/storagegateway/latest/userguide/MaintenanceManagingUpdate-common.html"]
    tags: ["storage-gateway", "maintenance", "availability"]

  - id: TMAC-AWS-SGW-004
    name: "Storage Gateway SMB share without valid user list"
    resource_type: "aws_storagegateway_smb_file_share"
    check: { attribute: "valid_user_list", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Elevation of Privilege"
    description: "The SMB file share has no valid_user_list restriction; any domain or local user can access the share."
    mitigation: "Restrict valid_user_list to specific AD groups or users."
    references: ["https://docs.aws.amazon.com/storagegateway/latest/userguide/CreatingAnSMBFileShare.html"]
    tags: ["storage-gateway", "smb", "access-control"]

  - id: TMAC-AWS-SGW-005
    name: "Storage Gateway SMB share with guest access"
    resource_type: "aws_storagegateway_smb_file_share"
    check: { attribute: "authentication", condition: "equals", values: ["GuestAccess"] }
    severity: "Critical"
    stride: "Spoofing"
    description: "The SMB share allows guest access without credentials; anyone on the network can read/write the share."
    mitigation: "Set authentication = ActiveDirectory and restrict valid_user_list."
    references: ["https://docs.aws.amazon.com/storagegateway/latest/userguide/CreatingAnSMBFileShare.html"]
    tags: ["storage-gateway", "smb", "auth", "guest-access"]

  - id: TMAC-AWS-SGW-006
    name: "Storage Gateway NFS share with unrestricted client access"
    resource_type: "aws_storagegateway_nfs_file_share"
    check: { attribute: "client_list", condition: "contains", values: ["0.0.0.0/0"] }
    severity: "Critical"
    stride: "Information Disclosure"
    description: "The NFS file share allows access from any IP (0.0.0.0/0); any host in the VPC or internet can mount and read/write the share."
    mitigation: "Restrict client_list to specific IP ranges or CIDRs of trusted compute hosts."
    references: ["https://docs.aws.amazon.com/storagegateway/latest/userguide/CreatingAnNFSFileShare.html"]
    tags: ["storage-gateway", "nfs", "network", "exposure"]

  - id: TMAC-AWS-SGW-007
    name: "Storage Gateway NFS share without KMS encryption"
    resource_type: "aws_storagegateway_nfs_file_share"
    check: { attribute: "kms_key_arn", condition: "not_exists", values: [], and_check: { attribute: "kms_encrypted", condition: "equals", values: [true] } }
    severity: "High"
    stride: "Information Disclosure"
    description: "The NFS file share is configured for KMS encryption but no CMK ARN is provided; the share uses the default aws/s3 key."
    mitigation: "Specify kms_key_arn with a CMK."
    references: ["https://docs.aws.amazon.com/storagegateway/latest/userguide/encryption-at-rest.html"]
    tags: ["storage-gateway", "nfs", "encryption", "kms"]

  - id: TMAC-AWS-SGW-008
    name: "Storage Gateway without SMB encryption"
    resource_type: "aws_storagegateway_smb_file_share"
    check: { attribute: "smb_acl_enabled", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "SMB ACLs are not enabled; Windows ACL enforcement on the share is absent, and share-level permissions may be inadequate."
    mitigation: "Set smb_acl_enabled = true to enforce Windows-style ACLs from AD."
    references: ["https://docs.aws.amazon.com/storagegateway/latest/userguide/smb-acl.html"]
    tags: ["storage-gateway", "smb", "acl", "access-control"]

  - id: TMAC-AWS-SGW-009
    name: "Storage Gateway cache disk too small"
    resource_type: "aws_storagegateway_cache"
    check: { attribute: "disk_id", condition: "exists", values: [] }
    severity: "Low"
    stride: "Denial of Service"
    description: "Cache disk sizing affects gateway performance; an undersized cache increases latency and can cause I/O stalls."
    mitigation: "Size the cache disk based on working set analysis; AWS recommends a minimum of 150 GiB."
    references: ["https://docs.aws.amazon.com/storagegateway/latest/userguide/ManagingLocalStorage-common.html"]
    tags: ["storage-gateway", "cache", "performance", "availability"]

  - id: TMAC-AWS-SGW-010
    name: "Storage Gateway without tags"
    resource_type: "aws_storagegateway_gateway"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Storage Gateway has no governance tags."
    mitigation: "Add environment, owner, and gateway-type tags."
    references: ["https://docs.aws.amazon.com/storagegateway/latest/userguide/tagging-resources.html"]
    tags: ["storage-gateway", "tagging"]

  # ==================================================================
  # IoT SERVICES — STRIDE + Threat Modeling per Element
  # Covers: IoT Core, IoT Analytics, IoT Device Defender,
  #         IoT Device Management, IoT Events, IoT ExpressLink,
  #         IoT FleetWise, IoT Greengrass, IoT SiteWise,
  #         IoT TwinMaker, FreeRTOS, IoT Button, Partner Device Catalog
  # ==================================================================

  # ------------------------------------------------------------------
  # aws_iot_policy  (IoT Core)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-IOTPOL-001
    name: "IoT Policy with wildcard resource"
    resource_type: "aws_iot_policy"
    check: { attribute: "policy", condition: "regex", values: ["\"Resource\"\\s*:\\s*\"\\*\""] }
    severity: "Critical"
    stride: "Elevation of Privilege"
    description: "The IoT policy allows actions on all resources (*). A compromised device can publish/subscribe to any MQTT topic, including those of other devices."
    mitigation: "Scope IoT policy resources to specific topic ARNs using device-specific substitution variables (${iot:Connection.Thing.ThingName})."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/iot-policies.html"]
    tags: ["iot", "iot-core", "policy", "mqtt"]

  - id: TMAC-AWS-IOTPOL-002
    name: "IoT Policy allowing Connect with wildcard clientId"
    resource_type: "aws_iot_policy"
    check: { attribute: "policy", condition: "regex", values: ["iot:Connect.*\"\\*\""] }
    severity: "High"
    stride: "Spoofing"
    description: "The IoT policy allows any clientId to connect; device impersonation is trivially possible."
    mitigation: "Restrict iot:Connect resource to arn:aws:iot:<region>:<account>:client/${iot:Connection.Thing.ThingName}."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/connect-iot-core.html"]
    tags: ["iot", "iot-core", "policy", "auth", "mqtt"]

  - id: TMAC-AWS-IOTPOL-003
    name: "IoT Policy allowing Publish to wildcard topic"
    resource_type: "aws_iot_policy"
    check: { attribute: "policy", condition: "regex", values: ["iot:Publish.*\"\\*\""] }
    severity: "High"
    stride: "Tampering"
    description: "The IoT policy allows publishing to any topic; a compromised device can inject messages into any fleet topic."
    mitigation: "Restrict iot:Publish to device-specific topic ARNs (e.g. dt/sensors/${iot:Connection.Thing.ThingName}/*)."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/pub-sub-policy.html"]
    tags: ["iot", "iot-core", "policy", "mqtt", "publish"]

  - id: TMAC-AWS-IOTPOL-004
    name: "IoT Policy allowing Subscribe to wildcard topic filter"
    resource_type: "aws_iot_policy"
    check: { attribute: "policy", condition: "regex", values: ["iot:Subscribe.*topicfilter/\\*"] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The IoT policy allows subscribing to all topic filters; a compromised device can eavesdrop on any fleet data."
    mitigation: "Restrict iot:Subscribe to device-specific topic filter ARNs."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/pub-sub-policy.html"]
    tags: ["iot", "iot-core", "policy", "mqtt", "subscribe"]

  - id: TMAC-AWS-IOTPOL-005
    name: "IoT Policy without tags"
    resource_type: "aws_iot_policy"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The IoT policy has no governance tags."
    mitigation: "Add environment, owner, and device-class tags."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/tagging-iot.html"]
    tags: ["iot", "iot-core", "policy", "tagging"]

  - id: TMAC-AWS-IOTPOL-006
    name: "IoT Policy allowing Shadow operations on all things"
    resource_type: "aws_iot_policy"
    check: { attribute: "policy", condition: "regex", values: ["iot:GetThingShadow|iot:UpdateThingShadow|iot:DeleteThingShadow"] }
    severity: "High"
    stride: "Tampering"
    description: "The IoT policy allows shadow operations without scoping to the connecting device's own thing; any device can alter another device's desired state."
    mitigation: "Scope shadow actions to arn:aws:iot:<region>:<account>:thing/${iot:Connection.Thing.ThingName}."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/device-shadow-document.html"]
    tags: ["iot", "iot-core", "shadow", "policy"]

  - id: TMAC-AWS-IOTPOL-007
    name: "IoT Policy allowing CreateCertificateFromCsr without conditions"
    resource_type: "aws_iot_policy"
    check: { attribute: "policy", condition: "regex", values: ["iot:CreateCertificateFromCsr"] }
    severity: "High"
    stride: "Elevation of Privilege"
    description: "The policy allows creating new certificates; a compromised device can generate credentials for additional unauthorized devices."
    mitigation: "Remove iot:CreateCertificateFromCsr from device policies; handle certificate provisioning in the backend."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/auto-register-device-cert.html"]
    tags: ["iot", "iot-core", "policy", "cert-provisioning"]

  - id: TMAC-AWS-IOTPOL-008
    name: "IoT Policy with Allow * on iot actions"
    resource_type: "aws_iot_policy"
    check: { attribute: "policy", condition: "regex", values: ["\"Action\"\\s*:\\s*\"iot:\\*\""] }
    severity: "Critical"
    stride: "Elevation of Privilege"
    description: "The IoT policy grants all IoT actions (iot:*); a compromised device has full IoT plane access."
    mitigation: "Replace iot:* with explicit actions required by the device (Connect, Publish, Subscribe, Receive)."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/iot-policies.html"]
    tags: ["iot", "iot-core", "policy", "wildcard"]

  # ------------------------------------------------------------------
  # aws_iot_certificate
  # ------------------------------------------------------------------
  - id: TMAC-AWS-IOTCERT-001
    name: "IoT Certificate in INACTIVE status"
    resource_type: "aws_iot_certificate"
    check: { attribute: "active", condition: "equals", values: [false] }
    severity: "Medium"
    stride: "Repudiation"
    description: "The IoT certificate is marked inactive but still exists; dangling certificates complicate audits and may be reactivated accidentally."
    mitigation: "Delete or revoke inactive certificates; automate certificate lifecycle management."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/x509-client-certs.html"]
    tags: ["iot", "iot-core", "certificate", "lifecycle"]

  - id: TMAC-AWS-IOTCERT-002
    name: "IoT Certificate not associated with a policy"
    resource_type: "aws_iot_certificate"
    check: { attribute: "csr", condition: "exists", values: [] }
    severity: "Medium"
    stride: "Spoofing"
    description: "A certificate without an attached policy cannot connect to IoT Core but represents a latent risk if policies are attached later without review."
    mitigation: "Associate only least-privilege policies at certificate issuance; audit unattached certificates regularly."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/attach-policy-to-certificate.html"]
    tags: ["iot", "iot-core", "certificate", "policy"]

  - id: TMAC-AWS-IOTCERT-003
    name: "IoT Certificate with long rotation period"
    resource_type: "aws_iot_certificate"
    check: { attribute: "active", condition: "equals", values: [true] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "IoT device certificates do not have a built-in expiry enforcement; without a rotation process, long-lived certificates are a persistent credential risk."
    mitigation: "Implement certificate rotation via IoT Device Management fleet provisioning or JITR and set a rotation schedule."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/rotate-certs.html"]
    tags: ["iot", "iot-core", "certificate", "rotation"]

  # ------------------------------------------------------------------
  # aws_iot_thing / aws_iot_thing_group / aws_iot_thing_type
  # ------------------------------------------------------------------
  - id: TMAC-AWS-IOTTHING-001
    name: "IoT Thing without a certificate attached"
    resource_type: "aws_iot_thing"
    check: { attribute: "name", condition: "regex", values: [".+"] }
    severity: "High"
    stride: "Spoofing"
    description: "An IoT Thing without a certificate attached has no authenticated identity; any client can claim the thing name."
    mitigation: "Always attach an active X.509 certificate to every Thing before deployment."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/thing-registry.html"]
    tags: ["iot", "iot-core", "thing", "auth"]

  - id: TMAC-AWS-IOTTHING-002
    name: "IoT Thing without a Thing Type"
    resource_type: "aws_iot_thing"
    check: { attribute: "thing_type_name", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Repudiation"
    description: "Things without a type cannot leverage type-level attribute schemas, making fleet audits and policy segmentation harder."
    mitigation: "Define thing_type_name to group devices by class and apply consistent attribute schemas."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/thing-types.html"]
    tags: ["iot", "iot-core", "thing", "governance"]

  - id: TMAC-AWS-IOTTHING-003
    name: "IoT Thing Group without a policy attached"
    resource_type: "aws_iot_thing_group"
    check: { attribute: "parent_group_name", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Elevation of Privilege"
    description: "A top-level thing group without an attached policy means group-level policy enforcement is not in place; individual device policies may be inconsistent."
    mitigation: "Attach a group-level IoT policy to the thing group for consistent fleet-wide enforcement."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/thing-groups.html"]
    tags: ["iot", "iot-core", "thing-group", "policy"]

  # ------------------------------------------------------------------
  # aws_iot_topic_rule
  # ------------------------------------------------------------------
  - id: TMAC-AWS-IOTRULE-001
    name: "IoT Topic Rule with error action missing"
    resource_type: "aws_iot_topic_rule"
    check: { attribute: "error_action", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Repudiation"
    description: "The topic rule has no error_action; failed rule evaluations are silently dropped with no logging or alerting."
    mitigation: "Define an error_action pointing to CloudWatch Logs or SNS for failed rule evaluations."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/rule-error-handling.html"]
    tags: ["iot", "iot-core", "rule", "logging"]

  - id: TMAC-AWS-IOTRULE-002
    name: "IoT Topic Rule disabled"
    resource_type: "aws_iot_topic_rule"
    check: { attribute: "enabled", condition: "equals", values: [false] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "The topic rule is disabled; device data is not processed by the intended pipeline, which may include security or alerting actions."
    mitigation: "Enable all production topic rules and monitor their status with CloudWatch."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/iot-rules.html"]
    tags: ["iot", "iot-core", "rule", "availability"]

  - id: TMAC-AWS-IOTRULE-003
    name: "IoT Topic Rule action writing to unencrypted S3"
    resource_type: "aws_iot_topic_rule"
    check: { attribute: "s3.key", condition: "exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The rule writes device telemetry to S3; verify the destination bucket enforces SSE-KMS."
    mitigation: "Ensure the S3 action destination bucket uses SSE-KMS with a CMK and blocks public access."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/iot-rule-actions.html"]
    tags: ["iot", "iot-core", "rule", "s3", "encryption"]

  - id: TMAC-AWS-IOTRULE-004
    name: "IoT Topic Rule role with AdministratorAccess"
    resource_type: "aws_iot_topic_rule"
    check: { attribute: "s3.role_arn", condition: "regex", values: ["AdministratorAccess|FullAccess"] }
    severity: "Critical"
    stride: "Elevation of Privilege"
    description: "The topic rule execution role has excessive permissions; a malformed device message could trigger unintended AWS actions."
    mitigation: "Scope the rule role to the specific S3 buckets, Kinesis streams, or Lambda functions the rule needs."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/iot-create-role.html"]
    tags: ["iot", "iot-core", "rule", "iam"]

  - id: TMAC-AWS-IOTRULE-005
    name: "IoT Topic Rule invoking Lambda without error handling"
    resource_type: "aws_iot_topic_rule"
    check: { attribute: "lambda.function_arn", condition: "exists", values: [], and_check: { attribute: "error_action", condition: "not_exists", values: [] } }
    severity: "Medium"
    stride: "Denial of Service"
    description: "The rule invokes a Lambda function but has no error_action; Lambda throttling or failures silently drop device messages."
    mitigation: "Add an error_action to a DLQ (SQS) or CloudWatch Logs."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/rule-error-handling.html"]
    tags: ["iot", "iot-core", "rule", "lambda", "dlq"]

  - id: TMAC-AWS-IOTRULE-006
    name: "IoT Topic Rule without tags"
    resource_type: "aws_iot_topic_rule"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The IoT topic rule has no governance tags."
    mitigation: "Add environment and owner tags."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/tagging-iot.html"]
    tags: ["iot", "iot-core", "rule", "tagging"]

  # ------------------------------------------------------------------
  # aws_iot_domain_configuration  (IoT Core custom endpoints)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-IOTDOMAIN-001
    name: "IoT Domain Configuration without custom authorizer"
    resource_type: "aws_iot_domain_configuration"
    check: { attribute: "authorizer_config", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Spoofing"
    description: "The custom domain configuration has no custom authorizer; devices must use X.509 mutual TLS without additional token-based auth."
    mitigation: "For HTTP/WebSocket clients, configure authorizer_config with a Lambda-based custom authorizer."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/custom-authorizer.html"]
    tags: ["iot", "iot-core", "domain", "auth"]

  - id: TMAC-AWS-IOTDOMAIN-002
    name: "IoT Domain Configuration allowing unsigned token"
    resource_type: "aws_iot_domain_configuration"
    check: { attribute: "authorizer_config.allow_authorizer_override", condition: "equals", values: [true] }
    severity: "High"
    stride: "Spoofing"
    description: "The authorizer allows override; clients can bypass the default authorizer by specifying another, enabling unauthorized access."
    mitigation: "Set allow_authorizer_override = false unless multiple authorizers are explicitly required."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/custom-authorizer.html"]
    tags: ["iot", "iot-core", "domain", "auth"]

  - id: TMAC-AWS-IOTDOMAIN-003
    name: "IoT Domain Configuration without tags"
    resource_type: "aws_iot_domain_configuration"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The IoT domain configuration has no governance tags."
    mitigation: "Add environment and owner tags."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/tagging-iot.html"]
    tags: ["iot", "iot-core", "domain", "tagging"]

  # ------------------------------------------------------------------
  # aws_iot_logging_options / aws_iot_account_audit_configuration
  # ------------------------------------------------------------------
  - id: TMAC-AWS-IOTLOG-001
    name: "IoT Core logging not enabled"
    resource_type: "aws_iot_logging_options"
    check: { attribute: "default_log_level", condition: "equals", values: ["DISABLED"] }
    severity: "High"
    stride: "Repudiation"
    description: "IoT Core logging is disabled; unauthorized connections, rule failures, and policy denials are not captured."
    mitigation: "Set default_log_level = ERROR (or WARN) and forward logs to CloudWatch Logs."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/configure-logging.html"]
    tags: ["iot", "iot-core", "logging"]

  - id: TMAC-AWS-IOTAUDIT-001
    name: "IoT Device Defender audit not enabled"
    resource_type: "aws_iot_account_audit_configuration"
    check: { attribute: "audit_check_configurations", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Repudiation"
    description: "IoT Device Defender audit checks are not configured; misconfigurations (overly permissive policies, shared certs) go undetected."
    mitigation: "Enable all relevant audit checks in audit_check_configurations and schedule daily audits."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/device-defender-audit.html"]
    tags: ["iot", "iot-defender", "audit"]

  - id: TMAC-AWS-IOTAUDIT-002
    name: "IoT Device Defender audit without SNS notifications"
    resource_type: "aws_iot_account_audit_configuration"
    check: { attribute: "audit_notification_target_configurations", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Repudiation"
    description: "Audit findings are not routed to SNS; security misconfigurations are not alerted to the operations team."
    mitigation: "Configure audit_notification_target_configurations with an SNS topic for audit findings."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/device-defender-audit.html"]
    tags: ["iot", "iot-defender", "audit", "alerting"]

  - id: TMAC-AWS-IOTAUDIT-003
    name: "IoT Device Defender mitigation action not configured"
    resource_type: "aws_iot_mitigation_action"
    check: { attribute: "action_params", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "The mitigation action has no action_params; audit finding remediation cannot execute automatically."
    mitigation: "Define action_params with the appropriate remediation type (DEACTIVATE_DEVICE_CERT, PUBLISH_FINDING_TO_SNS, etc.)."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/device-defender-mitigation-actions.html"]
    tags: ["iot", "iot-defender", "mitigation"]

  # ------------------------------------------------------------------
  # aws_iot_security_profile  (IoT Device Defender)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-IOTSEC-001
    name: "IoT Security Profile without behaviors defined"
    resource_type: "aws_iot_security_profile"
    check: { attribute: "behaviors", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Tampering"
    description: "The Defender security profile has no behaviors; anomalous device activity (unexpected ports, high message rate) is not detected."
    mitigation: "Define behaviors for message size, source IP, TCP connections, and authorization failures."
