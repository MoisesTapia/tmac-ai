    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "Fraud Detector models and training data are not encrypted with a CMK, exposing transaction pattern data."
    mitigation: "Ensure the Fraud Detector service uses a CMK via AWS-managed encryption settings."
    references: ["https://docs.aws.amazon.com/frauddetector/latest/ug/data-protection.html"]
    tags: ["fraud-detector", "ml", "encryption"]

  - id: TMAC-AWS-FRAUDDET-004
