  - id: TMAC-AWS-BEDROCKGR-002
    name: "Bedrock Guardrail without content filters"
    resource_type: "aws_bedrock_guardrail"
    check: { attribute: "content_policy_config", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Tampering"
    description: "No content filter is configured; the model may generate hate speech, violence, or explicit material."
    mitigation: "Configure content_policy_config with appropriate strength thresholds for all categories."
