    references: ["https://docs.aws.amazon.com/pinpoint/latest/developerguide/event-streams.html"]
    tags: ["pinpoint", "events"]

  - id: TMAC-AWS-PINSTREAM-003
    name: "Pinpoint Event Stream without an associated app"
