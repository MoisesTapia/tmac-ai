    stride: "Information Disclosure"
    description: "The event stream destination appears non-production; avoid mixing prod events with test environments."
    mitigation: "Segregate streams by environment."
    references: ["https://docs.aws.amazon.com/pinpoint/latest/developerguide/event-streams.html"]
    tags: ["pinpoint", "events", "segregation"]

  - id: TMAC-AWS-PINSTREAM-008
