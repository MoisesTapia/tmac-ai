    stride: "Information Disclosure"
    description: "CodeGuru uses AWS-managed encryption for analysis data by default; a CMK provides better key rotation and audit control."
    mitigation: "Set kms_key_details.encryption_option = CUSTOMER_MANAGED_CMK."
