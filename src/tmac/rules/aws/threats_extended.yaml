  # ------------------------------------------------------------------
  - id: TMAC-AWS-BEDROCK-001
    name: "Bedrock model invocation logging disabled"
    resource_type: "aws_bedrock_model_invocation_logging_configuration"
    check: { attribute: "logging_config.text_data_delivery_enabled", condition: "equals", values: [false] }
    severity: "High"
    stride: "Repudiation"
    description: "Text prompt/response logging is disabled; adversarial prompt injection or data extraction via Bedrock goes undetected."
    mitigation: "Enable text_data_delivery_enabled = true and route logs to encrypted CloudWatch/S3."
    references: ["https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html"]
    tags: ["bedrock", "logging", "ml", "ai"]

  - id: TMAC-AWS-BEDROCK-002
    name: "Bedrock logging to unencrypted S3"
    resource_type: "aws_bedrock_model_invocation_logging_configuration"
    check: { attribute: "logging_config.s3_config.kms_key_id", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "Bedrock invocation logs are delivered to S3 without KMS encryption; prompt/response data containing PII may be exposed."
    mitigation: "Set logging_config.s3_config.kms_key_id to a CMK."
    references: ["https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html"]
    tags: ["bedrock", "logging", "encryption", "ml", "ai"]

  - id: TMAC-AWS-BEDROCK-003
    name: "Bedrock image data logging disabled"
    resource_type: "aws_bedrock_model_invocation_logging_configuration"
    check: { attribute: "logging_config.image_data_delivery_enabled", condition: "equals", values: [false] }
    severity: "Medium"
    stride: "Repudiation"
    description: "Image prompt logging is disabled; multimodal prompt injection or sensitive image extraction via Bedrock cannot be audited."
    mitigation: "Enable image_data_delivery_enabled = true."
    references: ["https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html"]
    tags: ["bedrock", "logging", "multimodal", "ml", "ai"]

  - id: TMAC-AWS-BEDROCK-004
    name: "Bedrock embedding logging disabled"
    resource_type: "aws_bedrock_model_invocation_logging_configuration"
    check: { attribute: "logging_config.embedding_data_delivery_enabled", condition: "equals", values: [false] }
    severity: "Medium"
    stride: "Repudiation"
    description: "Embedding request logging is disabled; inference requests to embedding models cannot be audited."
    mitigation: "Enable embedding_data_delivery_enabled = true."
    references: ["https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html"]
    tags: ["bedrock", "logging", "embeddings", "ml", "ai"]

  - id: TMAC-AWS-BEDROCK-005
    name: "Bedrock without CloudWatch logging"
    resource_type: "aws_bedrock_model_invocation_logging_configuration"
    check: { attribute: "logging_config.cloudwatch_config.log_group_name", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Repudiation"
    description: "No CloudWatch log group is configured; near-real-time alerting on anomalous Bedrock usage is not possible."
    mitigation: "Configure logging_config.cloudwatch_config with a log group and role ARN."
    references: ["https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html"]
    tags: ["bedrock", "logging", "cloudwatch", "ml", "ai"]

