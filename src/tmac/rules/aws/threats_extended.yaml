  - id: TMAC-AWS-SMTJ-004
    name: "SageMaker Training Job without VPC"
    resource_type: "aws_sagemaker_training_job"
    check: { attribute: "vpc_config", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The training job runs outside a VPC, leaving data channels unprotected."
    mitigation: "Define vpc_config with private subnets and a security group blocking internet egress."
    references: ["https://docs.aws.amazon.com/sagemaker/latest/dg/train-vpc.html"]
    tags: ["sagemaker", "training", "network", "ml"]

  - id: TMAC-AWS-SMTJ-005
    name: "SageMaker Training Job storage volume without encryption"
    resource_type: "aws_sagemaker_training_job"
    check: { attribute: "resource_config.volume_kms_key_id", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The training EBS volume is not encrypted with a CMK; raw training data and checkpoints are at risk."
    mitigation: "Specify resource_config { volume_kms_key_id = <CMK> }."
    references: ["https://docs.aws.amazon.com/sagemaker/latest/dg/encryption-at-rest.html"]
    tags: ["sagemaker", "training", "encryption", "ml"]

  - id: TMAC-AWS-SMTJ-006
    name: "SageMaker Training Job with public S3 input data"
    resource_type: "aws_sagemaker_training_job"
    check: { attribute: "input_data_config.data_source.s3_data_source.s3_uri", condition: "regex", values: ["^s3://(?!.*private)"] }
    severity: "Medium"
    stride: "Tampering"
    description: "Training input data could come from an uncontrolled S3 location, enabling data poisoning attacks."
    mitigation: "Use S3 URIs from private, account-owned buckets with object integrity controls."
    references: ["https://docs.aws.amazon.com/sagemaker/latest/dg/model-access-training-data.html"]
