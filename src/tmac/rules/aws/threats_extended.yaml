  # ------------------------------------------------------------------
  # aws_greengrassv2_component_version / _deployment
  # ------------------------------------------------------------------
  - id: TMAC-AWS-GGV2-001
    name: "Greengrass v2 Component from public S3"
    resource_type: "aws_greengrassv2_component_version"
    check: { attribute: "lambda_function.lambda_arn", condition: "not_exists", values: [], and_check: { attribute: "inline_recipe", condition: "regex", values: ["uri.*s3://(?!.*private)"] } }
    severity: "High"
    stride: "Tampering"
    description: "The Greengrass component recipe references a public or uncontrolled S3 URI; an adversary can replace the artifact with malicious code."
    mitigation: "Host component artifacts in private, account-owned S3 buckets with Object Lock and deploy via CodePipeline."
    references: ["https://docs.aws.amazon.com/greengrass/v2/developerguide/greengrass-components.html"]
    tags: ["greengrass", "iot-greengrass", "component", "supply-chain"]

  - id: TMAC-AWS-GGV2-002
    name: "Greengrass v2 Component without digest verification"
    resource_type: "aws_greengrassv2_component_version"
    check: { attribute: "inline_recipe", condition: "not_regex", values: ["digest"] }
    severity: "High"
    stride: "Tampering"
    description: "Component artifacts in the recipe do not include a digest hash; tampered artifacts are not detected before installation on the device."
    mitigation: "Include SHA-256 digest fields for all component artifacts in the recipe."
    references: ["https://docs.aws.amazon.com/greengrass/v2/developerguide/component-recipe-reference.html"]
    tags: ["greengrass", "iot-greengrass", "component", "integrity"]

  - id: TMAC-AWS-GGV2-003
    name: "Greengrass v2 Deployment without rollback configuration"
    resource_type: "aws_greengrassv2_deployment"
    check: { attribute: "deployment_policies.failure_handling_policy", condition: "not_equals", values: ["ROLLBACK"] }
    severity: "High"
    stride: "Denial of Service"
    description: "The deployment policy does not specify ROLLBACK on failure; a broken component deployment can brick edge devices with no automatic recovery."
    mitigation: "Set deployment_policies { failure_handling_policy = ROLLBACK }."
    references: ["https://docs.aws.amazon.com/greengrass/v2/developerguide/create-deployments.html"]
    tags: ["greengrass", "iot-greengrass", "deployment", "availability"]

  - id: TMAC-AWS-GGV2-004
    name: "Greengrass v2 Core device running as root"
    resource_type: "aws_greengrassv2_deployment"
    check: { attribute: "components", condition: "regex", values: ["runWith.*posixUser.*root"] }
    severity: "Critical"
    stride: "Elevation of Privilege"
    description: "A Greengrass component is configured to run as root; a compromised component has full control of the edge device."
    mitigation: "Configure runWith.posixUser to a least-privilege non-root user in all component recipes."
    references: ["https://docs.aws.amazon.com/greengrass/v2/developerguide/run-as-user.html"]
    tags: ["greengrass", "iot-greengrass", "privilege", "edge"]

  - id: TMAC-AWS-GGV2-005
    name: "Greengrass v2 Deployment without IoT job configuration"
    resource_type: "aws_greengrassv2_deployment"
    check: { attribute: "iot_job_configuration", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "No IoT job configuration is defined for the deployment; there is no rate control, timeout, or abort criteria for rolling out to the fleet."
    mitigation: "Configure iot_job_configuration with rollout_config, abort_config, and timeout_config."
    references: ["https://docs.aws.amazon.com/greengrass/v2/developerguide/create-deployments.html"]
    tags: ["greengrass", "iot-greengrass", "deployment", "fleet"]

  - id: TMAC-AWS-GGV2-006
    name: "Greengrass v2 Component recipe with secrets in environment variables"
    resource_type: "aws_greengrassv2_component_version"
    check: { attribute: "inline_recipe", condition: "regex", values: ["(?i)(password|secret|api.key|token)\\s*[:=]"] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The component recipe contains sensitive values in environment variables, visible in the Terraform state and on-device."
    mitigation: "Use the Greengrass secret manager component to inject secrets from AWS Secrets Manager."
    references: ["https://docs.aws.amazon.com/greengrass/v2/developerguide/secret-manager-component.html"]
    tags: ["greengrass", "iot-greengrass", "component", "secrets"]

  - id: TMAC-AWS-GGV2-007
    name: "Greengrass v2 Deployment without tags"
    resource_type: "aws_greengrassv2_deployment"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Greengrass deployment has no governance tags."
    mitigation: "Add environment, device-class, and version tags."
    references: ["https://docs.aws.amazon.com/greengrass/v2/developerguide/tag-resources.html"]
    tags: ["greengrass", "iot-greengrass", "deployment", "tagging"]

  - id: TMAC-AWS-GGV2-008
    name: "Greengrass v2 Component without tags"
    resource_type: "aws_greengrassv2_component_version"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Greengrass component version has no governance tags."
    mitigation: "Add environment, device-class, and project tags."
    references: ["https://docs.aws.amazon.com/greengrass/v2/developerguide/tag-resources.html"]
    tags: ["greengrass", "iot-greengrass", "component", "tagging"]

