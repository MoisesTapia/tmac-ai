  - id: TMAC-AWS-TWINMAKER-004
    name: "IoT TwinMaker Scene without access controls"
    resource_type: "aws_iottwinmaker_scene"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "TwinMaker scenes visualize physical facility layouts; without proper tagging and IAM conditions, unauthorized users can view sensitive OT plant layouts."
    mitigation: "Restrict GetScene/ListScenes permissions to authorized roles; tag scenes for ABAC."
    references: ["https://docs.aws.amazon.com/iot-twinmaker/latest/guide/scenes.html"]
    tags: ["iot-twinmaker", "scene", "access-control", "ot"]

  - id: TMAC-AWS-TWINMAKER-005
    name: "IoT TwinMaker Entity with public component type"
    resource_type: "aws_iottwinmaker_entity"
    check: { attribute: "components", condition: "exists", values: [] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "TwinMaker entities expose OT asset hierarchy and real-time sensor data; verify that component type data sources (SiteWise, Timestream) are not over-shared."
    mitigation: "Restrict GetEntity/GetPropertyValue API to authorized roles using IAM resource conditions on workspace ARN."
    references: ["https://docs.aws.amazon.com/iot-twinmaker/latest/guide/twinmaker-entities.html"]
    tags: ["iot-twinmaker", "entity", "iam", "ot"]

  - id: TMAC-AWS-TWINMAKER-006
    name: "IoT TwinMaker Component Type without data connector scoping"
    resource_type: "aws_iottwinmaker_component_type"
    check: { attribute: "data_connector", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Tampering"
    description: "Component types without a data connector can read from any IoT SiteWise asset; unscopped connectors expose all OT data."
    mitigation: "Define data_connector with explicit Lambda ARN and timeout; scope the Lambda's IAM role to specific SiteWise assets."
    references: ["https://docs.aws.amazon.com/iot-twinmaker/latest/guide/component-types.html"]
    tags: ["iot-twinmaker", "component-type", "data-connector", "ot"]

  - id: TMAC-AWS-TWINMAKER-007
    name: "IoT TwinMaker Entity without tags"
    resource_type: "aws_iottwinmaker_entity"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The TwinMaker entity has no governance tags."
    mitigation: "Add facility, asset-type, and owner tags."
    references: ["https://docs.aws.amazon.com/iot-twinmaker/latest/guide/tagging-resources.html"]
    tags: ["iot-twinmaker", "entity", "tagging"]

  - id: TMAC-AWS-TWINMAKER-008
    name: "IoT TwinMaker Component Type without tags"
    resource_type: "aws_iottwinmaker_component_type"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The TwinMaker component type has no governance tags."
    mitigation: "Add equipment-class and owner tags."
    references: ["https://docs.aws.amazon.com/iot-twinmaker/latest/guide/tagging-resources.html"]
    tags: ["iot-twinmaker", "component-type", "tagging"]

  # ------------------------------------------------------------------
  # aws_iotfleetwise_fleet / _vehicle / _campaign / _signal_catalog
  # ------------------------------------------------------------------
  - id: TMAC-AWS-FLEETWISE-001
    name: "IoT FleetWise Campaign sending data to unencrypted S3"
    resource_type: "aws_iotfleetwise_campaign"
    check: { attribute: "data_destination_configs.s3_config.bucket_arn", condition: "exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The FleetWise campaign writes vehicle telemetry to S3; verify the bucket enforces SSE-KMS."
    mitigation: "Ensure the S3 destination bucket uses SSE-KMS with a CMK and blocks public access."
    references: ["https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/security-data-protection.html"]
    tags: ["iot-fleetwise", "campaign", "s3", "encryption", "vehicle-data"]

  - id: TMAC-AWS-FLEETWISE-002
    name: "IoT FleetWise Campaign without data compression"
    resource_type: "aws_iotfleetwise_campaign"
    check: { attribute: "compression", condition: "equals", values: ["OFF"] }
    severity: "Low"
    stride: "Denial of Service"
    description: "Data compression is off; high-frequency vehicle telemetry generates excessive storage and transfer costs, potentially causing throttling."
    mitigation: "Set compression = SNAPPY for high-frequency signal campaigns."
    references: ["https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/create-campaign.html"]
    tags: ["iot-fleetwise", "campaign", "compression", "cost"]

  - id: TMAC-AWS-FLEETWISE-003
    name: "IoT FleetWise Vehicle without decoder manifest"
    resource_type: "aws_iotfleetwise_vehicle"
    check: { attribute: "decoder_manifest_arn", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Tampering"
    description: "A vehicle without a decoder manifest cannot have its signals validated; raw CAN/OBD data may be misinterpreted or maliciously injected."
    mitigation: "Associate a valid decoder_manifest_arn with all FleetWise vehicles."
    references: ["https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/decoder-manifests.html"]
    tags: ["iot-fleetwise", "vehicle", "decoder", "can-bus"]

  - id: TMAC-AWS-FLEETWISE-004
    name: "IoT FleetWise Fleet without tags"
    resource_type: "aws_iotfleetwise_fleet"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The FleetWise fleet has no governance tags."
    mitigation: "Add fleet-id, region, and owner tags."
    references: ["https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/tagging-resources.html"]
    tags: ["iot-fleetwise", "fleet", "tagging"]

  - id: TMAC-AWS-FLEETWISE-005
    name: "IoT FleetWise Signal Catalog without tags"
    resource_type: "aws_iotfleetwise_signal_catalog"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The FleetWise signal catalog has no governance tags."
    mitigation: "Add vehicle-class and owner tags."
    references: ["https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/tagging-resources.html"]
    tags: ["iot-fleetwise", "signal-catalog", "tagging"]

  - id: TMAC-AWS-FLEETWISE-006
    name: "IoT FleetWise Campaign collecting high-PII signals"
    resource_type: "aws_iotfleetwise_campaign"
    check: { attribute: "signals_to_collect.name", condition: "regex", values: ["(?i)(gps|location|latitude|longitude|speed|driver)"] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The campaign collects high-privacy vehicle signals (GPS, speed, driver data); without data minimization policies this may violate GDPR/CCPA."
    mitigation: "Implement data minimization; pseudonymize vehicle identifiers; restrict data access to authorized data scientists."
    references: ["https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/security.html"]
    tags: ["iot-fleetwise", "campaign", "pii", "privacy", "gdpr"]

  - id: TMAC-AWS-FLEETWISE-007
    name: "IoT FleetWise Vehicle without model manifest"
    resource_type: "aws_iotfleetwise_vehicle"
    check: { attribute: "model_manifest_arn", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Tampering"
    description: "A vehicle without a model manifest has no validated signal schema; unknown signals may be ingested without validation."
    mitigation: "Associate a valid model_manifest_arn with all FleetWise vehicles."
    references: ["https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/vehicle-models.html"]
    tags: ["iot-fleetwise", "vehicle", "model-manifest", "data-integrity"]

  - id: TMAC-AWS-FLEETWISE-008
    name: "IoT FleetWise Campaign without tags"
    resource_type: "aws_iotfleetwise_campaign"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The FleetWise campaign has no governance tags."
    mitigation: "Add fleet-id, data-classification, and owner tags."
    references: ["https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/tagging-resources.html"]
    tags: ["iot-fleetwise", "campaign", "tagging"]

  # ------------------------------------------------------------------
  # FreeRTOS / IoT Button / Partner Device Catalog
  # (modeled via IAM, IoT Core policy, and OTA update resources)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-FREERTOS-001
    name: "FreeRTOS OTA Job signing not enforced"
    resource_type: "aws_iot_topic_rule"
    check: { attribute: "tags.FreeRTOS", condition: "exists", values: [] }
    severity: "Critical"
    stride: "Tampering"
    description: "FreeRTOS OTA firmware updates must be signed with a trusted code-signing certificate; without signature enforcement, malicious firmware can be deployed to devices."
    mitigation: "Enable AWS IoT Code Signing for OTA updates and configure ota_signing_profile on all OTA jobs."
    references: ["https://docs.aws.amazon.com/freertos/latest/userguide/freertos-ota-dev.html"]
    tags: ["freertos", "iot", "ota", "firmware", "supply-chain"]

  - id: TMAC-AWS-FREERTOS-002
    name: "FreeRTOS device using default TLS configuration"
    resource_type: "aws_iot_thing"
    check: { attribute: "attributes.platform", condition: "equals", values: ["freertos"] }
    severity: "High"
    stride: "Information Disclosure"
    description: "FreeRTOS devices connecting to IoT Core must use TLS 1.2+ mutual authentication; default or weak TLS configurations expose device communications."
    mitigation: "Configure the FreeRTOS TLS library with strong cipher suites and validate the IoT Core server certificate."
    references: ["https://docs.aws.amazon.com/freertos/latest/userguide/tls-security.html"]
    tags: ["freertos", "iot", "tls", "embedded"]

  - id: TMAC-AWS-FREERTOS-003
    name: "FreeRTOS device credentials stored in flash without protection"
    resource_type: "aws_iot_certificate"
    check: { attribute: "active", condition: "equals", values: [true] }
    severity: "High"
    stride: "Information Disclosure"
    description: "FreeRTOS device certificates stored in unprotected flash memory can be extracted via JTAG/UART debug interfaces."
    mitigation: "Store device credentials in secure elements (ATECC608A) or hardware secure modules; disable JTAG in production."
    references: ["https://docs.aws.amazon.com/freertos/latest/userguide/security.html"]
    tags: ["freertos", "iot", "certificate", "hardware-security", "embedded"]

  - id: TMAC-AWS-FREERTOS-004
    name: "FreeRTOS device without fleet provisioning"
    resource_type: "aws_iot_provisioning_template"
    check: { attribute: "enabled", condition: "equals", values: [false] }
    severity: "Medium"
    stride: "Spoofing"
    description: "Fleet provisioning is disabled or not configured; devices may be manually provisioned with shared certificates, increasing impersonation risk."
    mitigation: "Use AWS IoT Fleet Provisioning with unique per-device certificates via claim certificates."
    references: ["https://docs.aws.amazon.com/iot/latest/developerguide/provision-wo-cert.html"]
    tags: ["freertos", "iot", "provisioning", "fleet"]

  - id: TMAC-AWS-FREERTOS-005
    name: "FreeRTOS OTA without rollback capability"
    resource_type: "aws_iot_topic_rule"
    check: { attribute: "tags.OTA", condition: "exists", values: [], and_check: { attribute: "tags.Rollback", condition: "not_exists", values: [] } }
    severity: "High"
    stride: "Denial of Service"
    description: "FreeRTOS OTA updates without a rollback mechanism leave devices bricked on failed updates."
    mitigation: "Implement a rollback mechanism in the OTA update agent that restores the previous firmware on boot failure."
    references: ["https://docs.aws.amazon.com/freertos/latest/userguide/ota-agent-library.html"]
    tags: ["freertos", "iot", "ota", "firmware", "availability"]

  - id: TMAC-AWS-IOTBTN-001
    name: "IoT Button certificate not rotated after first activation"
    resource_type: "aws_iot_certificate"
    check: { attribute: "active", condition: "equals", values: [true] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "IoT 1-Click buttons use pre-provisioned certificates; without a post-activation rotation process, the original certificate is a long-lived credential risk."
    mitigation: "Rotate the device certificate and associate a least-privilege policy after initial activation."
    references: ["https://docs.aws.amazon.com/iot-1-click/latest/developerguide/security.html"]
    tags: ["iot-button", "iot-1click", "certificate", "rotation"]

  - id: TMAC-AWS-IOTBTN-002
    name: "IoT Button action invoking Lambda without rate limiting"
    resource_type: "aws_iot_topic_rule"
    check: { attribute: "lambda.function_arn", condition: "exists", values: [], and_check: { attribute: "tags.IoTButton", condition: "exists", values: [] } }
    severity: "Medium"
    stride: "Denial of Service"
    description: "IoT button Lambda actions without rate limiting can be triggered repeatedly, causing unexpected costs or downstream service abuse."
    mitigation: "Add a reserved concurrency limit on the Lambda function and implement idempotency with DynamoDB or EventBridge."
    references: ["https://docs.aws.amazon.com/iot-1-click/latest/developerguide/getting-started.html"]
    tags: ["iot-button", "iot-1click", "lambda", "rate-limiting"]

  - id: TMAC-AWS-IOTBTN-003
    name: "IoT Button project without tags"
    resource_type: "aws_iot1click_project"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The IoT 1-Click project has no governance tags."
    mitigation: "Add environment and owner tags."
    references: ["https://docs.aws.amazon.com/iot-1-click/latest/developerguide/1click-appendix.html"]
    tags: ["iot-button", "iot-1click", "tagging"]

  # ==================================================================
  # SECURITY SERVICES — STRIDE + Threat Modeling per Element
  # New coverage: Detective, GuardDuty, Inspector, Macie,
  #   Security Lake, Verified Permissions, Artifact, Audit Manager,
  #   CloudHSM, Directory Service, Firewall Manager,
  #   Network Firewall, RAM, Security Hub, Shield,
  #   IAM Identity Center, WAF Captcha
  # Complements: Cognito (24), ACM (8), IAM (33), KMS (16),
  #   Secrets Manager (16), WAF (17) — already covered
  # ==================================================================

  # ------------------------------------------------------------------
  # Amazon Detective
  # ------------------------------------------------------------------
  - id: TMAC-AWS-DETECTIVE-001
    name: "Detective Graph without member accounts"
    resource_type: "aws_detective_graph"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Repudiation"
    description: "The Detective graph has no governance tags and likely no member accounts; investigation scope is limited to the master account."
    mitigation: "Add environment/owner tags and invite all relevant accounts as members."
    references: ["https://docs.aws.amazon.com/detective/latest/adminguide/graph-master-account-admin.html"]
    tags: ["detective", "security", "tagging"]

  - id: TMAC-AWS-DETECTIVE-002
    name: "Detective Member not accepting invitation"
    resource_type: "aws_detective_member"
    check: { attribute: "disable_email_notification", condition: "equals", values: [true] }
    severity: "Medium"
    stride: "Repudiation"
    description: "Email notifications are disabled for the member invitation; the account owner may not be aware they are being enrolled in Detective."
    mitigation: "Enable email notifications or obtain explicit consent before enrolling member accounts."
    references: ["https://docs.aws.amazon.com/detective/latest/adminguide/member-account-ds-enable.html"]
    tags: ["detective", "member", "governance"]

  - id: TMAC-AWS-DETECTIVE-003
    name: "Detective Graph not enabled in all regions"
    resource_type: "aws_detective_graph"
    check: { attribute: "created_time", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Repudiation"
    description: "Detective graphs not deployed in all active regions leave blind spots for lateral movement across regions."
    mitigation: "Enable Detective in every region where workloads are deployed; use AWS Organizations to automate."
    references: ["https://docs.aws.amazon.com/detective/latest/adminguide/enable-detective.html"]
    tags: ["detective", "multi-region", "coverage"]

  - id: TMAC-AWS-DETECTIVE-004
    name: "Detective Organization Admin not delegated"
    resource_type: "aws_detective_organization_admin_account"
    check: { attribute: "account_id", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Elevation of Privilege"
    description: "No delegated admin account is configured for Detective in AWS Organizations; each account manages its own graph without centralized visibility."
    mitigation: "Delegate a dedicated security account as Detective admin for the entire organization."
    references: ["https://docs.aws.amazon.com/detective/latest/adminguide/delegated-admin-account.html"]
    tags: ["detective", "organizations", "delegated-admin"]

  - id: TMAC-AWS-DETECTIVE-005
    name: "Detective invitation sent to external email"
    resource_type: "aws_detective_member"
    check: { attribute: "email_address", condition: "regex", values: ["(?i)(gmail|yahoo|hotmail|outlook\\.com)"] }
    severity: "High"
    stride: "Information Disclosure"
    description: "Detective member invitation is sent to a personal email; investigation findings may be shared with unauthorized individuals."
    mitigation: "Use corporate email addresses only for Detective member invitations."
    references: ["https://docs.aws.amazon.com/detective/latest/adminguide/member-account-ds-enable.html"]
    tags: ["detective", "member", "information-disclosure"]

  - id: TMAC-AWS-DETECTIVE-006
    name: "Detective Graph data retention not monitored"
    resource_type: "aws_detective_graph"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Repudiation"
    description: "Detective retains data for up to 1 year by default; without monitoring, retention cost and data exposure are uncontrolled."
    mitigation: "Monitor Detective data retention via AWS Cost Explorer and ensure data classification tags are applied."
    references: ["https://docs.aws.amazon.com/detective/latest/adminguide/graph-data-management.html"]
    tags: ["detective", "retention", "governance"]

  - id: TMAC-AWS-DETECTIVE-007
    name: "Detective not integrated with GuardDuty"
    resource_type: "aws_detective_graph"
    check: { attribute: "created_time", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Repudiation"
    description: "Without GuardDuty enabled in the same account, Detective has no threat findings to investigate."
    mitigation: "Enable GuardDuty in all accounts/regions before enabling Detective."
    references: ["https://docs.aws.amazon.com/detective/latest/adminguide/datasources-overview.html"]
    tags: ["detective", "guardduty", "integration"]

  - id: TMAC-AWS-DETECTIVE-008
    name: "Detective Graph without tags"
    resource_type: "aws_detective_graph"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Detective graph has no governance tags."
    mitigation: "Add environment, owner, and security-tier tags."
    references: ["https://docs.aws.amazon.com/detective/latest/adminguide/tagging-graph.html"]
    tags: ["detective", "tagging"]

  # ------------------------------------------------------------------
  # Amazon GuardDuty
  # ------------------------------------------------------------------
  - id: TMAC-AWS-GD-001
    name: "GuardDuty Detector not enabled"
    resource_type: "aws_guardduty_detector"
    check: { attribute: "enable", condition: "equals", values: [false] }
    severity: "Critical"
    stride: "Repudiation"
    description: "GuardDuty is disabled in this account/region; threat detection for unauthorized API calls, malware, and network anomalies is absent."
    mitigation: "Set enable = true for the detector in every region and account."
    references: ["https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_settingup.html"]
    tags: ["guardduty", "security", "detection"]

  - id: TMAC-AWS-GD-002
    name: "GuardDuty Detector without S3 protection"
    resource_type: "aws_guardduty_detector"
    check: { attribute: "datasources.s3_logs.enable", condition: "equals", values: [false] }
    severity: "High"
    stride: "Information Disclosure"
    description: "S3 protection is disabled; data exfiltration and unauthorized S3 access are not detected."
    mitigation: "Enable datasources { s3_logs { enable = true } }."
    references: ["https://docs.aws.amazon.com/guardduty/latest/ug/s3-protection.html"]
    tags: ["guardduty", "s3-protection", "exfiltration"]

  - id: TMAC-AWS-GD-003
    name: "GuardDuty Detector without Malware Protection"
    resource_type: "aws_guardduty_detector"
    check: { attribute: "datasources.malware_protection.scan_ec2_instance_with_findings.ebs_volumes.enable", condition: "equals", values: [false] }
    severity: "High"
    stride: "Tampering"
    description: "EBS Malware Protection is disabled; malware installed on EC2 instances is not detected."
    mitigation: "Enable malware_protection EBS scanning in the datasources block."
    references: ["https://docs.aws.amazon.com/guardduty/latest/ug/malware-protection.html"]
    tags: ["guardduty", "malware", "ec2"]

  - id: TMAC-AWS-GD-004
    name: "GuardDuty Detector without Kubernetes protection"
    resource_type: "aws_guardduty_detector"
    check: { attribute: "datasources.kubernetes.audit_logs.enable", condition: "equals", values: [false] }
    severity: "High"
    stride: "Elevation of Privilege"
    description: "Kubernetes audit log monitoring is disabled; container escape, privilege escalation, and cryptomining in EKS are not detected."
    mitigation: "Enable datasources { kubernetes { audit_logs { enable = true } } }."
    references: ["https://docs.aws.amazon.com/guardduty/latest/ug/kubernetes-protection.html"]
    tags: ["guardduty", "kubernetes", "eks"]

  - id: TMAC-AWS-GD-005
    name: "GuardDuty finding SNS notification not configured"
    resource_type: "aws_guardduty_detector"
    check: { attribute: "finding_publishing_frequency", condition: "equals", values: ["SIX_HOURS"] }
    severity: "Medium"
    stride: "Repudiation"
    description: "Findings are published every 6 hours; critical findings are delayed up to 6 hours before reaching the security team."
    mitigation: "Set finding_publishing_frequency = FIFTEEN_MINUTES for critical environments."
    references: ["https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings_cloudwatch.html"]
    tags: ["guardduty", "findings", "alerting"]

  - id: TMAC-AWS-GD-006
    name: "GuardDuty IPSet from uncontrolled S3 location"
    resource_type: "aws_guardduty_ipset"
    check: { attribute: "location", condition: "regex", values: ["^https://s3\\.amazonaws\\.com/"] }
    severity: "High"
    stride: "Tampering"
    description: "The GuardDuty threat intelligence IP set is loaded from a public S3 URL; an adversary can manipulate the IP list to whitelist malicious IPs."
    mitigation: "Host IP sets in a private, account-owned S3 bucket with Object Lock enabled."
    references: ["https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_upload-lists.html"]
    tags: ["guardduty", "ipset", "threat-intel", "tampering"]

  - id: TMAC-AWS-GD-007
    name: "GuardDuty filter with ARCHIVE action on critical findings"
    resource_type: "aws_guardduty_filter"
    check: { attribute: "action", condition: "equals", values: ["ARCHIVE"] }
    severity: "High"
    stride: "Repudiation"
    description: "A GuardDuty filter is set to auto-archive findings; misconfigured filters can suppress legitimate threat findings."
    mitigation: "Review all ARCHIVE filters carefully; prefer NOOP with suppression notes for audit purposes."
    references: ["https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_filter.html"]
    tags: ["guardduty", "filter", "suppression"]

  - id: TMAC-AWS-GD-008
    name: "GuardDuty Detector without tags"
    resource_type: "aws_guardduty_detector"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The GuardDuty detector has no governance tags."
    mitigation: "Add environment and owner tags."
    references: ["https://docs.aws.amazon.com/guardduty/latest/ug/tagging-resources.html"]
    tags: ["guardduty", "tagging"]

  # ------------------------------------------------------------------
  # Amazon Inspector
  # ------------------------------------------------------------------
  - id: TMAC-AWS-INSPECTOR-001
    name: "Inspector v2 not enabled for EC2 scanning"
    resource_type: "aws_inspector2_enabler"
    check: { attribute: "resource_types", condition: "not_contains", values: ["EC2"] }
    severity: "High"
    stride: "Tampering"
    description: "Inspector v2 EC2 scanning is not enabled; OS-level CVEs and package vulnerabilities on instances go undetected."
    mitigation: "Include EC2 in resource_types for the Inspector enabler."
    references: ["https://docs.aws.amazon.com/inspector/latest/user/getting_started_tutorial.html"]
    tags: ["inspector", "ec2", "vulnerability-management"]

  - id: TMAC-AWS-INSPECTOR-002
    name: "Inspector v2 not enabled for ECR scanning"
    resource_type: "aws_inspector2_enabler"
    check: { attribute: "resource_types", condition: "not_contains", values: ["ECR"] }
    severity: "High"
    stride: "Tampering"
    description: "Inspector ECR scanning is not enabled; container image vulnerabilities are not assessed before deployment."
    mitigation: "Include ECR in resource_types; enable enhanced scanning on all critical ECR repositories."
    references: ["https://docs.aws.amazon.com/inspector/latest/user/enable-disable-enhanced-scanning.html"]
    tags: ["inspector", "ecr", "container", "vulnerability-management"]

  - id: TMAC-AWS-INSPECTOR-003
    name: "Inspector v2 not enabled for Lambda scanning"
    resource_type: "aws_inspector2_enabler"
    check: { attribute: "resource_types", condition: "not_contains", values: ["LAMBDA"] }
    severity: "High"
    stride: "Tampering"
    description: "Inspector Lambda scanning is not enabled; vulnerable packages in Lambda function code are not detected."
    mitigation: "Include LAMBDA in resource_types."
    references: ["https://docs.aws.amazon.com/inspector/latest/user/scanning-lambda.html"]
    tags: ["inspector", "lambda", "vulnerability-management"]

  - id: TMAC-AWS-INSPECTOR-004
    name: "Inspector Organization Admin not delegated"
    resource_type: "aws_inspector2_organization_configuration"
    check: { attribute: "auto_enable.ec2", condition: "equals", values: [false] }
    severity: "High"
    stride: "Repudiation"
    description: "Inspector auto-enable for EC2 is off in the organization configuration; new member accounts are not automatically protected."
    mitigation: "Set auto_enable { ec2 = true, ecr = true, lambda = true } in the organization configuration."
    references: ["https://docs.aws.amazon.com/inspector/latest/user/configure-org.html"]
    tags: ["inspector", "organizations", "auto-enable"]

  - id: TMAC-AWS-INSPECTOR-005
    name: "Inspector Member account not enabled"
    resource_type: "aws_inspector2_member_association"
    check: { attribute: "account_id", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Repudiation"
    description: "Member accounts are not associated with the Inspector delegated admin; vulnerabilities in those accounts are not centrally reported."
    mitigation: "Associate all organizational accounts with the Inspector delegated admin."
    references: ["https://docs.aws.amazon.com/inspector/latest/user/managing-members.html"]
    tags: ["inspector", "member", "organizations"]

  - id: TMAC-AWS-INSPECTOR-006
    name: "Inspector findings not exported to Security Hub"
    resource_type: "aws_inspector2_enabler"
    check: { attribute: "account_ids", condition: "exists", values: [] }
    severity: "Medium"
    stride: "Repudiation"
    description: "Without Security Hub integration, Inspector findings are not correlated with other security signals for prioritized remediation."
    mitigation: "Enable Security Hub and activate the Inspector integration to centralize findings."
    references: ["https://docs.aws.amazon.com/inspector/latest/user/findings-understanding-severity.html"]
    tags: ["inspector", "security-hub", "integration"]

  - id: TMAC-AWS-INSPECTOR-007
    name: "Inspector CIS scan configuration without notifications"
    resource_type: "aws_inspector2_cis_scan_configuration"
    check: { attribute: "targets.target_resource_tags", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Repudiation"
    description: "CIS scan configuration does not define target resource tags; all instances may be scanned indiscriminately or none at all."
    mitigation: "Define target_resource_tags to scope CIS scans to production workloads."
    references: ["https://docs.aws.amazon.com/inspector/latest/user/scanning-cis.html"]
    tags: ["inspector", "cis", "compliance"]

  - id: TMAC-AWS-INSPECTOR-008
    name: "Inspector CIS scan configuration without tags"
    resource_type: "aws_inspector2_cis_scan_configuration"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Inspector CIS scan configuration has no governance tags."
    mitigation: "Add environment and owner tags."
    references: ["https://docs.aws.amazon.com/inspector/latest/user/tagging-resources.html"]
    tags: ["inspector", "cis", "tagging"]

  # ------------------------------------------------------------------
  # Amazon Macie
  # ------------------------------------------------------------------
  - id: TMAC-AWS-MACIE-001
    name: "Macie not enabled"
    resource_type: "aws_macie2_account"
    check: { attribute: "status", condition: "not_equals", values: ["ENABLED"] }
    severity: "Critical"
    stride: "Information Disclosure"
    description: "Macie is not enabled; sensitive data (PII, credentials, PHI) stored in S3 is not automatically discovered or classified."
    mitigation: "Set status = ENABLED for the Macie account."
    references: ["https://docs.aws.amazon.com/macie/latest/user/getting-started.html"]
    tags: ["macie", "s3", "pii", "data-discovery"]

  - id: TMAC-AWS-MACIE-002
    name: "Macie finding export not configured"
    resource_type: "aws_macie2_findings_filter"
    check: { attribute: "action", condition: "equals", values: ["ARCHIVE"] }
    severity: "High"
    stride: "Repudiation"
    description: "A Macie findings filter auto-archives findings; PII discovery alerts may be suppressed without review."
    mitigation: "Audit all ARCHIVE filters; only suppress findings after documented risk acceptance."
    references: ["https://docs.aws.amazon.com/macie/latest/user/findings-filter-overview.html"]
    tags: ["macie", "findings", "suppression"]

  - id: TMAC-AWS-MACIE-003
    name: "Macie classification job not targeting sensitive buckets"
    resource_type: "aws_macie2_classification_job"
    check: { attribute: "s3_job_definition.bucket_definitions", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The Macie classification job does not define specific bucket targets; sensitive buckets may not be scanned."
    mitigation: "Define s3_job_definition.bucket_definitions with all buckets containing potentially sensitive data."
    references: ["https://docs.aws.amazon.com/macie/latest/user/discovery-jobs-create.html"]
    tags: ["macie", "classification-job", "s3", "pii"]

  - id: TMAC-AWS-MACIE-004
    name: "Macie classification job one-time only"
    resource_type: "aws_macie2_classification_job"
    check: { attribute: "job_type", condition: "equals", values: ["ONE_TIME"] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "A one-time classification job does not re-scan when new objects are added; newly uploaded sensitive data is missed."
    mitigation: "Use job_type = SCHEDULED for continuous data discovery."
    references: ["https://docs.aws.amazon.com/macie/latest/user/discovery-jobs-create.html"]
    tags: ["macie", "classification-job", "scheduled"]

  - id: TMAC-AWS-MACIE-005
    name: "Macie custom data identifier with overly broad regex"
    resource_type: "aws_macie2_custom_data_identifier"
    check: { attribute: "regex", condition: "regex", values: ["^\\.\\.\\*$|^\\*$"] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The custom data identifier uses an overly broad regex pattern, matching too many objects and producing false positives that obscure real findings."
    mitigation: "Refine the regex to target specific sensitive data patterns with anchors and character classes."
    references: ["https://docs.aws.amazon.com/macie/latest/user/custom-data-identifiers.html"]
    tags: ["macie", "custom-identifier", "false-positive"]

  - id: TMAC-AWS-MACIE-006
    name: "Macie findings not exported to S3"
    resource_type: "aws_macie2_account"
    check: { attribute: "finding_publishing_frequency", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Repudiation"
    description: "No finding publishing frequency is set; the default 15-minute window may not meet SIEM ingestion requirements."
    mitigation: "Set finding_publishing_frequency = FIFTEEN_MINUTES and configure export to encrypted S3."
    references: ["https://docs.aws.amazon.com/macie/latest/user/findings-publish-event-schemas.html"]
    tags: ["macie", "findings", "siem"]

  - id: TMAC-AWS-MACIE-007
    name: "Macie Organization not configured"
    resource_type: "aws_macie2_organization_admin_account"
    check: { attribute: "admin_account_id", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Repudiation"
    description: "No delegated Macie admin account is configured; member account S3 data is not centrally monitored."
    mitigation: "Delegate a dedicated security account as the Macie admin for the organization."
    references: ["https://docs.aws.amazon.com/macie/latest/user/organizations-multi-account-setup.html"]
    tags: ["macie", "organizations", "delegated-admin"]

  - id: TMAC-AWS-MACIE-008
    name: "Macie Account without tags"
    resource_type: "aws_macie2_account"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Macie account resource has no governance tags."
    mitigation: "Add environment and owner tags."
    references: ["https://docs.aws.amazon.com/macie/latest/user/tagging-resources.html"]
    tags: ["macie", "tagging"]

  # ------------------------------------------------------------------
  # Amazon Security Lake
  # ------------------------------------------------------------------
  - id: TMAC-AWS-SECLAKE-001
    name: "Security Lake not enabled"
    resource_type: "aws_securitylake_data_lake"
    check: { attribute: "configuration.encryption_configuration.kms_key_id", condition: "not_exists", values: [] }
    severity: "Critical"
    stride: "Information Disclosure"
    description: "The Security Lake data lake is not encrypted with a CMK; consolidated security logs (CloudTrail, VPC Flow, GuardDuty) are at risk."
    mitigation: "Set configuration.encryption_configuration.kms_key_id to a CMK."
    references: ["https://docs.aws.amazon.com/security-lake/latest/userguide/security-data-protection.html"]
    tags: ["security-lake", "encryption", "logs"]

  - id: TMAC-AWS-SECLAKE-002
    name: "Security Lake without lifecycle expiration"
    resource_type: "aws_securitylake_data_lake"
    check: { attribute: "configuration.lifecycle_configuration.expiration.days", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "No lifecycle expiration is defined; security logs accumulate indefinitely, increasing storage costs and data exposure."
    mitigation: "Define lifecycle_configuration.expiration.days per log retention policy."
    references: ["https://docs.aws.amazon.com/security-lake/latest/userguide/lifecycle-management.html"]
    tags: ["security-lake", "lifecycle", "retention"]

  - id: TMAC-AWS-SECLAKE-003
    name: "Security Lake without replication to secondary region"
    resource_type: "aws_securitylake_data_lake"
    check: { attribute: "configuration.replication_configuration", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "No cross-region replication is configured; a regional outage destroys consolidated security logs."
    mitigation: "Configure replication_configuration with a secondary region rollup."
    references: ["https://docs.aws.amazon.com/security-lake/latest/userguide/replication.html"]
    tags: ["security-lake", "replication", "availability"]

  - id: TMAC-AWS-SECLAKE-004
    name: "Security Lake subscriber without resource-based policy"
    resource_type: "aws_securitylake_subscriber"
    check: { attribute: "subscriber_identity.principal", condition: "regex", values: ["\\*"] }
    severity: "Critical"
    stride: "Information Disclosure"
    description: "The Security Lake subscriber allows any principal; security logs are accessible to unauthorized accounts."
    mitigation: "Restrict subscriber_identity.principal to specific AWS account IDs or service principals."
    references: ["https://docs.aws.amazon.com/security-lake/latest/userguide/subscriber-management.html"]
    tags: ["security-lake", "subscriber", "access-control"]

  - id: TMAC-AWS-SECLAKE-005
    name: "Security Lake subscriber notification without encryption"
    resource_type: "aws_securitylake_subscriber_notification"
    check: { attribute: "configuration.sqs_notification_configuration", condition: "exists", values: [] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The subscriber SQS notification queue may not be encrypted with a KMS key; finding metadata exposed in queue messages."
    mitigation: "Encrypt the SQS queue used for Security Lake notifications with a CMK."
    references: ["https://docs.aws.amazon.com/security-lake/latest/userguide/subscriber-data-access.html"]
    tags: ["security-lake", "subscriber", "sqs", "encryption"]

  - id: TMAC-AWS-SECLAKE-006
    name: "Security Lake AWS log source not including all critical sources"
    resource_type: "aws_securitylake_aws_log_source"
    check: { attribute: "source.source_name", condition: "not_in", values: ["CLOUD_TRAIL_MGMT","VPC_FLOW","SH_FINDINGS","ROUTE53","LAMBDA_EXECUTION"] }
    severity: "High"
    stride: "Repudiation"
    description: "Critical AWS log sources (CloudTrail, VPC Flow, Security Hub) are not enabled; Security Lake does not capture the full security telemetry."
    mitigation: "Enable all critical OCSF log sources in Security Lake."
    references: ["https://docs.aws.amazon.com/security-lake/latest/userguide/internal-sources.html"]
    tags: ["security-lake", "log-sources", "coverage"]

  - id: TMAC-AWS-SECLAKE-007
    name: "Security Lake without delegated admin"
    resource_type: "aws_securitylake_data_lake"
    check: { attribute: "meta_store_manager_role_arn", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Repudiation"
    description: "The Security Lake meta store manager role is not defined; query access and subscriber management are uncontrolled."
    mitigation: "Define meta_store_manager_role_arn with a least-privilege role."
    references: ["https://docs.aws.amazon.com/security-lake/latest/userguide/getting-started.html"]
    tags: ["security-lake", "iam", "governance"]

  - id: TMAC-AWS-SECLAKE-008
    name: "Security Lake Data Lake without tags"
    resource_type: "aws_securitylake_data_lake"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Security Lake data lake has no governance tags."
    mitigation: "Add environment, owner, and data-classification tags."
    references: ["https://docs.aws.amazon.com/security-lake/latest/userguide/tagging-resources.html"]
    tags: ["security-lake", "tagging"]

  # ------------------------------------------------------------------
  # Amazon Verified Permissions
  # ------------------------------------------------------------------
  - id: TMAC-AWS-VP-001
    name: "Verified Permissions Policy Store with overly permissive schema"
    resource_type: "aws_verifiedpermissions_policy_store"
    check: { attribute: "validation_settings.mode", condition: "equals", values: ["OFF"] }
    severity: "High"
    stride: "Elevation of Privilege"
    description: "Schema validation is disabled; arbitrary authorization policies can be created without type checking, allowing privilege escalation."
    mitigation: "Set validation_settings.mode = STRICT to enforce Cedar schema validation."
    references: ["https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/schema.html"]
    tags: ["verified-permissions", "authz", "cedar", "schema"]

  - id: TMAC-AWS-VP-002
    name: "Verified Permissions Policy allowing all actions"
    resource_type: "aws_verifiedpermissions_policy"
    check: { attribute: "definition.static.statement", condition: "regex", values: ["permit\\s*\\(.*action\\s+in\\s+Action::\\\"\\*\\\""] }
    severity: "Critical"
    stride: "Elevation of Privilege"
    description: "The Cedar policy permits all actions; any principal can perform any operation on the protected resource."
    mitigation: "Restrict the action set to specific named actions required by the use case."
    references: ["https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/policies_create.html"]
    tags: ["verified-permissions", "authz", "cedar", "wildcard"]

  - id: TMAC-AWS-VP-003
    name: "Verified Permissions Policy allowing all principals"
    resource_type: "aws_verifiedpermissions_policy"
    check: { attribute: "definition.static.statement", condition: "regex", values: ["permit\\s*\\(\\s*principal,"] }
    severity: "Critical"
    stride: "Spoofing"
    description: "The Cedar policy permits any principal; unauthenticated or anonymous actors can access protected resources."
    mitigation: "Scope the principal to specific entity types or groups (e.g., User::\"alice\")."
    references: ["https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/policies_create.html"]
    tags: ["verified-permissions", "authz", "cedar", "principal"]

  - id: TMAC-AWS-VP-004
    name: "Verified Permissions Identity Source not linked to Cognito"
    resource_type: "aws_verifiedpermissions_identity_source"
    check: { attribute: "configuration.cognito_user_pool_configuration.user_pool_arn", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Spoofing"
    description: "No Cognito or OIDC identity source is configured; identity claims in authorization requests are not validated against a trusted IdP."
    mitigation: "Configure configuration.cognito_user_pool_configuration or open_id_connect_configuration."
    references: ["https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/identity-sources.html"]
    tags: ["verified-permissions", "authz", "identity-source", "cognito"]

  - id: TMAC-AWS-VP-005
    name: "Verified Permissions Policy Template without safe defaults"
    resource_type: "aws_verifiedpermissions_policy_template"
    check: { attribute: "statement", condition: "regex", values: ["permit\\s*\\(.*\\)"] }
    severity: "Medium"
    stride: "Elevation of Privilege"
    description: "The policy template uses a permissive Cedar statement; instantiated policies may grant unintended broad access."
    mitigation: "Review all template statements; use forbid policies as safeguards."
    references: ["https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/policy-templates.html"]
    tags: ["verified-permissions", "authz", "template"]

  - id: TMAC-AWS-VP-006
    name: "Verified Permissions Policy Store without tags"
    resource_type: "aws_verifiedpermissions_policy_store"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Verified Permissions policy store has no governance tags."
    mitigation: "Add environment, application, and owner tags."
    references: ["https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/tagging.html"]
    tags: ["verified-permissions", "authz", "tagging"]

  - id: TMAC-AWS-VP-007
    name: "Verified Permissions not logging authorization decisions"
    resource_type: "aws_verifiedpermissions_policy_store"
    check: { attribute: "description", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Repudiation"
    description: "Authorization decisions are not logged; DENY outcomes indicating attempted unauthorized access cannot be audited."
    mitigation: "Enable CloudTrail data events for Verified Permissions and route to Security Lake."
    references: ["https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/logging-using-cloudtrail.html"]
    tags: ["verified-permissions", "authz", "logging", "cloudtrail"]

  - id: TMAC-AWS-VP-008
    name: "Verified Permissions Identity Source token validation not scoped"
    resource_type: "aws_verifiedpermissions_identity_source"
    check: { attribute: "configuration.cognito_user_pool_configuration.client_ids", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Spoofing"
    description: "No client_ids are specified; tokens from any Cognito app client in the user pool are accepted, enabling token reuse from unintended clients."
    mitigation: "Specify client_ids to restrict which app clients' tokens are valid for authorization."
    references: ["https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/identity-sources.html"]
    tags: ["verified-permissions", "authz", "cognito", "token-validation"]

  # ------------------------------------------------------------------
  # AWS Audit Manager
  # ------------------------------------------------------------------
  - id: TMAC-AWS-AUDITMGR-001
    name: "Audit Manager Assessment without KMS encryption"
    resource_type: "aws_auditmanager_assessment"
    check: { attribute: "assessment_reports_destination.destination_type", condition: "equals", values: ["S3"] }
    severity: "High"
    stride: "Information Disclosure"
    description: "Audit Manager assessment reports are stored in S3; verify the bucket enforces SSE-KMS with a CMK."
    mitigation: "Ensure the S3 destination bucket for assessment reports uses SSE-KMS with a CMK."
    references: ["https://docs.aws.amazon.com/audit-manager/latest/userguide/data-protection.html"]
    tags: ["audit-manager", "assessment", "encryption", "compliance"]

  - id: TMAC-AWS-AUDITMGR-002
    name: "Audit Manager Assessment without multiple delegations"
    resource_type: "aws_auditmanager_assessment"
    check: { attribute: "roles", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Repudiation"
    description: "The assessment does not define explicit IAM roles; evidence collection may be performed with overly broad permissions."
    mitigation: "Assign roles with least-privilege Audit Manager permissions for evidence collection."
    references: ["https://docs.aws.amazon.com/audit-manager/latest/userguide/security_iam_id-based-policy-examples.html"]
    tags: ["audit-manager", "assessment", "iam"]

  - id: TMAC-AWS-AUDITMGR-003
    name: "Audit Manager Framework without custom controls"
    resource_type: "aws_auditmanager_framework"
    check: { attribute: "control_sets", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Repudiation"
    description: "The assessment framework has no defined control sets; evidence collection is not scoped to specific compliance requirements."
    mitigation: "Define control_sets with custom or standard controls relevant to the compliance framework."
    references: ["https://docs.aws.amazon.com/audit-manager/latest/userguide/create-custom-frameworks.html"]
    tags: ["audit-manager", "framework", "compliance"]

  - id: TMAC-AWS-AUDITMGR-004
    name: "Audit Manager Assessment without tags"
    resource_type: "aws_auditmanager_assessment"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Audit Manager assessment has no governance tags."
    mitigation: "Add compliance-framework, owner, and environment tags."
    references: ["https://docs.aws.amazon.com/audit-manager/latest/userguide/tagging.html"]
    tags: ["audit-manager", "tagging"]

  - id: TMAC-AWS-AUDITMGR-005
    name: "Audit Manager Framework without tags"
    resource_type: "aws_auditmanager_framework"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Audit Manager framework has no governance tags."
    mitigation: "Add compliance-framework and owner tags."
    references: ["https://docs.aws.amazon.com/audit-manager/latest/userguide/tagging.html"]
    tags: ["audit-manager", "framework", "tagging"]

  - id: TMAC-AWS-AUDITMGR-006
    name: "Audit Manager Account Registration without KMS"
    resource_type: "aws_auditmanager_account_registration"
    check: { attribute: "kms_key", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "Audit Manager is registered without a CMK; assessment data and evidence are encrypted with an AWS-managed key."
    mitigation: "Specify kms_key with a CMK when registering Audit Manager."
    references: ["https://docs.aws.amazon.com/audit-manager/latest/userguide/data-protection.html"]
    tags: ["audit-manager", "encryption", "kms"]

  - id: TMAC-AWS-AUDITMGR-007
    name: "Audit Manager Control without evidence sources"
    resource_type: "aws_auditmanager_control"
    check: { attribute: "control_mapping_sources", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Repudiation"
    description: "The control has no evidence mapping sources; evidence cannot be automatically collected for this control."
    mitigation: "Define control_mapping_sources with AWS Config rules, CloudTrail, or manual evidence."
    references: ["https://docs.aws.amazon.com/audit-manager/latest/userguide/create-custom-controls.html"]
    tags: ["audit-manager", "control", "evidence"]

  - id: TMAC-AWS-AUDITMGR-008
    name: "Audit Manager Control without tags"
    resource_type: "aws_auditmanager_control"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Audit Manager control has no governance tags."
    mitigation: "Add compliance-domain and owner tags."
    references: ["https://docs.aws.amazon.com/audit-manager/latest/userguide/tagging.html"]
    tags: ["audit-manager", "control", "tagging"]

  # ------------------------------------------------------------------
  # AWS CloudHSM
  # ------------------------------------------------------------------
  - id: TMAC-AWS-CLOUDHSM-001
    name: "CloudHSM Cluster without backup retention"
    resource_type: "aws_cloudhsm_v2_cluster"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Denial of Service"
    description: "CloudHSM clusters should have automated backups; without them, an HSM failure leads to irreversible key loss."
    mitigation: "Enable automated backups and verify backup retention settings in the CloudHSM console."
    references: ["https://docs.aws.amazon.com/cloudhsm/latest/userguide/backups.html"]
    tags: ["cloudhsm", "backup", "key-management"]

  - id: TMAC-AWS-CLOUDHSM-002
    name: "CloudHSM Cluster in a single AZ"
    resource_type: "aws_cloudhsm_v2_cluster"
    check: { attribute: "subnet_ids", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Denial of Service"
    description: "The CloudHSM cluster does not declare multiple subnets; a single-AZ deployment has no HA."
    mitigation: "Deploy HSM instances in at least 2 AZs by providing subnet_ids from multiple AZs."
    references: ["https://docs.aws.amazon.com/cloudhsm/latest/userguide/best-practices-for-high-availability.html"]
    tags: ["cloudhsm", "multi-az", "availability"]

  - id: TMAC-AWS-CLOUDHSM-003
    name: "CloudHSM HSM without a quorum policy"
    resource_type: "aws_cloudhsm_v2_hsm"
    check: { attribute: "availability_zone", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "The HSM does not declare an explicit AZ; deployment may be concentrated in a single zone."
    mitigation: "Explicitly set availability_zone and deploy HSMs across multiple AZs."
    references: ["https://docs.aws.amazon.com/cloudhsm/latest/userguide/best-practices-for-high-availability.html"]
    tags: ["cloudhsm", "hsm", "availability"]

  - id: TMAC-AWS-CLOUDHSM-004
    name: "CloudHSM Cluster without dedicated security group"
    resource_type: "aws_cloudhsm_v2_cluster"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "Without a dedicated security group, HSM ports (2223-2225) may be accessible beyond the application tier."
    mitigation: "Restrict the CloudHSM cluster security group to allow only the application tier CIDRs on ports 2223-2225."
    references: ["https://docs.aws.amazon.com/cloudhsm/latest/userguide/configure-sg.html"]
    tags: ["cloudhsm", "network", "security-group"]

  - id: TMAC-AWS-CLOUDHSM-005
    name: "CloudHSM using shared crypto user passwords"
    resource_type: "aws_cloudhsm_v2_cluster"
    check: { attribute: "source_backup_identifier", condition: "not_exists", values: [] }
    severity: "Critical"
    stride: "Spoofing"
    description: "CloudHSM Crypto User credentials shared across applications allow any application to use HSM keys belonging to another."
    mitigation: "Create separate Crypto User accounts per application; enforce unique passwords stored in Secrets Manager."
    references: ["https://docs.aws.amazon.com/cloudhsm/latest/userguide/manage-hsm-users.html"]
    tags: ["cloudhsm", "credentials", "isolation"]

  - id: TMAC-AWS-CLOUDHSM-006
    name: "CloudHSM Cluster without tags"
    resource_type: "aws_cloudhsm_v2_cluster"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The CloudHSM cluster has no governance tags."
    mitigation: "Add environment, owner, and key-purpose tags."
    references: ["https://docs.aws.amazon.com/cloudhsm/latest/userguide/tagging-resources.html"]
    tags: ["cloudhsm", "tagging"]

  - id: TMAC-AWS-CLOUDHSM-007
    name: "CloudHSM Cluster not using FIPS-validated firmware"
    resource_type: "aws_cloudhsm_v2_cluster"
    check: { attribute: "hsm_type", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Tampering"
    description: "Without verifying hsm_type, the cluster may not meet FIPS 140-2 Level 3 requirements for regulated workloads."
    mitigation: "Verify hsm_type = hsm1.medium and that FIPS compliance is confirmed in the HSM cluster status."
    references: ["https://docs.aws.amazon.com/cloudhsm/latest/userguide/introduction.html"]
    tags: ["cloudhsm", "fips", "compliance"]

  - id: TMAC-AWS-CLOUDHSM-008
    name: "CloudHSM Cluster backup not cross-region"
    resource_type: "aws_cloudhsm_v2_cluster"
    check: { attribute: "source_backup_identifier", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "HSM backups are not restored from a cross-region source; regional disaster recovery is not tested."
    mitigation: "Test cross-region backup restore to a secondary region as part of DR drills."
    references: ["https://docs.aws.amazon.com/cloudhsm/latest/userguide/cross-region-backups.html"]
    tags: ["cloudhsm", "backup", "dr"]

  # ------------------------------------------------------------------
  # AWS Directory Service
  # ------------------------------------------------------------------
  - id: TMAC-AWS-DS-001
    name: "Directory Service without MFA"
    resource_type: "aws_directory_service_directory"
    check: { attribute: "type", condition: "equals", values: ["MicrosoftAD"] }
    severity: "High"
    stride: "Spoofing"
    description: "AWS Managed Microsoft AD does not enforce MFA; accounts are protected only by password, enabling credential-stuffing attacks."
    mitigation: "Enable MFA via RADIUS or integrate with IAM Identity Center MFA for all AD users."
    references: ["https://docs.aws.amazon.com/directoryservice/latest/admin-guide/ms_ad_mfa.html"]
    tags: ["directory-service", "mfa", "active-directory"]

  - id: TMAC-AWS-DS-002
    name: "Directory Service password in Terraform plaintext"
    resource_type: "aws_directory_service_directory"
    check: { attribute: "password", condition: "exists", values: [] }
    severity: "Critical"
    stride: "Information Disclosure"
    description: "The directory admin password is embedded in the Terraform resource, visible in state and plan output."
    mitigation: "Generate the password with random_password and store in Secrets Manager; reference via data source."
    references: ["https://docs.aws.amazon.com/directoryservice/latest/admin-guide/ms_ad_getting_started.html"]
    tags: ["directory-service", "credentials", "secrets"]

  - id: TMAC-AWS-DS-003
    name: "Directory Service Single-AZ deployment"
    resource_type: "aws_directory_service_directory"
    check: { attribute: "vpc_settings.subnet_ids", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Denial of Service"
    description: "Without multiple subnet IDs in different AZs, the directory has no HA configuration."
    mitigation: "Provide subnet_ids in at least 2 AZs for Multi-AZ deployment."
    references: ["https://docs.aws.amazon.com/directoryservice/latest/admin-guide/ms_ad_best_practices.html"]
    tags: ["directory-service", "multi-az", "availability"]

  - id: TMAC-AWS-DS-004
    name: "Directory Service Simple AD for sensitive workloads"
    resource_type: "aws_directory_service_directory"
    check: { attribute: "type", condition: "equals", values: ["SimpleAD"] }
    severity: "Medium"
    stride: "Elevation of Privilege"
    description: "Simple AD does not support Kerberos-based SSO, MFA, or trust relationships; use for test environments only."
    mitigation: "Use AWS Managed Microsoft AD for production workloads."
    references: ["https://docs.aws.amazon.com/directoryservice/latest/admin-guide/directory_simple_ad.html"]
    tags: ["directory-service", "simple-ad", "ad-type"]

  - id: TMAC-AWS-DS-005
    name: "Directory Service without log forwarding"
    resource_type: "aws_directory_service_log_subscription"
    check: { attribute: "log_group_name", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Repudiation"
    description: "Directory security events are not forwarded to CloudWatch Logs; failed logins and privilege escalations are undetected."
    mitigation: "Create an aws_directory_service_log_subscription with a CloudWatch log group."
    references: ["https://docs.aws.amazon.com/directoryservice/latest/admin-guide/ms_ad_enable_log_forwarding.html"]
    tags: ["directory-service", "logging", "cloudwatch"]

  - id: TMAC-AWS-DS-006
    name: "Directory Service trust with external domain"
    resource_type: "aws_directory_service_conditional_forwarder"
    check: { attribute: "remote_domain_name", condition: "exists", values: [] }
    severity: "High"
    stride: "Elevation of Privilege"
    description: "A conditional forwarder to an external domain enables trust relationships that could allow external accounts to authenticate against internal resources."
    mitigation: "Review all conditional forwarders; create forest trusts only with verified, trusted external domains."
    references: ["https://docs.aws.amazon.com/directoryservice/latest/admin-guide/ms_ad_setup_trust.html"]
    tags: ["directory-service", "trust", "federation"]

  - id: TMAC-AWS-DS-007
    name: "Directory Service without fine-grained password policy"
    resource_type: "aws_directory_service_directory"
    check: { attribute: "type", condition: "equals", values: ["MicrosoftAD"] }
    severity: "Medium"
    stride: "Spoofing"
    description: "Without fine-grained password policies, all users share the same weak default policy, enabling brute-force attacks."
    mitigation: "Apply fine-grained password policies (PSOs) via AD tools to enforce complexity and lockout thresholds."
    references: ["https://docs.aws.amazon.com/directoryservice/latest/admin-guide/ms_ad_password_policies.html"]
    tags: ["directory-service", "password-policy", "active-directory"]

  - id: TMAC-AWS-DS-008
    name: "Directory Service without tags"
    resource_type: "aws_directory_service_directory"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Directory Service directory has no governance tags."
    mitigation: "Add environment, owner, and workload tags."
    references: ["https://docs.aws.amazon.com/directoryservice/latest/admin-guide/ms_ad_tagging.html"]
    tags: ["directory-service", "tagging"]

  # ------------------------------------------------------------------
  # AWS Firewall Manager
  # ------------------------------------------------------------------
  - id: TMAC-AWS-FMS-001
    name: "Firewall Manager Policy not remediating automatically"
    resource_type: "aws_fms_policy"
    check: { attribute: "remediation_enabled", condition: "equals", values: [false] }
    severity: "High"
    stride: "Tampering"
    description: "Auto-remediation is disabled; non-compliant resources are identified but not corrected, leaving security gaps open."
    mitigation: "Set remediation_enabled = true for production Firewall Manager policies."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/fms-remediation.html"]
    tags: ["firewall-manager", "policy", "remediation"]

  - id: TMAC-AWS-FMS-002
    name: "Firewall Manager Policy not excluding compliant accounts"
    resource_type: "aws_fms_policy"
    check: { attribute: "exclude_map", condition: "not_exists", values: [], and_check: { attribute: "include_map", condition: "not_exists", values: [] } }
    severity: "Medium"
    stride: "Denial of Service"
    description: "Without include/exclude maps, the policy applies to all accounts including test/dev; over-enforcement may cause outages."
    mitigation: "Use include_map or exclude_map to scope the policy to production accounts/OUs."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/fms-create-policy.html"]
    tags: ["firewall-manager", "policy", "scope"]

  - id: TMAC-AWS-FMS-003
    name: "Firewall Manager Policy without resource tags"
    resource_type: "aws_fms_policy"
    check: { attribute: "resource_tags", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Tampering"
    description: "No resource tag conditions are defined; the policy may apply to unintended resources."
    mitigation: "Define resource_tags to restrict the policy to tagged resources (Environment=production)."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/fms-create-policy.html"]
    tags: ["firewall-manager", "policy", "tagging"]

  - id: TMAC-AWS-FMS-004
    name: "Firewall Manager Admin Account not registered"
    resource_type: "aws_fms_admin_account"
    check: { attribute: "account_id", condition: "not_exists", values: [] }
    severity: "Critical"
    stride: "Elevation of Privilege"
    description: "No Firewall Manager admin account is registered; centralized security policy management is unavailable."
    mitigation: "Register a dedicated security account as the Firewall Manager admin."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/fms-getting-started-prerequisites.html"]
    tags: ["firewall-manager", "admin", "organizations"]

  - id: TMAC-AWS-FMS-005
    name: "Firewall Manager Policy not covering all resource types"
    resource_type: "aws_fms_policy"
    check: { attribute: "resource_type_list", condition: "not_exists", values: [], and_check: { attribute: "resource_type", condition: "not_exists", values: [] } }
    severity: "Medium"
    stride: "Tampering"
    description: "The policy does not declare resource types; the scope of protection is undefined."
    mitigation: "Specify resource_type or resource_type_list to clearly define protected resource types."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/fms-create-policy.html"]
    tags: ["firewall-manager", "policy", "scope"]

  - id: TMAC-AWS-FMS-006
    name: "Firewall Manager Policy delete unused resources disabled"
    resource_type: "aws_fms_policy"
    check: { attribute: "delete_unused_fm_managed_resources", condition: "equals", values: [false] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "Unused Firewall Manager managed resources (WAF WebACLs, SGs) are not deleted; orphaned resources may accumulate and increase costs or attack surface."
    mitigation: "Set delete_unused_fm_managed_resources = true to clean up orphaned resources."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/fms-create-policy.html"]
    tags: ["firewall-manager", "policy", "cleanup"]

  - id: TMAC-AWS-FMS-007
    name: "Firewall Manager Policy without tags"
    resource_type: "aws_fms_policy"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Firewall Manager policy has no governance tags."
    mitigation: "Add environment and owner tags."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/fms-create-policy.html"]
    tags: ["firewall-manager", "tagging"]

  - id: TMAC-AWS-FMS-008
    name: "Firewall Manager security group policy allowing unrestricted ingress"
    resource_type: "aws_fms_policy"
    check: { attribute: "security_service_policy_data.type", condition: "equals", values: ["SECURITY_GROUPS_USAGE_AUDIT"] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The FMS security group audit policy is in audit mode; non-compliant over-permissive security groups are identified but not remediated."
    mitigation: "Switch to remediation mode after validating audit findings."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/fms-policy-sg.html"]
    tags: ["firewall-manager", "security-group", "audit"]

  # ------------------------------------------------------------------
  # AWS Network Firewall
  # ------------------------------------------------------------------
  - id: TMAC-AWS-NFW-001
    name: "Network Firewall without KMS encryption"
    resource_type: "aws_networkfirewall_firewall"
    check: { attribute: "encryption_configuration.key_id", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The Network Firewall is not encrypted with a CMK; firewall configurations and traffic metadata are protected only by AWS-managed keys."
    mitigation: "Configure encryption_configuration { type = CUSTOMER_KMS, key_id = <CMK> }."
    references: ["https://docs.aws.amazon.com/network-firewall/latest/developerguide/encryption-at-rest.html"]
    tags: ["network-firewall", "encryption", "kms"]

  - id: TMAC-AWS-NFW-002
    name: "Network Firewall without delete protection"
    resource_type: "aws_networkfirewall_firewall"
    check: { attribute: "delete_protection", condition: "not_equals", values: [true] }
    severity: "High"
    stride: "Denial of Service"
    description: "Delete protection is disabled; an accidental or malicious Terraform destroy removes the network perimeter."
    mitigation: "Set delete_protection = true in production firewalls."
    references: ["https://docs.aws.amazon.com/network-firewall/latest/developerguide/firewall-deleting.html"]
    tags: ["network-firewall", "delete-protection", "availability"]

  - id: TMAC-AWS-NFW-003
    name: "Network Firewall Policy with default stateless action PASS"
    resource_type: "aws_networkfirewall_firewall_policy"
    check: { attribute: "firewall_policy.stateless_default_actions", condition: "contains", values: ["aws:pass"] }
    severity: "Critical"
    stride: "Tampering"
    description: "The default stateless action is PASS; all traffic not matched by rules is allowed through without inspection."
    mitigation: "Set stateless_default_actions = [\"aws:drop\"] and explicitly allow required traffic."
    references: ["https://docs.aws.amazon.com/network-firewall/latest/developerguide/firewall-policy.html"]
    tags: ["network-firewall", "policy", "default-allow"]

  - id: TMAC-AWS-NFW-004
    name: "Network Firewall Policy with default stateful action PASS"
    resource_type: "aws_networkfirewall_firewall_policy"
    check: { attribute: "firewall_policy.stateful_default_actions", condition: "contains", values: ["aws:pass"] }
    severity: "Critical"
    stride: "Tampering"
    description: "The default stateful action is PASS; unmatched flows are allowed through the stateful engine."
    mitigation: "Use aws:drop_established as the default stateful action with explicit PASS rules for allowed flows."
    references: ["https://docs.aws.amazon.com/network-firewall/latest/developerguide/firewall-policy.html"]
    tags: ["network-firewall", "policy", "stateful"]

  - id: TMAC-AWS-NFW-005
    name: "Network Firewall logging not configured"
    resource_type: "aws_networkfirewall_logging_configuration"
    check: { attribute: "logging_configuration.log_destination_config", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Repudiation"
    description: "Network Firewall logging is not configured; threat detections and blocked flows are not captured."
    mitigation: "Configure log_destination_config with ALERT and FLOW log types to CloudWatch Logs or S3."
    references: ["https://docs.aws.amazon.com/network-firewall/latest/developerguide/firewall-logging.html"]
    tags: ["network-firewall", "logging"]

  - id: TMAC-AWS-NFW-006
    name: "Network Firewall Rule Group with pass-all rule"
    resource_type: "aws_networkfirewall_rule_group"
    check: { attribute: "rule_group.rules_source.rules_string", condition: "regex", values: ["pass\\s+ip\\s+any\\s+any\\s+->\\s+any\\s+any"] }
    severity: "Critical"
    stride: "Tampering"
    description: "The rule group contains a pass-all Suricata rule; all traffic bypasses inspection."
    mitigation: "Remove or restrict the pass-all rule; define explicit allow rules for required traffic."
    references: ["https://docs.aws.amazon.com/network-firewall/latest/developerguide/rule-groups.html"]
    tags: ["network-firewall", "rule-group", "pass-all"]

  - id: TMAC-AWS-NFW-007
    name: "Network Firewall not deployed in multiple AZs"
    resource_type: "aws_networkfirewall_firewall"
    check: { attribute: "subnet_mapping", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Denial of Service"
    description: "Without subnet mappings in multiple AZs, an AZ failure takes down the entire network inspection layer."
    mitigation: "Add subnet_mapping blocks for each AZ in the VPC."
    references: ["https://docs.aws.amazon.com/network-firewall/latest/developerguide/firewall-creating.html"]
    tags: ["network-firewall", "multi-az", "availability"]

  - id: TMAC-AWS-NFW-008
    name: "Network Firewall without tags"
    resource_type: "aws_networkfirewall_firewall"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Network Firewall has no governance tags."
    mitigation: "Add environment, owner, and network-zone tags."
    references: ["https://docs.aws.amazon.com/network-firewall/latest/developerguide/firewall-tagging.html"]
    tags: ["network-firewall", "tagging"]

  # ------------------------------------------------------------------
  # AWS Resource Access Manager (RAM)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-RAM-001
    name: "RAM Resource Share with external accounts"
    resource_type: "aws_ram_resource_share"
    check: { attribute: "allow_external_principals", condition: "equals", values: [true] }
    severity: "Critical"
    stride: "Information Disclosure"
    description: "The RAM resource share allows external AWS accounts; shared resources (subnets, Transit Gateways) are accessible outside the organization."
    mitigation: "Set allow_external_principals = false; restrict sharing to accounts within AWS Organizations."
    references: ["https://docs.aws.amazon.com/ram/latest/userguide/security-best-practices.html"]
    tags: ["ram", "resource-sharing", "external-access"]

  - id: TMAC-AWS-RAM-002
    name: "RAM Resource Share principal is the root organization"
    resource_type: "aws_ram_principal_association"
    check: { attribute: "principal", condition: "regex", values: ["arn:aws:organizations::[0-9]+:organization/o-"] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The resource share is associated with the entire AWS Organization root; all accounts including test/dev inherit access."
    mitigation: "Restrict principals to specific OUs or accounts rather than the entire organization root."
    references: ["https://docs.aws.amazon.com/ram/latest/userguide/working-with-sharing-create.html"]
    tags: ["ram", "resource-sharing", "organizations"]

  - id: TMAC-AWS-RAM-003
    name: "RAM Resource Share without auto-accept"
    resource_type: "aws_ram_resource_share_accepter"
    check: { attribute: "share_arn", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Repudiation"
    description: "Resource share invitations are not explicitly accepted via IaC; manual acceptance may be forgotten, leaving shares in pending state."
    mitigation: "Use aws_ram_resource_share_accepter to explicitly accept shares in member accounts."
    references: ["https://docs.aws.amazon.com/ram/latest/userguide/getting-started-sharing.html"]
    tags: ["ram", "resource-sharing", "iac"]

  - id: TMAC-AWS-RAM-004
    name: "RAM Resource Share without tags"
    resource_type: "aws_ram_resource_share"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The RAM resource share has no governance tags."
    mitigation: "Add environment, owner, and shared-resource-type tags."
    references: ["https://docs.aws.amazon.com/ram/latest/userguide/working-with-tagging.html"]
    tags: ["ram", "resource-sharing", "tagging"]

  - id: TMAC-AWS-RAM-005
    name: "RAM sharing sensitive resource types"
    resource_type: "aws_ram_resource_association"
    check: { attribute: "resource_arn", condition: "regex", values: ["arn:aws:(secretsmanager|kms|iam):"] }
    severity: "Critical"
    stride: "Information Disclosure"
    description: "The RAM share associates a sensitive resource type (Secrets Manager secret, KMS key, IAM role); sharing these cross-account significantly widens the blast radius of a compromise."
    mitigation: "Review cross-account secret/KMS sharing; prefer cross-account IAM roles over sharing sensitive resources."
    references: ["https://docs.aws.amazon.com/ram/latest/userguide/shareable.html"]
    tags: ["ram", "resource-sharing", "secrets", "kms"]

  - id: TMAC-AWS-RAM-006
    name: "RAM Resource Share permission using AWS managed default"
    resource_type: "aws_ram_resource_share"
    check: { attribute: "permission_arns", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Elevation of Privilege"
    description: "No custom permission ARNs are specified; the share uses AWS default managed permissions which may grant more access than intended."
    mitigation: "Specify permission_arns with least-privilege custom RAM managed permissions."
    references: ["https://docs.aws.amazon.com/ram/latest/userguide/security-ram-permissions.html"]
    tags: ["ram", "resource-sharing", "iam"]

  - id: TMAC-AWS-RAM-007
    name: "RAM Resource Share name revealing shared resource type"
    resource_type: "aws_ram_resource_share"
    check: { attribute: "name", condition: "regex", values: ["(?i)(secret|key|kms|password|credential)"] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "The share name reveals the type of sensitive resource being shared; this provides reconnaissance value to unauthorized principals."
    mitigation: "Use neutral naming conventions for RAM shares."
    references: ["https://docs.aws.amazon.com/ram/latest/userguide/"]
    tags: ["ram", "resource-sharing", "naming"]

  - id: TMAC-AWS-RAM-008
    name: "RAM Organization sharing not restricted by SCP"
    resource_type: "aws_ram_resource_share"
    check: { attribute: "allow_external_principals", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "Without SCPs restricting RAM sharing to trusted principals, any account in the organization can share resources externally."
    mitigation: "Apply an SCP denying ram:CreateResourceShare with Condition aws:ResourceOrgID to restrict sharing within the org."
    references: ["https://docs.aws.amazon.com/ram/latest/userguide/security-best-practices.html"]
    tags: ["ram", "resource-sharing", "scp"]

  # ------------------------------------------------------------------
  # AWS Security Hub
  # ------------------------------------------------------------------
  - id: TMAC-AWS-SECHUB-001
    name: "Security Hub not enabled"
    resource_type: "aws_securityhub_account"
    check: { attribute: "enable_default_standards", condition: "equals", values: [false] }
    severity: "Critical"
    stride: "Repudiation"
    description: "Security Hub default standards (AWS Foundational, CIS) are disabled; security posture findings are not generated."
    mitigation: "Set enable_default_standards = true to enable baseline compliance checks."
    references: ["https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-getting-started.html"]
    tags: ["security-hub", "cspm", "compliance"]

  - id: TMAC-AWS-SECHUB-002
    name: "Security Hub standard disabled"
    resource_type: "aws_securityhub_standards_subscription"
    check: { attribute: "standards_arn", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Repudiation"
    description: "No compliance standards are subscribed; automated posture checks (CIS, PCI, NIST) are not running."
    mitigation: "Subscribe to aws-foundational-security-best-practices and cis-aws-benchmark standards."
    references: ["https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-standards.html"]
    tags: ["security-hub", "standards", "cspm"]

  - id: TMAC-AWS-SECHUB-003
    name: "Security Hub findings not aggregated from all regions"
    resource_type: "aws_securityhub_finding_aggregator"
    check: { attribute: "linking_mode", condition: "not_equals", values: ["ALL_REGIONS"] }
    severity: "High"
    stride: "Repudiation"
    description: "Findings are not aggregated from all regions; multi-region threats may go unnoticed in the central dashboard."
    mitigation: "Set linking_mode = ALL_REGIONS in the finding aggregator."
    references: ["https://docs.aws.amazon.com/securityhub/latest/userguide/finding-aggregation.html"]
    tags: ["security-hub", "multi-region", "aggregation"]

  - id: TMAC-AWS-SECHUB-004
    name: "Security Hub Organization admin not delegated"
    resource_type: "aws_securityhub_organization_admin_account"
    check: { attribute: "admin_account_id", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Repudiation"
    description: "No delegated Security Hub admin is configured; member account findings are not centrally collected."
    mitigation: "Delegate a security account as the Security Hub admin for the organization."
    references: ["https://docs.aws.amazon.com/securityhub/latest/userguide/designate-orgs-admin-account.html"]
    tags: ["security-hub", "organizations", "delegated-admin"]

  - id: TMAC-AWS-SECHUB-005
    name: "Security Hub action target with Lambda role with AdministratorAccess"
    resource_type: "aws_securityhub_action_target"
    check: { attribute: "name", condition: "exists", values: [] }
    severity: "High"
    stride: "Elevation of Privilege"
    description: "Security Hub custom actions invoke Lambda; if the Lambda execution role has excessive permissions, a crafted finding can trigger unauthorized actions."
    mitigation: "Scope Security Hub action Lambda roles to the minimum required remediation actions."
    references: ["https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-cloudwatch-events.html"]
    tags: ["security-hub", "action-target", "lambda", "iam"]

  - id: TMAC-AWS-SECHUB-006
    name: "Security Hub insight without filter"
    resource_type: "aws_securityhub_insight"
    check: { attribute: "filters", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Repudiation"
    description: "The Security Hub insight has no filters; it will display all findings without prioritization."
    mitigation: "Define filters scoped to severity, resource type, or compliance standards."
    references: ["https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-insights-create.html"]
    tags: ["security-hub", "insight", "filtering"]

  - id: TMAC-AWS-SECHUB-007
    name: "Security Hub controls auto-enabled not configured"
    resource_type: "aws_securityhub_organization_configuration"
    check: { attribute: "auto_enable_controls", condition: "equals", values: [false] }
    severity: "Medium"
    stride: "Repudiation"
    description: "New Security Hub controls are not auto-enabled for member accounts; newly released checks do not run until manually enabled."
    mitigation: "Set auto_enable_controls = true in the organization configuration."
    references: ["https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-controls-auto-enable.html"]
    tags: ["security-hub", "controls", "organizations"]

  - id: TMAC-AWS-SECHUB-008
    name: "Security Hub product subscription not including GuardDuty"
    resource_type: "aws_securityhub_product_subscription"
    check: { attribute: "product_arn", condition: "not_regex", values: ["guardduty|inspector|macie"] }
    severity: "Medium"
    stride: "Repudiation"
    description: "Key AWS security services (GuardDuty, Inspector, Macie) are not subscribed as Security Hub products; their findings are not correlated."
    mitigation: "Subscribe GuardDuty, Inspector, and Macie as Security Hub product sources."
    references: ["https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-findings-providers.html"]
    tags: ["security-hub", "integration", "guardduty"]

  # ------------------------------------------------------------------
  # AWS Shield
  # ------------------------------------------------------------------
  - id: TMAC-AWS-SHIELD-001
    name: "Shield Advanced not enabled"
    resource_type: "aws_shield_protection"
    check: { attribute: "resource_arn", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Denial of Service"
    description: "No Shield Advanced protections are configured; public-facing resources have no advanced DDoS mitigation or 24/7 DRT support."
    mitigation: "Enable Shield Advanced and associate protections with all public-facing resources (ALB, CloudFront, Route53, Elastic IP)."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/shield-chapter.html"]
    tags: ["shield", "ddos", "availability"]

  - id: TMAC-AWS-SHIELD-002
    name: "Shield Protection without health-based detection"
    resource_type: "aws_shield_protection"
    check: { attribute: "health_check_ids", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Denial of Service"
    description: "The Shield protection does not link a Route53 health check; health-based detection cannot trigger proactive engagement."
    mitigation: "Associate health_check_ids with the Shield protection for proactive DDoS detection."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/ddos-choosing-protection.html"]
    tags: ["shield", "health-check", "ddos"]

  - id: TMAC-AWS-SHIELD-003
    name: "Shield Protection Group covering all resources"
    resource_type: "aws_shield_protection_group"
    check: { attribute: "aggregation", condition: "equals", values: ["MAX"] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "The protection group uses MAX aggregation; a single high-traffic resource can trigger a false-positive DDoS alarm."
    mitigation: "Use SUM aggregation for groups of similar resources to reduce false positives."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/ddos-manage-attack-statistics.html"]
    tags: ["shield", "protection-group", "aggregation"]

  - id: TMAC-AWS-SHIELD-004
    name: "Shield not covering Route53 Hosted Zones"
    resource_type: "aws_shield_protection"
    check: { attribute: "resource_arn", condition: "not_regex", values: ["arn:aws:route53:::hostedzone/"] }
    severity: "High"
    stride: "Denial of Service"
    description: "Route53 hosted zones are not protected by Shield Advanced; DNS amplification attacks can knock out name resolution."
    mitigation: "Add Shield Advanced protections for all public Route53 hosted zones."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/ddos-choosing-protection.html"]
    tags: ["shield", "route53", "dns-ddos"]

  - id: TMAC-AWS-SHIELD-005
    name: "Shield Protection Group without tags"
    resource_type: "aws_shield_protection_group"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Shield protection group has no governance tags."
    mitigation: "Add environment and owner tags."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/ddos-protection-groups.html"]
    tags: ["shield", "tagging"]

  - id: TMAC-AWS-SHIELD-006
    name: "Shield Protection not covering CloudFront"
    resource_type: "aws_shield_protection"
    check: { attribute: "resource_arn", condition: "not_regex", values: ["arn:aws:cloudfront::"] }
    severity: "High"
    stride: "Denial of Service"
    description: "CloudFront distributions are not covered by Shield Advanced; layer 7 DDoS attacks against CDN origins are not mitigated."
    mitigation: "Add Shield Advanced protections for all CloudFront distributions serving public traffic."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/ddos-choosing-protection.html"]
    tags: ["shield", "cloudfront", "ddos"]

  - id: TMAC-AWS-SHIELD-007
    name: "Shield without proactive engagement enabled"
    resource_type: "aws_shield_proactive_engagement"
    check: { attribute: "enabled", condition: "equals", values: [false] }
    severity: "High"
    stride: "Denial of Service"
    description: "Proactive engagement is disabled; AWS DRT will not contact the operations team during high-confidence DDoS events."
    mitigation: "Enable proactive engagement and add emergency contacts via aws_shield_proactive_engagement."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/ddos-srt-access.html"]
    tags: ["shield", "proactive-engagement", "drt"]

  - id: TMAC-AWS-SHIELD-008
    name: "Shield Protection without tags"
    resource_type: "aws_shield_protection"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Shield protection has no governance tags."
    mitigation: "Add environment and owner tags."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/shield-chapter.html"]
    tags: ["shield", "tagging"]

  # ------------------------------------------------------------------
  # AWS IAM Identity Center (SSO)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-SSOADMIN-001
    name: "IAM Identity Center Permission Set with AdministratorAccess"
    resource_type: "aws_ssoadmin_permission_set"
    check: { attribute: "name", condition: "regex", values: ["(?i)(admin|administrator|root|superuser)"] }
    severity: "Critical"
    stride: "Elevation of Privilege"
    description: "A Permission Set with an admin-level name grants full account access; over-assignment leads to privilege escalation."
    mitigation: "Apply least-privilege Permission Sets; restrict AdministratorAccess to a break-glass Permission Set with strict assignment controls."
    references: ["https://docs.aws.amazon.com/singlesignon/latest/userguide/howtocreatepermissionset.html"]
    tags: ["identity-center", "sso", "permission-set", "admin"]

  - id: TMAC-AWS-SSOADMIN-002
    name: "IAM Identity Center Permission Set with long session duration"
    resource_type: "aws_ssoadmin_permission_set"
    check: { attribute: "session_duration", condition: "regex", values: ["PT(1[0-9]|[2-9][0-9]|[1-9][0-9]{2,})H"] }
    severity: "High"
    stride: "Elevation of Privilege"
    description: "The Permission Set has a session duration over 12 hours; a compromised session remains valid for an extended period."
    mitigation: "Set session_duration <= PT8H (8 hours) for standard roles; PT1H for privileged roles."
    references: ["https://docs.aws.amazon.com/singlesignon/latest/userguide/howtosessionduration.html"]
    tags: ["identity-center", "sso", "permission-set", "session"]

  - id: TMAC-AWS-SSOADMIN-003
    name: "IAM Identity Center Permission Set without managed policy"
    resource_type: "aws_ssoadmin_permission_set"
    check: { attribute: "managed_policy_arns", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Repudiation"
    description: "The Permission Set has no managed or inline policies; users assigned to it have no effective permissions, potentially masking misconfiguration."
    mitigation: "Define managed_policy_arns or inline_policy to grant explicit least-privilege permissions."
    references: ["https://docs.aws.amazon.com/singlesignon/latest/userguide/howtocreatepermissionset.html"]
    tags: ["identity-center", "sso", "permission-set", "iam"]

  - id: TMAC-AWS-SSOADMIN-004
    name: "IAM Identity Center account assignment for all users"
    resource_type: "aws_ssoadmin_account_assignment"
    check: { attribute: "principal_type", condition: "equals", values: ["USER"] }
    severity: "High"
    stride: "Elevation of Privilege"
    description: "Account assignments are made directly to individual users instead of groups; this makes access reviews difficult and increases risk of orphaned permissions."
    mitigation: "Assign Permission Sets to groups, not individual users; manage membership at the group level."
    references: ["https://docs.aws.amazon.com/singlesignon/latest/userguide/assign-user-access.html"]
    tags: ["identity-center", "sso", "account-assignment", "groups"]

  - id: TMAC-AWS-SSOADMIN-005
    name: "IAM Identity Center Permission Set without tags"
    resource_type: "aws_ssoadmin_permission_set"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Permission Set has no governance tags."
    mitigation: "Add environment, team, and access-level tags."
    references: ["https://docs.aws.amazon.com/singlesignon/latest/userguide/tagging.html"]
    tags: ["identity-center", "sso", "permission-set", "tagging"]

  - id: TMAC-AWS-SSOADMIN-006
    name: "IAM Identity Center customer managed policy not scoped"
    resource_type: "aws_ssoadmin_customer_managed_policy_attachment"
    check: { attribute: "customer_managed_policy_reference.path", condition: "equals", values: ["/"] }
    severity: "Medium"
    stride: "Elevation of Privilege"
    description: "The customer managed policy is attached from the root path (/); any IAM policy with that name in any account is linked, risking policy confusion."
    mitigation: "Use a scoped path (e.g., /sso/) for policies attached via Identity Center."
    references: ["https://docs.aws.amazon.com/singlesignon/latest/userguide/howtocmp.html"]
    tags: ["identity-center", "sso", "policy", "path"]

  - id: TMAC-AWS-SSOADMIN-007
    name: "IAM Identity Center MFA not enforced"
    resource_type: "aws_ssoadmin_instance_access_control_attributes"
    check: { attribute: "instance_access_control_attributes", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Spoofing"
    description: "Identity Center access control attributes (ABAC) are not configured; MFA context cannot be used in permission policies."
    mitigation: "Configure instance_access_control_attributes for MFA and group membership; enforce MFA in the identity provider."
    references: ["https://docs.aws.amazon.com/singlesignon/latest/userguide/configure-abac.html"]
    tags: ["identity-center", "sso", "mfa", "abac"]

  - id: TMAC-AWS-SSOADMIN-008
    name: "IAM Identity Center permission boundary not applied"
    resource_type: "aws_ssoadmin_permissions_boundary_attachment"
    check: { attribute: "permissions_boundary.managed_policy_arn", condition: "not_exists", values: [], and_check: { attribute: "permissions_boundary.customer_managed_policy_reference", condition: "not_exists", values: [] } }
    severity: "High"
    stride: "Elevation of Privilege"
    description: "No permissions boundary is attached to the Permission Set; inline or managed policies may grant permissions beyond intended scope."
    mitigation: "Attach a permissions boundary limiting the maximum permissions for all Identity Center roles."
    references: ["https://docs.aws.amazon.com/singlesignon/latest/userguide/how-to-set-permissions-boundary.html"]
    tags: ["identity-center", "sso", "permissions-boundary", "iam"]

  # ------------------------------------------------------------------
  # AWS WAF CAPTCHA
  # ------------------------------------------------------------------
  - id: TMAC-AWS-WAFCAPTCHA-001
    name: "WAF CAPTCHA action with zero immunity time"
    resource_type: "aws_wafv2_web_acl"
    check: { attribute: "captcha_config.immunity_time_property.immunity_time", condition: "equals", values: [0] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "CAPTCHA immunity time is 0; users must solve a CAPTCHA on every request, severely degrading legitimate user experience."
    mitigation: "Set immunity_time >= 300 seconds (5 minutes) to balance bot protection and UX."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/waf-captcha-and-challenge.html"]
    tags: ["waf", "captcha", "ux", "dos"]

  - id: TMAC-AWS-WAFCAPTCHA-002
    name: "WAF CAPTCHA applied to all requests without scope-down"
    resource_type: "aws_wafv2_web_acl"
    check: { attribute: "rule.action.captcha", condition: "exists", values: [], and_check: { attribute: "rule.statement.managed_rule_group_statement", condition: "not_exists", values: [] } }
    severity: "Medium"
    stride: "Denial of Service"
    description: "CAPTCHA is applied without a scope-down statement; legitimate API callers and bots are treated identically."
    mitigation: "Add a scope-down statement to apply CAPTCHA only to browser-based traffic (e.g., exclude API key header)."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/waf-captcha-and-challenge.html"]
    tags: ["waf", "captcha", "scope"]

  - id: TMAC-AWS-WAFCAPTCHA-003
    name: "WAF Challenge action not used for bot detection"
    resource_type: "aws_wafv2_web_acl"
    check: { attribute: "rule.action.challenge", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Tampering"
    description: "The Silent Challenge action is not used; automated bot traffic (scrapers, credential stuffing) is not challenged before reaching the application."
    mitigation: "Add a rule with action.challenge for endpoints vulnerable to automated attacks."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/waf-captcha-and-challenge.html"]
    tags: ["waf", "captcha", "bot-protection", "challenge"]

  - id: TMAC-AWS-WAFCAPTCHA-004
    name: "WAF CAPTCHA token domain configuration not scoped"
    resource_type: "aws_wafv2_web_acl"
    check: { attribute: "token_domains", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Spoofing"
    description: "No token_domains are specified; CAPTCHA/challenge tokens may be reused across different domains, enabling token replay attacks."
    mitigation: "Define token_domains to restrict token validity to the specific application domains."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/waf-tokens.html"]
    tags: ["waf", "captcha", "token", "replay"]

  - id: TMAC-AWS-WAFCAPTCHA-005
    name: "WAF CAPTCHA on login endpoint without rate limiting"
    resource_type: "aws_wafv2_web_acl"
    check: { attribute: "rule.action.captcha", condition: "exists", values: [], and_check: { attribute: "rule.statement.rate_based_statement", condition: "not_exists", values: [] } }
    severity: "High"
    stride: "Denial of Service"
    description: "CAPTCHA is applied on the login endpoint but without rate-based rules; CAPTCHA bypass via distributed bots is still possible."
    mitigation: "Combine CAPTCHA with rate_based_statement to limit attempts per IP."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/waf-rate-based-rules.html"]
    tags: ["waf", "captcha", "rate-limiting", "brute-force"]

  - id: TMAC-AWS-WAFCAPTCHA-006
    name: "WAF CAPTCHA immunity time too long for sensitive endpoints"
    resource_type: "aws_wafv2_web_acl"
    check: { attribute: "captcha_config.immunity_time_property.immunity_time", condition: "in", values: [3600, 7200, 86400] }
    severity: "Medium"
    stride: "Spoofing"
    description: "CAPTCHA immunity time exceeds 1 hour for sensitive endpoints; a CAPTCHA solved once allows an attacker to make many requests within the immunity window."
    mitigation: "Reduce immunity_time for sensitive endpoints (login, checkout, API) to 300-600 seconds."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/waf-captcha-and-challenge.html"]
    tags: ["waf", "captcha", "immunity-time"]

  - id: TMAC-AWS-WAFCAPTCHA-007
    name: "WAF CAPTCHA without fallback block action"
    resource_type: "aws_wafv2_web_acl"
    check: { attribute: "rule.override_action", condition: "exists", values: [], and_check: { attribute: "rule.action.captcha", condition: "not_exists", values: [] } }
    severity: "Medium"
    stride: "Tampering"
    description: "Rules in count mode do not enforce CAPTCHA; bots are observed but not challenged."
    mitigation: "Switch CAPTCHA rules from count/override to action.captcha in production."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/waf-captcha-and-challenge.html"]
    tags: ["waf", "captcha", "count-mode"]

  - id: TMAC-AWS-WAFCAPTCHA-008
    name: "WAF CAPTCHA integration missing JavaScript SDK"
    resource_type: "aws_wafv2_web_acl"
    check: { attribute: "rule.action.captcha", condition: "exists", values: [] }
    severity: "Low"
    stride: "Spoofing"
    description: "CAPTCHA is enabled in WAF but may not be integrated with the AWS WAF JavaScript SDK on the application; the challenge may not render correctly for users."
    mitigation: "Integrate the AWS WAF JavaScript SDK in web pages that trigger CAPTCHA challenges."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/waf-js-challenge-api.html"]
    tags: ["waf", "captcha", "sdk", "integration"]
