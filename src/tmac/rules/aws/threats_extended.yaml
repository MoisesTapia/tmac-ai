  - id: TMAC-AWS-KMSAL-002
    name: "KMS Alias with the reserved AWS prefix"
    resource_type: "aws_kms_alias"
    check: { attribute: "name", condition: "regex", values: ["^alias/aws/"] }
    severity: "Low"
    stride: "Tampering"
    description: "The alias uses the reserved alias/aws/ prefix, reserved for AWS-managed keys."
    mitigation: "Use your own prefix (alias/<project>/...)."
    references: ["https://docs.aws.amazon.com/kms/latest/developerguide/kms-alias.html"]
    tags: ["kms", "alias"]
  - id: TMAC-AWS-KMSAL-003
    name: "KMS Alias with a generic name"
    resource_type: "aws_kms_alias"
    check: { attribute: "name", condition: "regex", values: ["(?i)alias/(test|tmp|key|default)$"] }
    severity: "Info"
    stride: "Repudiation"
    description: "The alias uses a generic name, making it hard to identify the key's purpose."
    mitigation: "Use descriptive names per service/use."
    references: ["https://docs.aws.amazon.com/kms/latest/developerguide/kms-alias.html"]
    tags: ["kms", "alias", "naming"]
  - id: TMAC-AWS-KMSAL-004
    name: "KMS Alias without a project namespace"
    resource_type: "aws_kms_alias"
    check: { attribute: "name", condition: "not_contains", values: ["/"] }
    severity: "Info"
    stride: "Repudiation"
    description: "The alias does not use namespacing with '/', hindering key organization."
    mitigation: "Adopt the alias/<project>/<use> convention."
    references: ["https://docs.aws.amazon.com/kms/latest/developerguide/kms-alias.html"]
    tags: ["kms", "alias", "naming"]
  - id: TMAC-AWS-KMSAL-005
    name: "KMS Alias potentially shared across environments"
    resource_type: "aws_kms_alias"
    check: { attribute: "name", condition: "not_contains", values: ["prod"] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "The alias does not distinguish environment; keys shared across environments widen the blast radius."
    mitigation: "Separate keys and aliases by environment."
    references: ["https://docs.aws.amazon.com/kms/latest/developerguide/kms-alias.html"]
    tags: ["kms", "alias", "segregation"]
  - id: TMAC-AWS-KMSAL-006
    name: "KMS Alias without the alias/ prefix"
    resource_type: "aws_kms_alias"
    check: { attribute: "name", condition: "not_contains", values: ["alias/"] }
    severity: "Low"
    stride: "Tampering"
    description: "The alias does not use the required 'alias/' prefix."
    mitigation: "Prefix the name with 'alias/'."
    references: ["https://docs.aws.amazon.com/kms/latest/developerguide/kms-alias.html"]
    tags: ["kms", "alias"]
  - id: TMAC-AWS-KMSAL-007
    name: "KMS Alias with an unaudited dynamic name_prefix"
    resource_type: "aws_kms_alias"
    check: { attribute: "name_prefix", condition: "exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The alias uses a dynamic name_prefix; it hinders referencing the key in a stable way."
    mitigation: "Prefer stable, descriptive alias names."
    references: ["https://docs.aws.amazon.com/kms/latest/developerguide/kms-alias.html"]
    tags: ["kms", "alias"]
  - id: TMAC-AWS-KMSAL-008
    name: "KMS Alias without a declared use"
    resource_type: "aws_kms_alias"
    check: { attribute: "name", condition: "regex", values: ["(?i)alias/[a-z0-9-]{1,4}$"] }
    severity: "Info"
    stride: "Repudiation"
    description: "The alias name is too short, making its use hard to understand."
    mitigation: "Use names descriptive of the key's purpose."
    references: ["https://docs.aws.amazon.com/kms/latest/developerguide/kms-alias.html"]
    tags: ["kms", "alias", "naming"]

