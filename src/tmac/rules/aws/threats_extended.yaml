  - id: TMAC-AWS-PINSTREAM-007
    name: "Pinpoint Event Stream without event segregation"
    resource_type: "aws_pinpoint_event_stream"
    check: { attribute: "destination_stream_arn", condition: "regex", values: ["(?i)(test|dev|tmp)"] }
