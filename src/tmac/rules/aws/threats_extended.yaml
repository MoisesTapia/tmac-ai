  - id: TMAC-AWS-SMTJ-007
    name: "SageMaker Training Job role with AdministratorAccess"
    resource_type: "aws_sagemaker_training_job"
    check: { attribute: "role_arn", condition: "regex", values: ["AdministratorAccess|FullAccess"] }
    severity: "Critical"
    stride: "Elevation of Privilege"
    description: "The training role has excessive IAM permissions, enabling privilege escalation from within the training container."
    mitigation: "Apply least-privilege IAM roles scoped to required S3 paths and services."
    references: ["https://docs.aws.amazon.com/sagemaker/latest/dg/security-iam.html"]
    tags: ["sagemaker", "training", "iam", "ml"]

  - id: TMAC-AWS-SMTJ-008
    name: "SageMaker Training Job without tags"
    resource_type: "aws_sagemaker_training_job"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The training job has no governance tags, hindering cost attribution and audit trail."
    mitigation: "Add project, model-version, and data-classification tags."
    references: ["https://docs.aws.amazon.com/sagemaker/latest/dg/tagging-resources.html"]
