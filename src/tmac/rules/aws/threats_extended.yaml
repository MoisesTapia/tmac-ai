  # ------------------------------------------------------------------
  # aws_textract  (logical — no dedicated Terraform resource;
  #                applies to iam_policy and s3 config used by Textract)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-TEXTRACT-001
    name: "Textract output SNS topic without KMS encryption"
    resource_type: "aws_sns_topic"
    check: { attribute: "kms_master_key_id", condition: "not_exists", values: [], and_check: { attribute: "name", condition: "regex", values: ["(?i)(textract|ocr|document)"] } }
    severity: "High"
    stride: "Information Disclosure"
    description: "An SNS topic used by Textract for async job completion notifications is not encrypted; document analysis results containing PII/PHI may be exposed."
    mitigation: "Set kms_master_key_id on SNS topics receiving Textract notifications."
    references: ["https://docs.aws.amazon.com/textract/latest/dg/async-notification-payload.html"]
    tags: ["textract", "ocr", "sns", "encryption", "ml"]

  - id: TMAC-AWS-TEXTRACT-002
    name: "Textract caller role without condition on source bucket"
    resource_type: "aws_iam_role"
    check: { attribute: "name", condition: "regex", values: ["(?i)(textract)"] }
    severity: "High"
    stride: "Elevation of Privilege"
    description: "The Textract caller role lacks S3 bucket conditions; it can read from any S3 bucket in the account, not just the intended document bucket."
    mitigation: "Add aws:ResourceAccount and specific bucket ARN conditions to the Textract execution role."
    references: ["https://docs.aws.amazon.com/textract/latest/dg/security-iam.html"]
    tags: ["textract", "ocr", "iam", "ml"]

  - id: TMAC-AWS-TEXTRACT-003
    name: "Textract output S3 bucket without KMS"
    resource_type: "aws_s3_bucket"
    check: { attribute: "tags.Service", condition: "equals", values: ["textract"] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The S3 bucket used for Textract output does not enforce SSE-KMS; OCR'd text from sensitive documents may be exposed."
    mitigation: "Apply SSE-KMS with a CMK on the Textract output bucket."
    references: ["https://docs.aws.amazon.com/textract/latest/dg/security-data-protection.html"]
    tags: ["textract", "ocr", "s3", "encryption", "ml"]

  - id: TMAC-AWS-TEXTRACT-004
    name: "Textract processing documents containing PHI without HIPAA configuration"
    resource_type: "aws_s3_bucket"
    check: { attribute: "tags.DataClassification", condition: "equals", values: ["PHI"], and_check: { attribute: "tags.Service", condition: "equals", values: ["textract"] } }
    severity: "Critical"
    stride: "Information Disclosure"
    description: "PHI documents are processed by Textract; ensure a BAA is in place with AWS and the output is encrypted and access-controlled."
    mitigation: "Ensure BAA, encrypt output with CMK, restrict access via IAM, enable CloudTrail."
    references: ["https://docs.aws.amazon.com/textract/latest/dg/security.html"]
    tags: ["textract", "ocr", "hipaa", "phi", "ml"]

  - id: TMAC-AWS-TEXTRACT-005
    name: "Textract human review loop without access control"
    resource_type: "aws_sagemaker_flow_definition"
    check: { attribute: "tags.Service", condition: "equals", values: ["textract"] }
    severity: "High"
    stride: "Information Disclosure"
    description: "Human review of Textract uncertain results exposes document content to reviewers; without access controls, PII/PHI can be over-shared."
    mitigation: "Restrict the A2I flow definition to authorized reviewers; encrypt the human task data with a CMK."
    references: ["https://docs.aws.amazon.com/textract/latest/dg/a2i-textract.html"]
    tags: ["textract", "a2i", "human-review", "pii", "ml"]

  - id: TMAC-AWS-TEXTRACT-006
    name: "Textract document without input integrity verification"
    resource_type: "aws_s3_bucket"
    check: { attribute: "tags.Service", condition: "equals", values: ["textract"] }
    severity: "Medium"
    stride: "Tampering"
    description: "Documents submitted to Textract are not verified for integrity before processing; a compromised pipeline could swap documents."
    mitigation: "Verify S3 ETag/checksum before submitting documents to Textract."
    references: ["https://docs.aws.amazon.com/textract/latest/dg/API_GetDocumentAnalysis.html"]
    tags: ["textract", "ocr", "data-integrity", "ml"]

  - id: TMAC-AWS-TEXTRACT-007
    name: "Textract adapter without version pinning"
    resource_type: "aws_textract_adapter"
    check: { attribute: "auto_update", condition: "equals", values: ["ENABLED"] }
    severity: "Medium"
    stride: "Tampering"
    description: "Auto-update is enabled on the Textract adapter; a new model version may change extraction behavior unpredictably in production."
    mitigation: "Use auto_update = DISABLED and pin to a validated adapter version."
    references: ["https://docs.aws.amazon.com/textract/latest/dg/adapters-how-it-works.html"]
    tags: ["textract", "ocr", "version-control", "ml"]

  - id: TMAC-AWS-TEXTRACT-008
    name: "Textract adapter without tags"
