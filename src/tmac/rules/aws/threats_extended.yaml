# =====================================================================
# TMAC — Extended rules (broad coverage per resource type)
# Goal: at least 8 rules for each resource type with a real security
# surface. Complements threats.yaml without modifying it.
# =====================================================================
version: "1.0"
rules:

  # ------------------------------------------------------------------
  # aws_vpc  (complements VPC-001)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-VPC-003
    name: "VPC without DNS hostnames"
    resource_type: "aws_vpc"
    check: { attribute: "enable_dns_hostnames", condition: "equals", values: [false] }
    severity: "Low"
    stride: "Repudiation"
    description: "The VPC does not enable DNS hostnames, hindering resource resolution and traceability."
    mitigation: "Set enable_dns_hostnames = true."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/vpc-dns.html"]
    tags: ["vpc", "dns", "network"]

  - id: TMAC-AWS-VPC-004
    name: "VPC without DNS support"
    resource_type: "aws_vpc"
    check: { attribute: "enable_dns_support", condition: "equals", values: [false] }
    severity: "Low"
    stride: "Denial of Service"
    description: "The VPC disables DNS support, which breaks internal resolution and private endpoints."
    mitigation: "Set enable_dns_support = true."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/vpc-dns.html"]
    tags: ["vpc", "dns", "network"]

  - id: TMAC-AWS-VPC-005
    name: "VPC with undeclared dedicated tenancy"
    resource_type: "aws_vpc"
    check: { attribute: "instance_tenancy", condition: "equals", values: ["default"] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "The VPC uses 'default' tenancy; sensitive workloads may require dedicated tenancy for compliance."
    mitigation: "Evaluate instance_tenancy = dedicated for regulated workloads."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/dedicated-instance.html"]
    tags: ["vpc", "compliance"]

  - id: TMAC-AWS-VPC-006
    name: "VPC with a too-broad CIDR"
    resource_type: "aws_vpc"
    check: { attribute: "cidr_block", condition: "regex", values: ["/(8|9|10|11|12)$"] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "The VPC CIDR block is too broad (/8-/12), increasing the network surface and the risk of overlap."
    mitigation: "Use a tighter CIDR (e.g. /16) sized to the actual need."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/vpc-cidr-blocks.html"]
    tags: ["vpc", "network", "cidr"]

  - id: TMAC-AWS-VPC-007
    name: "VPC without governance tags"
    resource_type: "aws_vpc"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The VPC does not define tags, hindering cost attribution, ownership and auditing."
    mitigation: "Add ownership, environment and cost-center tags."
    references: ["https://docs.aws.amazon.com/tag-editor/latest/userguide/tagging.html"]
    tags: ["vpc", "governance", "tagging"]

  - id: TMAC-AWS-VPC-008
    name: "VPC without an identifiable name"
    resource_type: "aws_vpc"
    check: { attribute: "tags.Name", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The VPC has no Name tag, complicating operational identification."
    mitigation: "Add tags = { Name = \"...\" }."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/"]
    tags: ["vpc", "tagging"]

  # ------------------------------------------------------------------
  # aws_subnet
  # ------------------------------------------------------------------
  - id: TMAC-AWS-SUBNET-001
    name: "Subnet with automatic public IP"
    resource_type: "aws_subnet"
    check: { attribute: "map_public_ip_on_launch", condition: "equals", values: [true] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The subnet assigns public IPs automatically; instances become exposed to the internet without explicit intent."
    mitigation: "Set map_public_ip_on_launch = false except in controlled public subnets."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/vpc-ip-addressing.html"]
    tags: ["subnet", "network", "exposure"]

  - id: TMAC-AWS-SUBNET-002
    name: "Subnet with automatic public IPv6"
    resource_type: "aws_subnet"
    check: { attribute: "assign_ipv6_address_on_creation", condition: "equals", values: [true] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The subnet assigns IPv6 addresses automatically, exposing resources via IPv6."
    mitigation: "Disable assign_ipv6_address_on_creation unless needed."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/working-with-subnets.html"]
    tags: ["subnet", "ipv6", "exposure"]

  - id: TMAC-AWS-SUBNET-003
    name: "Subnet without a Name tag"
    resource_type: "aws_subnet"
    check: { attribute: "tags.Name", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The subnet has no Name tag, hindering its identification."
    mitigation: "Add tags = { Name = \"...\" }."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/"]
    tags: ["subnet", "tagging"]

  - id: TMAC-AWS-SUBNET-004
    name: "Subnet without tags"
    resource_type: "aws_subnet"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The subnet does not define governance tags."
    mitigation: "Add environment and ownership tags."
    references: ["https://docs.aws.amazon.com/tag-editor/latest/userguide/tagging.html"]
    tags: ["subnet", "tagging"]

  - id: TMAC-AWS-SUBNET-005
    name: "Subnet without an explicit AZ"
    resource_type: "aws_subnet"
    check: { attribute: "availability_zone", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Denial of Service"
    description: "The subnet does not pin an explicit AZ; non-deterministic deployments can break high availability."
    mitigation: "Define availability_zone explicitly and distribute across multiple AZs."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/"]
    tags: ["subnet", "availability"]

  - id: TMAC-AWS-SUBNET-006
    name: "Subnet with a broad CIDR"
    resource_type: "aws_subnet"
    check: { attribute: "cidr_block", condition: "regex", values: ["/(8|9|10|11|12|13|14|15|16)$"] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "The subnet CIDR is too broad for a typical subnet."
    mitigation: "Size the subnet CIDR (e.g. /24) according to the load."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/subnet-sizing.html"]
    tags: ["subnet", "cidr"]

  - id: TMAC-AWS-SUBNET-007
    name: "Subnet without customer-owned balancing"
    resource_type: "aws_subnet"
    check: { attribute: "customer_owned_ipv4_pool", condition: "exists", values: [] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "The subnet uses a customer-owned IP pool (Outposts); verify the exposure scope."
    mitigation: "Review whether the use of customer-owned IPs is intentional."
    references: ["https://docs.aws.amazon.com/outposts/latest/userguide/"]
    tags: ["subnet", "outposts"]

  - id: TMAC-AWS-SUBNET-008
    name: "Subnet with DNS64 enabled"
    resource_type: "aws_subnet"
    check: { attribute: "enable_dns64", condition: "equals", values: [true] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "The subnet enables DNS64; verify that NAT64 translation is part of the network design."
    mitigation: "Confirm that DNS64 is required by the IPv6 architecture."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-nat64-dns64.html"]
    tags: ["subnet", "ipv6", "dns64"]

  # ------------------------------------------------------------------
  # aws_vpc (closing to 8) — missing flow log is modeled separately
  # ------------------------------------------------------------------
  - id: TMAC-AWS-VPC-009
    name: "VPC with undeclared data classification"
    resource_type: "aws_vpc"
    check: { attribute: "tags.DataClassification", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "The VPC does not declare data classification in tags, hindering applying controls by sensitivity."
    mitigation: "Add tags.DataClassification (e.g. public/internal/confidential)."
    references: ["https://docs.aws.amazon.com/whitepapers/latest/data-classification/data-classification.html"]
    tags: ["vpc", "governance", "data-classification"]

  # ------------------------------------------------------------------
  # aws_lb  (complements ALB-001)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-LB-004
    name: "Load Balancer without deletion protection"
    resource_type: "aws_lb"
    check: { attribute: "enable_deletion_protection", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Denial of Service"
    description: "The Load Balancer has no deletion protection; an accidental change can leave the service with no entry point."
    mitigation: "Set enable_deletion_protection = true in production."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/application/application-load-balancers.html"]
    tags: ["alb", "availability"]

  - id: TMAC-AWS-LB-005
    name: "ALB without invalid header dropping"
    resource_type: "aws_lb"
    check: { attribute: "drop_invalid_header_fields", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Tampering"
    description: "The ALB does not drop invalid HTTP headers, enabling request smuggling or header injection attacks."
    mitigation: "Set drop_invalid_header_fields = true."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/application/application-load-balancers.html#load-balancer-attributes"]
    tags: ["alb", "http", "tampering"]

  - id: TMAC-AWS-LB-006
    name: "ALB without desync mitigation mode"
    resource_type: "aws_lb"
    check: { attribute: "desync_mitigation_mode", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Tampering"
    description: "The ALB does not configure desync_mitigation_mode, leaving the default behavior against HTTP desynchronization."
    mitigation: "Configure desync_mitigation_mode = strictest or defensive."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/application/"]
    tags: ["alb", "http"]

  - id: TMAC-AWS-LB-007
    name: "Load Balancer without tags"
    resource_type: "aws_lb"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Load Balancer does not define governance tags."
    mitigation: "Add ownership and environment tags."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/application/"]
    tags: ["alb", "tagging"]

  - id: TMAC-AWS-LB-008
    name: "Network Load Balancer without cross-zone balancing"
    resource_type: "aws_lb"
    check: { attribute: "enable_cross_zone_load_balancing", condition: "equals", values: [false] }
    severity: "Low"
    stride: "Denial of Service"
    description: "Cross-zone balancing is disabled, which can concentrate load and reduce resilience to an AZ failure."
    mitigation: "Enable enable_cross_zone_load_balancing unless justified by cost."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/network/"]
    tags: ["nlb", "availability"]

  # ------------------------------------------------------------------
  # aws_lb_listener  (complements ALB-002)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-LBL-001
    name: "Listener with an obsolete TLS policy"
    resource_type: "aws_lb_listener"
    check: { attribute: "ssl_policy", condition: "regex", values: ["TLS-1-0|TLS-1-1|2015|2016"] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The listener uses an obsolete SSL/TLS policy (TLS 1.0/1.1), vulnerable to known attacks."
    mitigation: "Use ELBSecurityPolicy-TLS13-1-2-2021-06 or higher."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/application/create-https-listener.html"]
    tags: ["alb", "listener", "tls"]

  - id: TMAC-AWS-LBL-002
    name: "HTTP listener without encryption"
    resource_type: "aws_lb_listener"
    check: { attribute: "protocol", condition: "equals", values: ["HTTP"] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The listener accepts plaintext HTTP; the traffic is not encrypted in transit."
    mitigation: "Use HTTPS or redirect HTTP→HTTPS with a redirect action."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/application/create-https-listener.html"]
    tags: ["alb", "listener", "encryption-in-transit"]

  - id: TMAC-AWS-LBL-003
    name: "Listener without a declared certificate"
    resource_type: "aws_lb_listener"
    check: { attribute: "certificate_arn", condition: "not_exists", values: [], and_check: { attribute: "protocol", condition: "equals", values: ["HTTPS"] } }
    severity: "High"
    stride: "Spoofing"
    description: "HTTPS listener without an explicit certificate_arn; it may use an inappropriate default certificate."
    mitigation: "Associate a valid ACM certificate with certificate_arn."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/application/create-https-listener.html"]
    tags: ["alb", "listener", "tls"]

  - id: TMAC-AWS-LBL-004
    name: "Listener on a non-standard port for TLS"
    resource_type: "aws_lb_listener"
    check: { attribute: "protocol", condition: "equals", values: ["TCP"] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "The listener uses plain TCP; consider TLS for encrypted termination at the load balancer."
    mitigation: "Use TLS protocol on NLB or HTTPS on ALB."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/network/create-tls-listener.html"]
    tags: ["nlb", "listener", "tls"]

  - id: TMAC-AWS-LBL-005
    name: "Listener with an insecure fixed-response default action"
    resource_type: "aws_lb_listener"
    check: { attribute: "default_action.type", condition: "equals", values: ["fixed-response"] }
    severity: "Info"
    stride: "Tampering"
    description: "The listener responds with a default fixed-response; verify that it does not expose information or bypass authentication."
    mitigation: "Confirm that the fixed response does not leak internal details."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/application/"]
    tags: ["alb", "listener"]

  - id: TMAC-AWS-LBL-006
    name: "Listener without ALPN for TLS"
    resource_type: "aws_lb_listener"
    check: { attribute: "alpn_policy", condition: "not_exists", values: [], and_check: { attribute: "protocol", condition: "equals", values: ["TLS"] } }
    severity: "Info"
    stride: "Information Disclosure"
    description: "TLS listener without a declared ALPN policy."
    mitigation: "Define alpn_policy according to the application protocol (HTTP2Optional, etc.)."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/network/create-tls-listener.html"]
    tags: ["nlb", "listener", "tls"]

  - id: TMAC-AWS-LBL-007
    name: "Listener without a TLS 1.3 policy"
    resource_type: "aws_lb_listener"
    check: { attribute: "ssl_policy", condition: "regex", values: ["TLS-1-2-2017|TLS-1-2-Ext"] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "The listener uses an old TLS 1.2 policy; TLS 1.3 policies offer better ciphers."
    mitigation: "Migrate to ELBSecurityPolicy-TLS13-1-2-2021-06."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html"]
    tags: ["alb", "listener", "tls"]

  # ------------------------------------------------------------------
  # aws_lb_target_group
  # ------------------------------------------------------------------
  - id: TMAC-AWS-TG-001
    name: "Target Group without a health check"
    resource_type: "aws_lb_target_group"
    check: { attribute: "health_check", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "The target group does not define a health check; unhealthy instances would keep receiving traffic."
    mitigation: "Configure a health_check block with a path and thresholds."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html"]
    tags: ["alb", "target-group", "availability"]

  - id: TMAC-AWS-TG-002
    name: "Target Group with an HTTP health check"
    resource_type: "aws_lb_target_group"
    check: { attribute: "health_check.protocol", condition: "equals", values: ["HTTP"] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "The health check uses plaintext HTTP to the targets."
    mitigation: "Use HTTPS on the health check when targets support TLS."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html"]
    tags: ["alb", "target-group"]

  - id: TMAC-AWS-TG-003
    name: "Target Group without a TLS protocol"
    resource_type: "aws_lb_target_group"
    check: { attribute: "protocol", condition: "equals", values: ["HTTP"] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The target group forwards traffic in plain HTTP to the targets (no backend encryption)."
    mitigation: "Use protocol = HTTPS to the targets when possible."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-target-groups.html"]
    tags: ["alb", "target-group", "encryption-in-transit"]

  - id: TMAC-AWS-TG-004
    name: "Target Group without controlled stickiness"
    resource_type: "aws_lb_target_group"
    check: { attribute: "stickiness", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "The target group does not declare stickiness configuration; verify that session behavior is as desired."
    mitigation: "Configure the stickiness block explicitly."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/application/sticky-sessions.html"]
    tags: ["alb", "target-group"]

  - id: TMAC-AWS-TG-005
    name: "Target Group without deregistration delay"
    resource_type: "aws_lb_target_group"
    check: { attribute: "deregistration_delay", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Denial of Service"
    description: "Without an explicit deregistration_delay, in-flight connections may be cut during deployments."
    mitigation: "Tune deregistration_delay to the expected drain time."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-target-groups.html"]
    tags: ["alb", "target-group", "availability"]

  - id: TMAC-AWS-TG-006
    name: "Target Group with target_type IP without VPC"
    resource_type: "aws_lb_target_group"
    check: { attribute: "target_type", condition: "equals", values: ["ip"] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "The target group uses target_type ip; verify that registered IPs are within trusted ranges."
    mitigation: "Restrict IP registration to controlled ranges."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-target-groups.html"]
    tags: ["alb", "target-group"]

  - id: TMAC-AWS-TG-007
    name: "Target Group without tags"
    resource_type: "aws_lb_target_group"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The target group does not define governance tags."
    mitigation: "Add ownership and environment tags."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/application/"]
    tags: ["alb", "target-group", "tagging"]

  - id: TMAC-AWS-TG-008
    name: "Target Group with a lax health threshold"
    resource_type: "aws_lb_target_group"
    check: { attribute: "health_check.healthy_threshold", condition: "equals", values: [1] }
    severity: "Info"
    stride: "Denial of Service"
    description: "A healthy threshold of 1 may mark targets as healthy prematurely."
    mitigation: "Use a healthy_threshold >= 2."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html"]
    tags: ["alb", "target-group"]

  - id: TMAC-AWS-LB-009
    name: "Load Balancer without exposure classification in tags"
    resource_type: "aws_lb"
    check: { attribute: "tags.Exposure", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "The Load Balancer does not declare its exposure level in tags, hindering public-surface audits."
    mitigation: "Add tags.Exposure (public/internal) to classify the load balancer."
    references: ["https://docs.aws.amazon.com/elasticloadbalancing/latest/application/"]
    tags: ["alb", "tagging", "governance"]

  # ------------------------------------------------------------------
  # aws_wafv2_web_acl  (complements WAF-001)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-WAFACL-001
    name: "WAF with a default allow action"
    resource_type: "aws_wafv2_web_acl"
    check: { attribute: "default_action.allow", condition: "exists", values: [] }
    severity: "Medium"
    stride: "Tampering"
    description: "The Web ACL allows by default; without sufficient rules, malicious traffic passes unless explicitly blocked."
    mitigation: "Verify there are managed/custom rules covering OWASP Top 10; consider default block on sensitive APIs."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/web-acl-default-action.html"]
    tags: ["waf", "edge"]

  - id: TMAC-AWS-WAFACL-002
    name: "WAF without common managed rules"
    resource_type: "aws_wafv2_web_acl"
    check: { attribute: "rule", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Tampering"
    description: "The Web ACL does not define rules; it offers no effective protection against web attacks."
    mitigation: "Add AWSManagedRulesCommonRuleSet and rate-limiting rules."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/aws-managed-rule-groups-list.html"]
    tags: ["waf", "edge", "owasp"]

  - id: TMAC-AWS-WAFACL-003
    name: "WAF without CloudWatch metrics"
    resource_type: "aws_wafv2_web_acl"
    check: { attribute: "visibility_config.cloudwatch_metrics_enabled", condition: "equals", values: [false] }
    severity: "Low"
    stride: "Repudiation"
    description: "The Web ACL does not emit metrics to CloudWatch, reducing observability of blocks."
    mitigation: "Set cloudwatch_metrics_enabled = true in visibility_config."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/monitoring-cloudwatch.html"]
    tags: ["waf", "observability"]

  - id: TMAC-AWS-WAFACL-004
    name: "WAF without request sampling"
    resource_type: "aws_wafv2_web_acl"
    check: { attribute: "visibility_config.sampled_requests_enabled", condition: "equals", values: [false] }
    severity: "Low"
    stride: "Repudiation"
    description: "The Web ACL does not sample requests, hindering incident investigation."
    mitigation: "Set sampled_requests_enabled = true."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/web-acl-testing.html"]
    tags: ["waf", "observability"]

  - id: TMAC-AWS-WAFACL-005
    name: "WAF CLOUDFRONT scope in regional use"
    resource_type: "aws_wafv2_web_acl"
    check: { attribute: "scope", condition: "equals", values: ["CLOUDFRONT"] }
    severity: "Info"
    stride: "Tampering"
    description: "The Web ACL uses CLOUDFRONT scope; verify that it applies to the correct resource (CloudFront vs regional)."
    mitigation: "Confirm that the scope matches the protected resource."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/how-aws-waf-works.html"]
    tags: ["waf", "edge"]

  - id: TMAC-AWS-WAFACL-006
    name: "WAF without tags"
    resource_type: "aws_wafv2_web_acl"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The Web ACL does not define governance tags."
    mitigation: "Add ownership and environment tags."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/"]
    tags: ["waf", "tagging"]

  - id: TMAC-AWS-WAFACL-007
    name: "WAF without a rate limiting rule"
    resource_type: "aws_wafv2_web_acl"
    check: { attribute: "rule.statement.rate_based_statement", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "The Web ACL does not include a rate-based rule, leaving it exposed to volumetric abuse and brute force."
    mitigation: "Add a rule with rate_based_statement and an appropriate limit."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-rate-based.html"]
    tags: ["waf", "ddos", "rate-limiting"]

  # ------------------------------------------------------------------
  # aws_acm_certificate
  # ------------------------------------------------------------------
  - id: TMAC-AWS-ACM-001
    name: "Certificate with email validation"
    resource_type: "aws_acm_certificate"
    check: { attribute: "validation_method", condition: "equals", values: ["EMAIL"] }
    severity: "Medium"
    stride: "Spoofing"
    description: "The certificate uses email validation, prone to manual errors and to not renewing automatically."
    mitigation: "Use validation_method = DNS for automatic renewal."
    references: ["https://docs.aws.amazon.com/acm/latest/userguide/dns-validation.html"]
    tags: ["acm", "tls", "certificates"]

  - id: TMAC-AWS-ACM-002
    name: "Certificate with a broad wildcard"
    resource_type: "aws_acm_certificate"
    check: { attribute: "domain_name", condition: "regex", values: ["^\\*\\."] }
    severity: "Low"
    stride: "Spoofing"
    description: "The certificate covers a wildcard domain; its compromise would affect all subdomains."
    mitigation: "Limit the certificate scope to the required hosts."
    references: ["https://docs.aws.amazon.com/acm/latest/userguide/acm-certificate.html"]
    tags: ["acm", "tls", "wildcard"]

  - id: TMAC-AWS-ACM-003
    name: "Certificate without log transparency"
    resource_type: "aws_acm_certificate"
    check: { attribute: "options.certificate_transparency_logging_preference", condition: "equals", values: ["DISABLED"] }
    severity: "Low"
    stride: "Repudiation"
    description: "The certificate disables Certificate Transparency logging, reducing detection of improper issuance."
    mitigation: "Enable certificate_transparency_logging_preference = ENABLED."
    references: ["https://docs.aws.amazon.com/acm/latest/userguide/acm-concepts.html"]
    tags: ["acm", "tls", "transparency"]

  - id: TMAC-AWS-ACM-004
    name: "Imported certificate (not ACM-managed)"
    resource_type: "aws_acm_certificate"
    check: { attribute: "private_key", condition: "exists", values: [] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The certificate is imported with a private key in code, which does not rotate automatically and may leak."
    mitigation: "Prefer ACM-managed certificates with automatic renewal."
    references: ["https://docs.aws.amazon.com/acm/latest/userguide/import-certificate.html"]
    tags: ["acm", "tls", "secrets"]

  - id: TMAC-AWS-ACM-005
    name: "Certificate without declared SANs"
    resource_type: "aws_acm_certificate"
    check: { attribute: "subject_alternative_names", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Spoofing"
    description: "The certificate does not declare SANs; verify that it covers all served host names."
    mitigation: "Add subject_alternative_names for the required hosts."
    references: ["https://docs.aws.amazon.com/acm/latest/userguide/"]
    tags: ["acm", "tls"]

  - id: TMAC-AWS-ACM-006
    name: "Certificate without tags"
    resource_type: "aws_acm_certificate"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The certificate does not define governance tags."
    mitigation: "Add ownership and environment tags."
    references: ["https://docs.aws.amazon.com/acm/latest/userguide/"]
    tags: ["acm", "tagging"]

  - id: TMAC-AWS-ACM-007
    name: "Certificate with a weak key algorithm"
    resource_type: "aws_acm_certificate"
    check: { attribute: "key_algorithm", condition: "regex", values: ["RSA_1024|RSA_2048"] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "The certificate uses a potentially weak key algorithm; prefer EC or a larger RSA size."
    mitigation: "Use key_algorithm = EC_prime256v1 or RSA_3072+."
    references: ["https://docs.aws.amazon.com/acm/latest/userguide/acm-certificate.html"]
    tags: ["acm", "tls", "crypto"]

  - id: TMAC-AWS-ACM-008
    name: "Certificate without safe recreation"
    resource_type: "aws_acm_certificate"
    check: { attribute: "validation_method", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Denial of Service"
    description: "The certificate does not declare a validation method, which can break automatic renewal."
    mitigation: "Define validation_method = DNS and the validation records."
    references: ["https://docs.aws.amazon.com/acm/latest/userguide/dns-validation.html"]
    tags: ["acm", "tls"]

  # ------------------------------------------------------------------
  # aws_vpc_endpoint
  # ------------------------------------------------------------------
  - id: TMAC-AWS-VPCE-001
    name: "VPC Endpoint without private DNS"
    resource_type: "aws_vpc_endpoint"
    check: { attribute: "private_dns_enabled", condition: "equals", values: [false] }
    severity: "Low"
    stride: "Spoofing"
    description: "The interface endpoint does not enable private DNS; calls could resolve to the public endpoint."
    mitigation: "Set private_dns_enabled = true on interface endpoints."
    references: ["https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-dns.html"]
    tags: ["vpc-endpoint", "privatelink", "dns"]

  - id: TMAC-AWS-VPCE-002
    name: "VPC Endpoint without a restrictive policy"
    resource_type: "aws_vpc_endpoint"
    check: { attribute: "policy", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Elevation of Privilege"
    description: "The endpoint does not define a policy; it uses the permissive default policy that allows any action/resource."
    mitigation: "Attach a least-privilege policy to the endpoint."
    references: ["https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-access.html"]
    tags: ["vpc-endpoint", "privatelink", "iam"]

  - id: TMAC-AWS-VPCE-003
    name: "VPC Endpoint with a wildcard policy"
    resource_type: "aws_vpc_endpoint"
    check: { attribute: "policy", condition: "regex", values: ["\"Principal\"\\s*:\\s*\"\\*\""] }
    severity: "Medium"
    stride: "Elevation of Privilege"
    description: "The endpoint policy uses Principal '*', allowing any identity to use the endpoint."
    mitigation: "Restrict the Principal to specific accounts/roles."
    references: ["https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-access.html"]
    tags: ["vpc-endpoint", "iam", "wildcard"]

  - id: TMAC-AWS-VPCE-004
    name: "VPC Endpoint without security groups"
    resource_type: "aws_vpc_endpoint"
    check: { attribute: "security_group_ids", condition: "not_exists", values: [], and_check: { attribute: "vpc_endpoint_type", condition: "equals", values: ["Interface"] } }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "Interface endpoint without explicit security groups; it uses the VPC's default SG."
    mitigation: "Associate a restrictive security group with the interface endpoint."
    references: ["https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-access.html"]
    tags: ["vpc-endpoint", "network"]

  - id: TMAC-AWS-VPCE-005
    name: "Gateway VPC Endpoint without route tables"
    resource_type: "aws_vpc_endpoint"
    check: { attribute: "route_table_ids", condition: "not_exists", values: [], and_check: { attribute: "vpc_endpoint_type", condition: "equals", values: ["Gateway"] } }
    severity: "Low"
    stride: "Denial of Service"
    description: "Gateway endpoint with no associated route tables; traffic is not routed through the private endpoint."
    mitigation: "Associate route_table_ids with the Gateway endpoint (S3/DynamoDB)."
    references: ["https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html"]
    tags: ["vpc-endpoint", "network"]

  - id: TMAC-AWS-VPCE-006
    name: "VPC Endpoint without tags"
    resource_type: "aws_vpc_endpoint"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The endpoint does not define governance tags."
    mitigation: "Add ownership and environment tags."
    references: ["https://docs.aws.amazon.com/vpc/latest/privatelink/"]
    tags: ["vpc-endpoint", "tagging"]

  - id: TMAC-AWS-VPCE-007
    name: "VPC Endpoint without a declared auto-accept"
    resource_type: "aws_vpc_endpoint"
    check: { attribute: "auto_accept", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Tampering"
    description: "The endpoint does not declare auto_accept; for third-party services it is best to control connection acceptance."
    mitigation: "Declare auto_accept explicitly according to the trust model."
    references: ["https://docs.aws.amazon.com/vpc/latest/privatelink/"]
    tags: ["vpc-endpoint"]

  - id: TMAC-AWS-VPCE-008
    name: "VPC Endpoint in a single subnet"
    resource_type: "aws_vpc_endpoint"
    check: { attribute: "subnet_ids", condition: "not_exists", values: [], and_check: { attribute: "vpc_endpoint_type", condition: "equals", values: ["Interface"] } }
    severity: "Low"
    stride: "Denial of Service"
    description: "Interface endpoint with no declared subnets or in a single AZ; it reduces resilience."
    mitigation: "Deploy the endpoint in subnets across multiple AZs."
    references: ["https://docs.aws.amazon.com/vpc/latest/privatelink/create-interface-endpoint.html"]
    tags: ["vpc-endpoint", "availability"]

  # ------------------------------------------------------------------
  # aws_flow_log
  # ------------------------------------------------------------------
  - id: TMAC-AWS-FL-001
    name: "Flow Log that does not capture all traffic"
    resource_type: "aws_flow_log"
    check: { attribute: "traffic_type", condition: "not_equals", values: ["ALL"] }
    severity: "Low"
    stride: "Repudiation"
    description: "The flow log does not capture ALL traffic, leaving ACCEPT or REJECT blind spots in investigations."
    mitigation: "Use traffic_type = ALL for complete visibility."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html"]
    tags: ["flow-log", "logging"]

  - id: TMAC-AWS-FL-002
    name: "Flow Log without a destination"
    resource_type: "aws_flow_log"
    check: { attribute: "log_destination", condition: "not_exists", values: [], and_check: { attribute: "log_group_name", condition: "not_exists", values: [] } }
    severity: "Medium"
    stride: "Repudiation"
    description: "The flow log does not declare a log destination (S3 or CloudWatch)."
    mitigation: "Define log_destination (S3/log group ARN) and its type."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html"]
    tags: ["flow-log", "logging"]

  - id: TMAC-AWS-FL-003
    name: "Flow Log without an IAM role"
    resource_type: "aws_flow_log"
    check: { attribute: "iam_role_arn", condition: "not_exists", values: [], and_check: { attribute: "log_destination_type", condition: "not_equals", values: ["s3"] } }
    severity: "Low"
    stride: "Repudiation"
    description: "The flow log to CloudWatch does not specify iam_role_arn to publish the records."
    mitigation: "Assign iam_role_arn with permissions to write to CloudWatch Logs."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-cwl.html"]
    tags: ["flow-log", "iam"]

  - id: TMAC-AWS-FL-004
    name: "Flow Log with a long aggregation interval"
    resource_type: "aws_flow_log"
    check: { attribute: "max_aggregation_interval", condition: "equals", values: [600] }
    severity: "Info"
    stride: "Repudiation"
    description: "The 600s aggregation interval delays detection; 60s gives greater granularity."
    mitigation: "Use max_aggregation_interval = 60 in sensitive environments."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html"]
    tags: ["flow-log", "logging"]

  - id: TMAC-AWS-FL-005
    name: "Flow Log without a custom format"
    resource_type: "aws_flow_log"
    check: { attribute: "log_format", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The flow log uses the default format; additional fields (pkt-srcaddr, flow-direction) improve analysis."
    mitigation: "Define log_format with the fields relevant to your detection."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html#flow-log-records"]
    tags: ["flow-log", "logging"]

  - id: TMAC-AWS-FL-006
    name: "Flow Log to S3 without declared encryption"
    resource_type: "aws_flow_log"
    check: { attribute: "log_destination_type", condition: "equals", values: ["s3"] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "The flow log delivers to S3; verify that the destination bucket is encrypted with KMS."
    mitigation: "Ensure SSE-KMS on the flow logs destination bucket."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-s3.html"]
    tags: ["flow-log", "s3", "encryption"]

  - id: TMAC-AWS-FL-007
    name: "Flow Log without tags"
    resource_type: "aws_flow_log"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The flow log does not define governance tags."
    mitigation: "Add ownership and environment tags."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html"]
    tags: ["flow-log", "tagging"]

  - id: TMAC-AWS-FL-008
    name: "Flow Log of an ENI/subnet instead of the full VPC"
    resource_type: "aws_flow_log"
    check: { attribute: "eni_id", condition: "exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The flow log is associated with a specific ENI; it may leave the rest of the VPC uncovered."
    mitigation: "Prefer VPC-level flow logs for comprehensive coverage."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html"]
    tags: ["flow-log", "coverage"]

  # ------------------------------------------------------------------
  # aws_launch_template
  # ------------------------------------------------------------------
  - id: TMAC-AWS-LT-001
    name: "Launch Template without mandatory IMDSv2"
    resource_type: "aws_launch_template"
    check: { attribute: "metadata_options.http_tokens", condition: "not_equals", values: ["required"] }
    severity: "High"
    stride: "Elevation of Privilege"
    description: "The launch template does not enforce IMDSv2 (http_tokens=required), exposing role credentials via SSRF."
    mitigation: "Configure metadata_options { http_tokens = \"required\" }."
    references: ["https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html"]
    tags: ["ec2", "launch-template", "imds"]

  - id: TMAC-AWS-LT-002
    name: "Launch Template with an unencrypted EBS volume"
    resource_type: "aws_launch_template"
    check: { attribute: "block_device_mappings.ebs.encrypted", condition: "equals", values: [false] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The launch template defines an EBS volume without encryption at rest."
    mitigation: "Set encrypted = true in block_device_mappings.ebs and define kms_key_id."
    references: ["https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/EBSEncryption.html"]
    tags: ["ec2", "launch-template", "ebs", "encryption"]

  - id: TMAC-AWS-LT-003
    name: "Launch Template with automatic public IP"
    resource_type: "aws_launch_template"
    check: { attribute: "network_interfaces.associate_public_ip_address", condition: "equals", values: [true] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The launch template associates a public IP with instances, exposing them to the internet."
    mitigation: "Set associate_public_ip_address = false for internal workloads."
    references: ["https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/launch-templates.html"]
    tags: ["ec2", "launch-template", "exposure"]

  - id: TMAC-AWS-LT-004
    name: "Launch Template without a limited IMDS endpoint"
    resource_type: "aws_launch_template"
    check: { attribute: "metadata_options.http_put_response_hop_limit", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Elevation of Privilege"
    description: "The IMDS hop limit is not bounded; a high value eases access from containers."
    mitigation: "Set http_put_response_hop_limit = 1."
    references: ["https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html"]
    tags: ["ec2", "launch-template", "imds"]

  - id: TMAC-AWS-LT-005
    name: "Launch Template without detailed monitoring"
    resource_type: "aws_launch_template"
    check: { attribute: "monitoring.enabled", condition: "equals", values: [false] }
    severity: "Info"
    stride: "Repudiation"
    description: "CloudWatch detailed monitoring is disabled, reducing metric granularity."
    mitigation: "Enable monitoring { enabled = true } on critical workloads."
    references: ["https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-cloudwatch.html"]
    tags: ["ec2", "launch-template", "monitoring"]

  - id: TMAC-AWS-LT-006
    name: "Launch Template with unencrypted user_data"
    resource_type: "aws_launch_template"
    check: { attribute: "user_data", condition: "exists", values: [] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "The launch template defines user_data; verify that it does not contain secrets in plaintext."
    mitigation: "Avoid secrets in user_data; use SSM Parameter Store or Secrets Manager."
    references: ["https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/user-data.html"]
    tags: ["ec2", "launch-template", "secrets"]

  - id: TMAC-AWS-LT-007
    name: "Launch Template without security groups"
    resource_type: "aws_launch_template"
    check: { attribute: "vpc_security_group_ids", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The launch template does not define explicit security groups; it uses the VPC's default SG."
    mitigation: "Associate restrictive vpc_security_group_ids."
    references: ["https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/launch-templates.html"]
    tags: ["ec2", "launch-template", "network"]

  - id: TMAC-AWS-LT-008
    name: "Launch Template without an instance profile"
    resource_type: "aws_launch_template"
    check: { attribute: "iam_instance_profile", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Elevation of Privilege"
    description: "The launch template does not associate an instance profile; review how instances obtain credentials."
    mitigation: "Assign a least-privilege iam_instance_profile."
    references: ["https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/iam-roles-for-amazon-ec2.html"]
    tags: ["ec2", "launch-template", "iam"]

  # ------------------------------------------------------------------
  # aws_autoscaling_group  (complements ASG-001)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-ASG-002
    name: "ASG in a single subnet/AZ"
    resource_type: "aws_autoscaling_group"
    check: { attribute: "vpc_zone_identifier", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "The ASG does not declare multiple subnets; without multi-AZ distribution there is no zone fault tolerance."
    mitigation: "Define vpc_zone_identifier with subnets across several AZs."
    references: ["https://docs.aws.amazon.com/autoscaling/ec2/userguide/auto-scaling-benefits.html"]
    tags: ["asg", "availability"]

  - id: TMAC-AWS-ASG-003
    name: "ASG without ELB health check"
    resource_type: "aws_autoscaling_group"
    check: { attribute: "health_check_type", condition: "not_equals", values: ["ELB"] }
    severity: "Low"
    stride: "Denial of Service"
    description: "The ASG uses EC2 health checks instead of ELB; instances with a crashed app but healthy VM would remain in service."
    mitigation: "Use health_check_type = ELB when there is a load balancer."
    references: ["https://docs.aws.amazon.com/autoscaling/ec2/userguide/healthcheck.html"]
    tags: ["asg", "availability"]

  - id: TMAC-AWS-ASG-004
    name: "ASG with zero minimum capacity"
    resource_type: "aws_autoscaling_group"
    check: { attribute: "min_size", condition: "equals", values: [0] }
    severity: "Low"
    stride: "Denial of Service"
    description: "The ASG allows min_size = 0; scaling to zero can leave the service with no instances."
    mitigation: "Define min_size >= 1 (or >= 2 multi-AZ) for always-on services."
    references: ["https://docs.aws.amazon.com/autoscaling/ec2/userguide/asg-capacity-limits.html"]
    tags: ["asg", "availability"]

  - id: TMAC-AWS-ASG-005
    name: "ASG without instance protection on scale-in"
    resource_type: "aws_autoscaling_group"
    check: { attribute: "protect_from_scale_in", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Denial of Service"
    description: "The ASG does not declare protect_from_scale_in; stateful workloads could be terminated abruptly."
    mitigation: "Evaluate protect_from_scale_in for stateful instances."
    references: ["https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-instance-protection.html"]
    tags: ["asg", "availability"]

  - id: TMAC-AWS-ASG-006
    name: "ASG without a safe termination policy"
    resource_type: "aws_autoscaling_group"
    check: { attribute: "termination_policies", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Denial of Service"
    description: "The ASG does not define termination_policies; the default behavior may not preserve resilience."
    mitigation: "Define termination_policies according to your strategy (OldestInstance, etc.)."
    references: ["https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-termination-policies.html"]
    tags: ["asg", "availability"]

  - id: TMAC-AWS-ASG-007
    name: "ASG without propagated tags"
    resource_type: "aws_autoscaling_group"
    check: { attribute: "tag", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The ASG does not propagate tags to instances, hindering attribution and auditing."
    mitigation: "Define tag blocks with propagate_at_launch = true."
    references: ["https://docs.aws.amazon.com/autoscaling/ec2/userguide/autoscaling-tagging.html"]
    tags: ["asg", "tagging"]

  - id: TMAC-AWS-ASG-008
    name: "ASG without instance warm-up"
    resource_type: "aws_autoscaling_group"
    check: { attribute: "default_cooldown", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Denial of Service"
    description: "The ASG does not define a cooldown; oscillating scaling can degrade the service."
    mitigation: "Define default_cooldown or policies with adequate warm-up."
    references: ["https://docs.aws.amazon.com/autoscaling/ec2/userguide/Cooldown.html"]
    tags: ["asg", "availability"]

  # ------------------------------------------------------------------
  # aws_security_group  (complements SG-001/002/003)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-SG-004
    name: "Security Group with fully open egress"
    resource_type: "aws_security_group"
    check: { attribute: "egress.cidr_blocks", condition: "contains", values: ["0.0.0.0/0"] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "The security group allows egress to 0.0.0.0/0, enabling data exfiltration."
    mitigation: "Restrict egress to the necessary destinations and ports."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html"]
    tags: ["security-group", "egress", "exfiltration"]

  - id: TMAC-AWS-SG-005
    name: "Security Group with an exposed database"
    resource_type: "aws_security_group"
    check: { attribute: "ingress.cidr_blocks", condition: "contains", values: ["0.0.0.0/0"], and_check: { attribute: "ingress.from_port", condition: "in", values: [3306, 5432, 1433, 27017, 6379] } }
    severity: "Critical"
    stride: "Information Disclosure"
    description: "The security group exposes a database port (3306/5432/1433/27017/6379) to the internet."
    mitigation: "Restrict ingress on DB ports to the application SGs."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html"]
    tags: ["security-group", "database", "exposure"]

  - id: TMAC-AWS-SG-006
    name: "Security Group with all ports open"
    resource_type: "aws_security_group"
    check: { attribute: "ingress.protocol", condition: "in", values: ["-1"], and_check: { attribute: "ingress.cidr_blocks", condition: "contains", values: ["0.0.0.0/0"] } }
    severity: "Critical"
    stride: "Tampering"
    description: "The security group allows all traffic (protocol -1) from the internet."
    mitigation: "Specify concrete protocols and ports; never -1 from 0.0.0.0/0."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html"]
    tags: ["security-group", "exposure"]

  - id: TMAC-AWS-SG-007
    name: "Security Group without rule descriptions"
    resource_type: "aws_security_group"
    check: { attribute: "ingress.description", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The ingress rules have no description, hindering audits and reviews."
    mitigation: "Add a description to each ingress/egress rule."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html"]
    tags: ["security-group", "governance"]

  - id: TMAC-AWS-SG-008
    name: "Security Group without tags"
    resource_type: "aws_security_group"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The security group does not define governance tags."
    mitigation: "Add ownership and environment tags."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html"]
    tags: ["security-group", "tagging"]

  # ------------------------------------------------------------------
  # aws_rds_cluster  (complements AURORA-001/002/003)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-AURORA-004
    name: "Aurora cluster publicly accessible via instances"
    resource_type: "aws_rds_cluster"
    check: { attribute: "db_subnet_group_name", condition: "not_exists", values: [] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The Aurora cluster does not define db_subnet_group_name; it could be deployed in public subnets."
    mitigation: "Assign a db_subnet_group with private subnets."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_VPC.html"]
    tags: ["aurora", "rds", "network"]

  - id: TMAC-AWS-AURORA-005
    name: "Aurora cluster without sufficient backup retention"
    resource_type: "aws_rds_cluster"
    check: { attribute: "backup_retention_period", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "The Aurora cluster does not define backup retention; the default value (1 day) is insufficient for recovery."
    mitigation: "Set backup_retention_period >= 7 days."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Managing.Backups.html"]
    tags: ["aurora", "rds", "backup"]

  - id: TMAC-AWS-AURORA-006
    name: "Aurora cluster without log export"
    resource_type: "aws_rds_cluster"
    check: { attribute: "enabled_cloudwatch_logs_exports", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Repudiation"
    description: "The Aurora cluster does not export logs (audit/error/slowquery) to CloudWatch."
    mitigation: "Define enabled_cloudwatch_logs_exports = [\"audit\",\"error\",\"slowquery\"]."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_LogAccess.html"]
    tags: ["aurora", "rds", "logging"]

  - id: TMAC-AWS-AURORA-007
    name: "Aurora cluster without deletion protection"
    resource_type: "aws_rds_cluster"
    check: { attribute: "deletion_protection", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "The Aurora cluster does not enable deletion_protection; an accidental deletion would cause data loss."
    mitigation: "Set deletion_protection = true in production."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_DeleteCluster.html"]
    tags: ["aurora", "rds", "availability"]

  - id: TMAC-AWS-AURORA-008
    name: "Aurora cluster with the final snapshot skipped"
    resource_type: "aws_rds_cluster"
    check: { attribute: "skip_final_snapshot", condition: "equals", values: [true] }
    severity: "Low"
    stride: "Denial of Service"
    description: "The Aurora cluster skips the final snapshot; on destruction there will be no copy for recovery."
    mitigation: "Set skip_final_snapshot = false and define final_snapshot_identifier in production."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_DeleteCluster.html"]
    tags: ["aurora", "rds", "backup"]

  - id: TMAC-AWS-AURORA-009
    name: "Aurora cluster without IAM authentication"
    resource_type: "aws_rds_cluster"
    check: { attribute: "iam_database_authentication_enabled", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Spoofing"
    description: "The Aurora cluster does not enable IAM authentication, relying only on static credentials."
    mitigation: "Enable iam_database_authentication_enabled = true."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/UsingWithRDS.IAMDBAuth.html"]
    tags: ["aurora", "rds", "iam"]

  # ------------------------------------------------------------------
  # aws_rds_cluster_instance
  # ------------------------------------------------------------------
  - id: TMAC-AWS-RDSCI-001
    name: "Cluster instance publicly accessible"
    resource_type: "aws_rds_cluster_instance"
    check: { attribute: "publicly_accessible", condition: "equals", values: [true] }
    severity: "Critical"
    stride: "Information Disclosure"
    description: "The cluster instance is publicly_accessible = true, exposing the database to the internet."
    mitigation: "Set publicly_accessible = false."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_VPC.html"]
    tags: ["aurora", "rds", "exposure"]

  - id: TMAC-AWS-RDSCI-002
    name: "Cluster instance without Performance Insights"
    resource_type: "aws_rds_cluster_instance"
    check: { attribute: "performance_insights_enabled", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The instance does not enable Performance Insights, limiting diagnosis of performance incidents."
    mitigation: "Enable performance_insights_enabled and encrypt with KMS."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_PerfInsights.html"]
    tags: ["aurora", "rds", "monitoring"]

  - id: TMAC-AWS-RDSCI-003
    name: "Cluster instance without encrypted Performance Insights"
    resource_type: "aws_rds_cluster_instance"
    check: { attribute: "performance_insights_kms_key_id", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "Performance Insights does not use a CMK; its data may not be encrypted with a managed key."
    mitigation: "Define performance_insights_kms_key_id with a KMS key."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_PerfInsights.html"]
    tags: ["aurora", "rds", "encryption"]

  - id: TMAC-AWS-RDSCI-004
    name: "Cluster instance without enhanced monitoring"
    resource_type: "aws_rds_cluster_instance"
    check: { attribute: "monitoring_interval", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The instance does not configure Enhanced Monitoring (monitoring_interval)."
    mitigation: "Define monitoring_interval (e.g. 60) and monitoring_role_arn."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_Monitoring.OS.html"]
    tags: ["aurora", "rds", "monitoring"]

  - id: TMAC-AWS-RDSCI-005
    name: "Cluster instance without auto minor upgrade"
    resource_type: "aws_rds_cluster_instance"
    check: { attribute: "auto_minor_version_upgrade", condition: "equals", values: [false] }
    severity: "Low"
    stride: "Tampering"
    description: "The instance does not apply automatic minor upgrades, remaining exposed to patched vulnerabilities."
    mitigation: "Set auto_minor_version_upgrade = true."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_UpgradeDBInstance.Maintenance.html"]
    tags: ["aurora", "rds", "patching"]

  - id: TMAC-AWS-RDSCI-006
    name: "Cluster instance without a maintenance window"
    resource_type: "aws_rds_cluster_instance"
    check: { attribute: "preferred_maintenance_window", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Denial of Service"
    description: "The instance does not define a maintenance window; patches may be applied during business hours."
    mitigation: "Define preferred_maintenance_window during low-traffic hours."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_UpgradeDBInstance.Maintenance.html"]
    tags: ["aurora", "rds", "maintenance"]

  - id: TMAC-AWS-RDSCI-007
    name: "Cluster instance without a declared certificate CA"
    resource_type: "aws_rds_cluster_instance"
    check: { attribute: "ca_cert_identifier", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Spoofing"
    description: "The instance does not pin the server certificate CA; renewals could break client TLS."
    mitigation: "Define ca_cert_identifier with a current CA (rds-ca-rsa2048-g1)."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/UsingWithRDS.SSL.html"]
    tags: ["aurora", "rds", "tls"]

  - id: TMAC-AWS-RDSCI-008
    name: "Cluster instance without tags"
    resource_type: "aws_rds_cluster_instance"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The cluster instance does not define governance tags."
    mitigation: "Add ownership and environment tags."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/"]
    tags: ["aurora", "rds", "tagging"]

  # ------------------------------------------------------------------
  # aws_db_proxy  (complements RDSPROXY-001)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-DBPROXY-002
    name: "RDS Proxy without IAM authentication"
    resource_type: "aws_db_proxy"
    check: { attribute: "auth.iam_auth", condition: "not_equals", values: ["REQUIRED"] }
    severity: "Medium"
    stride: "Spoofing"
    description: "The RDS Proxy does not require IAM authentication, relying only on the database secret."
    mitigation: "Configure auth { iam_auth = \"REQUIRED\" }."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy-setup.html"]
    tags: ["rds", "proxy", "iam"]

  - id: TMAC-AWS-DBPROXY-003
    name: "RDS Proxy without security groups"
    resource_type: "aws_db_proxy"
    check: { attribute: "vpc_security_group_ids", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The RDS Proxy does not declare security groups, potentially using the default SG."
    mitigation: "Associate restrictive vpc_security_group_ids."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy", "network"]

  - id: TMAC-AWS-DBPROXY-004
    name: "RDS Proxy with SQL logging disabled"
    resource_type: "aws_db_proxy"
    check: { attribute: "debug_logging", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The RDS Proxy does not declare debug_logging; weigh the balance between auditing and SQL exposure."
    mitigation: "Enable debug_logging temporarily for controlled diagnosis."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy", "logging"]

  - id: TMAC-AWS-DBPROXY-005
    name: "RDS Proxy with a high idle timeout"
    resource_type: "aws_db_proxy"
    check: { attribute: "idle_client_timeout", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Denial of Service"
    description: "The RDS Proxy does not define idle_client_timeout; idle connections may exhaust the pool."
    mitigation: "Define idle_client_timeout according to the load."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy", "availability"]

  - id: TMAC-AWS-DBPROXY-006
    name: "RDS Proxy without a declared secret"
    resource_type: "aws_db_proxy"
    check: { attribute: "auth.secret_arn", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The RDS Proxy does not reference a secret_arn; credentials could be managed insecurely."
    mitigation: "Configure auth { secret_arn = aws_secretsmanager_secret.x.arn }."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy-setup.html"]
    tags: ["rds", "proxy", "secrets"]

  - id: TMAC-AWS-DBPROXY-007
    name: "RDS Proxy without multi-AZ subnets"
    resource_type: "aws_db_proxy"
    check: { attribute: "vpc_subnet_ids", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Denial of Service"
    description: "The RDS Proxy does not declare subnets; without multi-AZ distribution it loses resilience."
    mitigation: "Define vpc_subnet_ids across multiple AZs."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy", "availability"]

  - id: TMAC-AWS-DBPROXY-008
    name: "RDS Proxy without tags"
    resource_type: "aws_db_proxy"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The RDS Proxy does not define governance tags."
    mitigation: "Add ownership and environment tags."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy", "tagging"]

  # ------------------------------------------------------------------
  # aws_db_subnet_group
  # ------------------------------------------------------------------
  - id: TMAC-AWS-DBSG-001
    name: "DB Subnet Group without declared subnets"
    resource_type: "aws_db_subnet_group"
    check: { attribute: "subnet_ids", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "The DB subnet group does not declare subnet_ids, preventing correct multi-AZ deployment."
    mitigation: "Define subnet_ids with private subnets across several AZs."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_VPC.WorkingWithRDSInstanceinaVPC.html"]
    tags: ["rds", "subnet-group", "availability"]

  - id: TMAC-AWS-DBSG-002
    name: "DB Subnet Group without tags"
    resource_type: "aws_db_subnet_group"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The DB subnet group does not define governance tags."
    mitigation: "Add ownership and environment tags."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/"]
    tags: ["rds", "subnet-group", "tagging"]

  - id: TMAC-AWS-DBSG-003
    name: "DB Subnet Group without a description"
    resource_type: "aws_db_subnet_group"
    check: { attribute: "description", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The DB subnet group does not document its purpose via description."
    mitigation: "Add a meaningful description."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/"]
    tags: ["rds", "subnet-group", "governance"]

  - id: TMAC-AWS-DBSG-004
    name: "DB Subnet Group with a generic name"
    resource_type: "aws_db_subnet_group"
    check: { attribute: "name", condition: "regex", values: ["^(default|test|tmp|temp)"] }
    severity: "Info"
    stride: "Repudiation"
    description: "The DB subnet group uses a generic name (default/test/tmp), a sign of non-production configuration."
    mitigation: "Use descriptive, environment-specific names."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/"]
    tags: ["rds", "subnet-group", "governance"]

  - id: TMAC-AWS-DBSG-005
    name: "DB Subnet Group potentially in public subnets"
    resource_type: "aws_db_subnet_group"
    check: { attribute: "name", condition: "regex", values: ["public"] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The DB subnet group name suggests public subnets; databases must not reside there."
    mitigation: "Use private subnets exclusively for DB subnet groups."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_VPC.Scenarios.html"]
    tags: ["rds", "subnet-group", "exposure"]

  - id: TMAC-AWS-DBSG-006
    name: "DB Subnet Group without declared AZ redundancy"
    resource_type: "aws_db_subnet_group"
    check: { attribute: "name", condition: "regex", values: ["single|az1|onesubnet"] }
    severity: "Low"
    stride: "Denial of Service"
    description: "The name suggests a single AZ; a DB subnet group must span multiple AZs."
    mitigation: "Include subnets from at least two AZs."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html"]
    tags: ["rds", "subnet-group", "availability"]

  - id: TMAC-AWS-DBSG-007
    name: "DB Subnet Group without a project convention"
    resource_type: "aws_db_subnet_group"
    check: { attribute: "tags.Project", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The DB subnet group does not associate a Project tag for traceability."
    mitigation: "Add tags.Project."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/"]
    tags: ["rds", "subnet-group", "tagging"]

  - id: TMAC-AWS-DBSG-008
    name: "DB Subnet Group without data classification"
    resource_type: "aws_db_subnet_group"
    check: { attribute: "tags.DataClassification", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "The DB subnet group does not declare data classification."
    mitigation: "Add tags.DataClassification."
    references: ["https://docs.aws.amazon.com/whitepapers/latest/data-classification/data-classification.html"]
    tags: ["rds", "subnet-group", "data-classification"]

  # ------------------------------------------------------------------
  # aws_iam_role  (complements IAM-004/006)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-IAMROLE-001
    name: "IAM role trusting a wildcard Principal"
    resource_type: "aws_iam_role"
    check: { attribute: "assume_role_policy", condition: "regex", values: ["\"Principal\"\\s*:\\s*\"\\*\""] }
    severity: "Critical"
    stride: "Elevation of Privilege"
    description: "The assume_role_policy trusts Principal '*', allowing any identity to assume the role."
    mitigation: "Restrict the Principal to specific accounts/services/roles."
    references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_principal.html"]
    tags: ["iam", "role", "trust", "wildcard"]

  - id: TMAC-AWS-IAMROLE-002
    name: "IAM role with cross-account trust without ExternalId"
    resource_type: "aws_iam_role"
    check: { attribute: "assume_role_policy", condition: "regex", values: ["\"AWS\"\\s*:\\s*\"arn:aws:iam::[0-9]+:root\""] }
    severity: "High"
    stride: "Elevation of Privilege"
    description: "The role trusts an account root without an ExternalId/MFA condition, enabling confused deputy."
    mitigation: "Add a sts:ExternalId or aws:MultiFactorAuthPresent condition."
    references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_for-user_externalid.html"]
    tags: ["iam", "role", "cross-account"]

  - id: TMAC-AWS-IAMROLE-003
    name: "IAM role without a permissions boundary"
    resource_type: "aws_iam_role"
    check: { attribute: "permissions_boundary", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Elevation of Privilege"
    description: "The role does not define permissions_boundary, with no upper bound on its effective privileges."
    mitigation: "Associate a permissions_boundary that bounds the maximum privilege."
    references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html"]
    tags: ["iam", "role", "boundary"]

  - id: TMAC-AWS-IAMROLE-004
    name: "IAM role with a prolonged maximum session"
    resource_type: "aws_iam_role"
    check: { attribute: "max_session_duration", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Elevation of Privilege"
    description: "The role does not bound max_session_duration; long sessions widen the temporary-credential abuse window."
    mitigation: "Define max_session_duration at the operational minimum (e.g. 3600)."
    references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use.html"]
    tags: ["iam", "role", "session"]

  - id: TMAC-AWS-IAMROLE-005
    name: "IAM role with broad AWS managed policies"
    resource_type: "aws_iam_role"
    check: { attribute: "managed_policy_arns", condition: "contains", values: ["arn:aws:iam::aws:policy/AdministratorAccess"] }
    severity: "Critical"
    stride: "Elevation of Privilege"
    description: "The role attaches AdministratorAccess, granting full privileges."
    mitigation: "Replace with specific least-privilege policies."
    references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html"]
    tags: ["iam", "role", "privilege"]

  - id: TMAC-AWS-IAMROLE-006
    name: "IAM role without tags"
    resource_type: "aws_iam_role"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The role does not define governance tags."
    mitigation: "Add ownership and environment tags."
    references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/id_tags.html"]
    tags: ["iam", "role", "tagging"]

  # ------------------------------------------------------------------
  # aws_iam_role_policy
  # ------------------------------------------------------------------
  - id: TMAC-AWS-IAMRP-001
    name: "Inline policy with wildcard Action and Resource"
    resource_type: "aws_iam_role_policy"
    check: { attribute: "policy", condition: "regex", values: ["\"Action\"\\s*:\\s*\"\\*\""] }
    severity: "Critical"
    stride: "Elevation of Privilege"
    description: "The inline policy allows Action '*', granting any action over the defined resources."
    mitigation: "Specify concrete actions with least privilege."
    references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html"]
    tags: ["iam", "policy", "wildcard"]

  - id: TMAC-AWS-IAMRP-002
    name: "Inline policy with wildcard Resource"
    resource_type: "aws_iam_role_policy"
    check: { attribute: "policy", condition: "regex", values: ["\"Resource\"\\s*:\\s*\"\\*\""] }
    severity: "High"
    stride: "Elevation of Privilege"
    description: "The inline policy applies to Resource '*', without scoping to specific resources."
    mitigation: "Limit Resource to concrete ARNs."
    references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_resource.html"]
    tags: ["iam", "policy", "wildcard"]

  - id: TMAC-AWS-IAMRP-003
    name: "Inline policy with IAM privileges"
    resource_type: "aws_iam_role_policy"
    check: { attribute: "policy", condition: "regex", values: ["iam:(PassRole|CreatePolicy|AttachRolePolicy|PutRolePolicy)"] }
    severity: "High"
    stride: "Elevation of Privilege"
    description: "The policy allows sensitive IAM actions (PassRole/Attach/Put), a common privilege-escalation path."
    mitigation: "Restrict IAM actions and condition iam:PassRole to specific services."
    references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_passrole.html"]
    tags: ["iam", "policy", "privilege-escalation"]

  - id: TMAC-AWS-IAMRP-004
    name: "Inline policy with full data access"
    resource_type: "aws_iam_role_policy"
    check: { attribute: "policy", condition: "regex", values: ["(s3|dynamodb|secretsmanager|kms):\\*"] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The policy grants wildcard access to data/secret services (s3:*, kms:*, etc.)."
    mitigation: "Scope down to the minimum actions required per service."
    references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html"]
    tags: ["iam", "policy", "data"]

  - id: TMAC-AWS-IAMRP-005
    name: "Inline policy without conditions"
    resource_type: "aws_iam_role_policy"
    check: { attribute: "policy", condition: "not_contains", values: ["Condition"] }
    severity: "Low"
    stride: "Elevation of Privilege"
    description: "The inline policy does not use Condition; adding conditions (SourceIp, MFA, etc.) reduces risk."
    mitigation: "Add Condition blocks where applicable."
    references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_condition.html"]
    tags: ["iam", "policy", "conditions"]

  - id: TMAC-AWS-IAMRP-006
    name: "Inline policy with NotAction"
    resource_type: "aws_iam_role_policy"
    check: { attribute: "policy", condition: "contains", values: ["NotAction"] }
    severity: "Medium"
    stride: "Elevation of Privilege"
    description: "The policy uses NotAction, a pattern that often grants more permissions than intended."
    mitigation: "Prefer Action with an explicit list instead of NotAction."
    references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_notaction.html"]
    tags: ["iam", "policy"]

  - id: TMAC-AWS-IAMRP-007
    name: "Inline policy with a partial star in actions"
    resource_type: "aws_iam_role_policy"
    check: { attribute: "policy", condition: "regex", values: ["\"[a-z0-9]+:[A-Za-z]*\\*\""] }
    severity: "Medium"
    stride: "Elevation of Privilege"
    description: "The policy uses partial wildcards in actions (e.g. s3:Get*), which may include unintended actions."
    mitigation: "Enumerate the specific actions required."
    references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_action.html"]
    tags: ["iam", "policy", "wildcard"]

  - id: TMAC-AWS-IAMRP-008
    name: "Inline policy allowing broad sts:AssumeRole"
    resource_type: "aws_iam_role_policy"
    check: { attribute: "policy", condition: "regex", values: ["sts:AssumeRole"] }
    severity: "Medium"
    stride: "Elevation of Privilege"
    description: "The policy allows sts:AssumeRole; without scoping the Resource, it enables pivoting between roles."
    mitigation: "Limit the Resource of sts:AssumeRole to concrete role ARNs."
    references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use.html"]
    tags: ["iam", "policy", "assume-role"]

  # ------------------------------------------------------------------
  # aws_kms_key  (complements KMS-001/002/003)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-KMSKEY-001
    name: "KMS Key without a declared policy"
    resource_type: "aws_kms_key"
    check: { attribute: "policy", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Elevation of Privilege"
    description: "The KMS key does not define a policy; it uses the default policy that delegates everything to account IAM."
    mitigation: "Define a key policy with least privilege and role separation."
    references: ["https://docs.aws.amazon.com/kms/latest/developerguide/key-policies.html"]
    tags: ["kms", "policy"]

  - id: TMAC-AWS-KMSKEY-002
    name: "KMS Key with a wildcard policy"
    resource_type: "aws_kms_key"
    check: { attribute: "policy", condition: "regex", values: ["\"Principal\"\\s*:\\s*\"\\*\""] }
    severity: "High"
    stride: "Elevation of Privilege"
    description: "The key policy allows Principal '*', exposing cryptographic operations to any identity."
    mitigation: "Restrict the Principal and condition by account/service."
    references: ["https://docs.aws.amazon.com/kms/latest/developerguide/key-policies.html"]
    tags: ["kms", "policy", "wildcard"]

  - id: TMAC-AWS-KMSKEY-003
    name: "KMS Key with a short deletion window"
    resource_type: "aws_kms_key"
    check: { attribute: "deletion_window_in_days", condition: "in", values: [7, 8, 9, 10] }
    severity: "Low"
    stride: "Denial of Service"
    description: "The key's deletion window is short; it reduces the margin to stop an erroneous deletion."
    mitigation: "Use deletion_window_in_days = 30."
    references: ["https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html"]
    tags: ["kms", "lifecycle"]

  - id: TMAC-AWS-KMSKEY-004
    name: "Multi-region KMS Key"
    resource_type: "aws_kms_key"
    check: { attribute: "multi_region", condition: "equals", values: [true] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "The key is multi-region; verify that the replication of cryptographic material is intentional."
    mitigation: "Confirm the requirement for multi-region keys and their governance."
    references: ["https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html"]
    tags: ["kms", "multi-region"]

  - id: TMAC-AWS-KMSKEY-005
    name: "KMS Key without tags"
    resource_type: "aws_kms_key"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The KMS key does not define governance tags."
    mitigation: "Add ownership and environment tags."
    references: ["https://docs.aws.amazon.com/kms/latest/developerguide/tagging-keys.html"]
    tags: ["kms", "tagging"]

  # ------------------------------------------------------------------
  # aws_secretsmanager_secret  (complements SM-001/002)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-SMSEC-001
    name: "Secret without automatic rotation"
    resource_type: "aws_secretsmanager_secret"
    check: { attribute: "rotation_rules", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The secret does not define automatic rotation; long-lived credentials widen the impact of a leak."
    mitigation: "Configure rotation_rules with a rotation Lambda."
    references: ["https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html"]
    tags: ["secrets", "rotation"]

  - id: TMAC-AWS-SMSEC-002
    name: "Secret without recovery (recovery window 0)"
    resource_type: "aws_secretsmanager_secret"
    check: { attribute: "recovery_window_in_days", condition: "equals", values: [0] }
    severity: "Low"
    stride: "Denial of Service"
    description: "The secret is deleted without a recovery window, preventing its restoration after an erroneous deletion."
    mitigation: "Use recovery_window_in_days >= 7."
    references: ["https://docs.aws.amazon.com/secretsmanager/latest/userguide/manage_delete-restore-secret.html"]
    tags: ["secrets", "lifecycle"]

  - id: TMAC-AWS-SMSEC-003
    name: "Secret with a wildcard resource policy"
    resource_type: "aws_secretsmanager_secret"
    check: { attribute: "policy", condition: "regex", values: ["\"Principal\"\\s*:\\s*\"\\*\""] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The secret policy allows Principal '*', exposing its value to any identity."
    mitigation: "Restrict the Principal to concrete roles."
    references: ["https://docs.aws.amazon.com/secretsmanager/latest/userguide/auth-and-access_resource-based-policies.html"]
    tags: ["secrets", "policy", "wildcard"]

  - id: TMAC-AWS-SMSEC-004
    name: "Secret without tags"
    resource_type: "aws_secretsmanager_secret"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The secret does not define governance tags."
    mitigation: "Add ownership and environment tags."
    references: ["https://docs.aws.amazon.com/secretsmanager/latest/userguide/"]
    tags: ["secrets", "tagging"]

  - id: TMAC-AWS-SMSEC-005
    name: "Secret with a name that reveals its content"
    resource_type: "aws_secretsmanager_secret"
    check: { attribute: "name", condition: "regex", values: ["(?i)(password|passwd|api[-_]?key|token|private[-_]?key)"] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "The secret name reveals the type of credential, enabling targeted attacks."
    mitigation: "Use neutral names that do not reveal the content."
    references: ["https://docs.aws.amazon.com/secretsmanager/latest/userguide/"]
    tags: ["secrets", "naming"]

  - id: TMAC-AWS-SMSEC-006
    name: "Secret without an adequate rotation frequency"
    resource_type: "aws_secretsmanager_secret"
    check: { attribute: "rotation_lambda_arn", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "The secret does not associate a rotation Lambda, a requirement for automatic rotation."
    mitigation: "Associate rotation_lambda_arn and define the rotation schedule."
    references: ["https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html"]
    tags: ["secrets", "rotation"]

  # ------------------------------------------------------------------
  # aws_secretsmanager_secret_version
  # ------------------------------------------------------------------
  - id: TMAC-AWS-SMVER-001
    name: "Secret version with a password in plaintext"
    resource_type: "aws_secretsmanager_secret_version"
    check: { attribute: "secret_string", condition: "regex", values: ["(?i)(password|passwd)\\s*[\":=]"] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The secret version embeds a literal password in the Terraform code."
    mitigation: "Generate the value outside Terraform or use random_password without exposing it in the state."
    references: ["https://docs.aws.amazon.com/secretsmanager/latest/userguide/"]
    tags: ["secrets", "credentials"]

  - id: TMAC-AWS-SMVER-002
    name: "Secret version with an embedded private key"
    resource_type: "aws_secretsmanager_secret_version"
    check: { attribute: "secret_string", condition: "regex", values: ["BEGIN (RSA |EC )?PRIVATE KEY"] }
    severity: "Critical"
    stride: "Information Disclosure"
    description: "The secret version contains a PEM private key in plaintext in the code."
    mitigation: "Do not embed private keys in Terraform; import them out of band."
    references: ["https://docs.aws.amazon.com/secretsmanager/latest/userguide/"]
    tags: ["secrets", "private-key"]

  - id: TMAC-AWS-SMVER-003
    name: "Secret version with an embedded token/API key"
    resource_type: "aws_secretsmanager_secret_version"
    check: { attribute: "secret_string", condition: "regex", values: ["(?i)(api[-_]?key|access[-_]?token|secret[-_]?key)"] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The secret version embeds a literal token/API key."
    mitigation: "Avoid literals; reference generated values or sensitive variables."
    references: ["https://docs.aws.amazon.com/secretsmanager/latest/userguide/"]
    tags: ["secrets", "tokens"]

  - id: TMAC-AWS-SMVER-004
    name: "Secret version with an unstructured binary"
    resource_type: "aws_secretsmanager_secret_version"
    check: { attribute: "secret_binary", condition: "exists", values: [] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "The version uses embedded secret_binary; verify that the content does not end up in the state in clear."
    mitigation: "Manage sensitive binaries outside the Terraform state."
    references: ["https://docs.aws.amazon.com/secretsmanager/latest/userguide/"]
    tags: ["secrets", "binary"]

  - id: TMAC-AWS-SMVER-005
    name: "Secret version without a version stage"
    resource_type: "aws_secretsmanager_secret_version"
    check: { attribute: "version_stages", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The version does not declare version_stages; it hinders control of active/previous versions."
    mitigation: "Manage version_stages explicitly (AWSCURRENT/AWSPREVIOUS)."
    references: ["https://docs.aws.amazon.com/secretsmanager/latest/userguide/getting-started.html"]
    tags: ["secrets", "versioning"]

  - id: TMAC-AWS-SMVER-006
    name: "Secret version with a full connection string"
    resource_type: "aws_secretsmanager_secret_version"
    check: { attribute: "secret_string", condition: "regex", values: ["://[^:]+:[^@]+@"] }
    severity: "High"
    stride: "Information Disclosure"
    description: "The version contains a connection string with embedded credentials (user:pass@host)."
    mitigation: "Separate credentials from the connection string and avoid literals."
    references: ["https://docs.aws.amazon.com/secretsmanager/latest/userguide/"]
    tags: ["secrets", "connection-string"]

  - id: TMAC-AWS-SMVER-007
    name: "Secret version with an embedded AWS access key"
    resource_type: "aws_secretsmanager_secret_version"
    check: { attribute: "secret_string", condition: "regex", values: ["AKIA[0-9A-Z]{16}"] }
    severity: "Critical"
    stride: "Information Disclosure"
    description: "The secret version contains a literal AWS Access Key ID (AKIA...)."
    mitigation: "Revoke the key and use IAM roles instead of static keys."
    references: ["https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html"]
    tags: ["secrets", "aws-keys"]

  - id: TMAC-AWS-SMVER-008
    name: "Secret version without structured JSON"
    resource_type: "aws_secretsmanager_secret_version"
    check: { attribute: "secret_string", condition: "not_contains", values: ["{"] }
    severity: "Info"
    stride: "Repudiation"
    description: "The version stores the secret as a plain string; the JSON format eases rotation and secure consumption."
    mitigation: "Structure the secret as JSON (username/password/host fields)."
    references: ["https://docs.aws.amazon.com/secretsmanager/latest/userguide/"]
    tags: ["secrets", "format"]

  # ------------------------------------------------------------------
  # aws_cognito_user_pool  (complements COGNITO-001/002/003)
  # ------------------------------------------------------------------
  - id: TMAC-AWS-COGNITO-004
    name: "Cognito User Pool without MFA"
    resource_type: "aws_cognito_user_pool"
    check: { attribute: "mfa_configuration", condition: "equals", values: ["OFF"] }
    severity: "High"
    stride: "Spoofing"
    description: "The user pool has MFA disabled, allowing access with a password only."
    mitigation: "Configure mfa_configuration = ON (or OPTIONAL with enforcement)."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-mfa.html"]
    tags: ["cognito", "mfa", "auth"]

  - id: TMAC-AWS-COGNITO-005
    name: "Cognito without advanced security protection"
    resource_type: "aws_cognito_user_pool"
    check: { attribute: "user_pool_add_ons", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Spoofing"
    description: "The user pool does not enable Advanced Security (risk/credential-compromise detection)."
    mitigation: "Configure user_pool_add_ons { advanced_security_mode = ENFORCED }."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pool-settings-advanced-security.html"]
    tags: ["cognito", "auth"]

  - id: TMAC-AWS-COGNITO-006
    name: "Cognito without secure account recovery"
    resource_type: "aws_cognito_user_pool"
    check: { attribute: "account_recovery_setting", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Spoofing"
    description: "The user pool does not define account recovery mechanisms, potentially falling back to insecure methods."
    mitigation: "Configure account_recovery_setting prioritizing verified email/SMS."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/how-to-recover-a-user-account.html"]
    tags: ["cognito", "auth", "recovery"]

  - id: TMAC-AWS-COGNITO-007
    name: "Cognito with open self-registration"
    resource_type: "aws_cognito_user_pool"
    check: { attribute: "admin_create_user_config.allow_admin_create_user_only", condition: "equals", values: [false] }
    severity: "Medium"
    stride: "Spoofing"
    description: "The user pool allows user self-registration; without controls it can enable unauthorized accounts."
    mitigation: "If public registration is not required, use allow_admin_create_user_only = true."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/signing-up-users-in-your-app.html"]
    tags: ["cognito", "auth"]

  - id: TMAC-AWS-COGNITO-008
    name: "Cognito without tags"
    resource_type: "aws_cognito_user_pool"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The user pool does not define governance tags."
    mitigation: "Add ownership and environment tags."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/"]
    tags: ["cognito", "tagging"]

  # ------------------------------------------------------------------
  # aws_cognito_user_pool_client
  # ------------------------------------------------------------------
  - id: TMAC-AWS-COGCLIENT-001
    name: "Cognito client with the implicit flow enabled"
    resource_type: "aws_cognito_user_pool_client"
    check: { attribute: "allowed_oauth_flows", condition: "contains", values: ["implicit"] }
    severity: "Medium"
    stride: "Spoofing"
    description: "The client enables the implicit OAuth flow, which exposes tokens in the URL and is discouraged."
    mitigation: "Use the 'code' flow with PKCE instead of 'implicit'."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-app-idp-settings.html"]
    tags: ["cognito", "oauth", "client"]

  - id: TMAC-AWS-COGCLIENT-002
    name: "Cognito client with no generated secret"
    resource_type: "aws_cognito_user_pool_client"
    check: { attribute: "generate_secret", condition: "equals", values: [false] }
    severity: "Low"
    stride: "Spoofing"
    description: "The confidential client does not generate a secret; server-side clients should use a client secret."
    mitigation: "For confidential clients, use generate_secret = true."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-client-apps.html"]
    tags: ["cognito", "oauth", "client"]

  - id: TMAC-AWS-COGCLIENT-003
    name: "Cognito client with non-HTTPS callbacks"
    resource_type: "aws_cognito_user_pool_client"
    check: { attribute: "callback_urls", condition: "regex", values: ["http://(?!localhost)"] }
    severity: "Medium"
    stride: "Spoofing"
    description: "The client defines insecure HTTP callback URLs, exposing the code/token in transit."
    mitigation: "Use HTTPS callback_urls exclusively."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-app-integration.html"]
    tags: ["cognito", "oauth", "client"]

  - id: TMAC-AWS-COGCLIENT-004
    name: "Cognito client with high token validity"
    resource_type: "aws_cognito_user_pool_client"
    check: { attribute: "access_token_validity", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Elevation of Privilege"
    description: "The client does not bound access token validity; long-lived tokens widen the abuse window."
    mitigation: "Define bounded access_token_validity and refresh_token_validity."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/amazon-cognito-user-pools-using-the-access-token.html"]
    tags: ["cognito", "oauth", "tokens"]

  - id: TMAC-AWS-COGCLIENT-005
    name: "Cognito client with ADMIN_NO_SRP flows"
    resource_type: "aws_cognito_user_pool_client"
    check: { attribute: "explicit_auth_flows", condition: "contains", values: ["ALLOW_ADMIN_USER_PASSWORD_AUTH"] }
    severity: "Medium"
    stride: "Spoofing"
    description: "The client enables admin password auth, which transmits credentials without SRP."
    mitigation: "Prefer ALLOW_USER_SRP_AUTH and avoid admin password flows."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/amazon-cognito-user-pools-authentication-flow.html"]
    tags: ["cognito", "auth", "client"]

  - id: TMAC-AWS-COGCLIENT-006
    name: "Cognito client without enumeration prevention"
    resource_type: "aws_cognito_user_pool_client"
    check: { attribute: "prevent_user_existence_errors", condition: "not_equals", values: ["ENABLED"] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "The client does not prevent user existence errors, enabling account enumeration."
    mitigation: "Configure prevent_user_existence_errors = ENABLED."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-managing-errors.html"]
    tags: ["cognito", "auth", "enumeration"]

  - id: TMAC-AWS-COGCLIENT-007
    name: "Cognito client with broad scopes"
    resource_type: "aws_cognito_user_pool_client"
    check: { attribute: "allowed_oauth_scopes", condition: "contains", values: ["aws.cognito.signin.user.admin"] }
    severity: "Medium"
    stride: "Elevation of Privilege"
    description: "The client requests the user admin scope, which allows sensitive operations on the account."
    mitigation: "Limit allowed_oauth_scopes to openid/email/profile as needed."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-define-resource-servers.html"]
    tags: ["cognito", "oauth", "scopes"]

  - id: TMAC-AWS-COGCLIENT-008
    name: "Cognito client with uncontrolled providers"
    resource_type: "aws_cognito_user_pool_client"
    check: { attribute: "supported_identity_providers", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Spoofing"
    description: "The client does not restrict the supported identity providers."
    mitigation: "Declare supported_identity_providers explicitly."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-identity-federation.html"]
    tags: ["cognito", "federation", "client"]

  # ------------------------------------------------------------------
  # aws_cognito_user_pool_domain
  # ------------------------------------------------------------------
  - id: TMAC-AWS-COGDOM-001
    name: "Cognito domain without its own certificate"
    resource_type: "aws_cognito_user_pool_domain"
    check: { attribute: "certificate_arn", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Spoofing"
    description: "The Cognito domain uses the AWS-managed domain without its own certificate/custom domain."
    mitigation: "For branding and control, use a custom domain with an ACM certificate_arn."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-add-custom-domain.html"]
    tags: ["cognito", "domain", "tls"]

  - id: TMAC-AWS-COGDOM-002
    name: "Cognito domain with a generic prefix"
    resource_type: "aws_cognito_user_pool_domain"
    check: { attribute: "domain", condition: "regex", values: ["(?i)(test|dev|tmp|temp|demo)"] }
    severity: "Info"
    stride: "Repudiation"
    description: "The domain prefix suggests a non-production environment (test/dev/tmp)."
    mitigation: "Use domain prefixes consistent with the production environment."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-assign-domain.html"]
    tags: ["cognito", "domain", "governance"]

  - id: TMAC-AWS-COGDOM-003
    name: "Cognito domain without a user pool association"
    resource_type: "aws_cognito_user_pool_domain"
    check: { attribute: "user_pool_id", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Spoofing"
    description: "The domain does not reference a user_pool_id, an invalid or incomplete configuration."
    mitigation: "Associate the domain with a valid user_pool_id."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/"]
    tags: ["cognito", "domain"]

  - id: TMAC-AWS-COGDOM-004
    name: "Custom Cognito domain without managed validation"
    resource_type: "aws_cognito_user_pool_domain"
    check: { attribute: "certificate_arn", condition: "exists", values: [] }
    severity: "Info"
    stride: "Spoofing"
    description: "The domain uses a custom certificate; verify its renewal and DNS validation."
    mitigation: "Ensure automatic renewal of the custom domain's ACM certificate."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-add-custom-domain.html"]
    tags: ["cognito", "domain", "tls"]

  - id: TMAC-AWS-COGDOM-005
    name: "Cognito domain with a too-short name"
    resource_type: "aws_cognito_user_pool_domain"
    check: { attribute: "domain", condition: "regex", values: ["^.{1,3}$"] }
    severity: "Info"
    stride: "Spoofing"
    description: "The domain prefix is too short, prone to collisions or spoofing."
    mitigation: "Use a descriptive and unique prefix."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-assign-domain.html"]
    tags: ["cognito", "domain"]

  - id: TMAC-AWS-COGDOM-006
    name: "Cognito domain without organization branding"
    resource_type: "aws_cognito_user_pool_domain"
    check: { attribute: "domain", condition: "not_contains", values: ["-"] }
    severity: "Info"
    stride: "Repudiation"
    description: "The domain prefix does not follow a convention with a separator, hindering standardization."
    mitigation: "Adopt a naming convention (project-environment-auth)."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/"]
    tags: ["cognito", "domain", "naming"]

  - id: TMAC-AWS-COGDOM-007
    name: "Managed Cognito domain in production"
    resource_type: "aws_cognito_user_pool_domain"
    check: { attribute: "domain", condition: "regex", values: ["(?i)prod"] }
    severity: "Info"
    stride: "Spoofing"
    description: "A production domain should use a custom domain with its own certificate for user trust."
    mitigation: "In production, configure a custom domain with ACM."
    references: ["https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-add-custom-domain.html"]
