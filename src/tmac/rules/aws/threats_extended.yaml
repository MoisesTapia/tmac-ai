    tags: ["nat", "network"]
  - id: TMAC-AWS-NAT-002
    name: "NAT Gateway without a declared EIP"
    resource_type: "aws_nat_gateway"
    check: { attribute: "allocation_id", condition: "not_exists", values: [], and_check: { attribute: "connectivity_type", condition: "not_equals", values: ["private"] } }
    severity: "Low"
    stride: "Denial of Service"
    description: "Public NAT Gateway without a fixed EIP allocation_id; the egress IP could change."
    mitigation: "Associate a stable EIP via allocation_id."
    references: ["https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html"]
    tags: ["nat", "network"]
  - id: TMAC-AWS-NAT-003
