    check: { attribute: "detector_version_status", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Tampering"
    description: "Without a published detector version, the DRAFT version is in use; uncontrolled rule changes can immediately affect fraud decisions."
    mitigation: "Publish a versioned detector before using it in production."
    references: ["https://docs.aws.amazon.com/frauddetector/latest/ug/update-detector-version.html"]
    tags: ["fraud-detector", "ml", "release-control"]

