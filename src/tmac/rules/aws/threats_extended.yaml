  # ------------------------------------------------------------------
  # aws_cloudwatch_metric_alarm
  # ------------------------------------------------------------------
  - id: TMAC-AWS-CWALARM-001
    name: "Alarm with no actions"
    resource_type: "aws_cloudwatch_metric_alarm"
    check: { attribute: "alarm_actions", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Repudiation"
    description: "The alarm does not define alarm_actions; a trigger neither notifies nor remediates."
    mitigation: "Configure alarm_actions toward SNS/Auto Scaling/Ops."
    references: ["https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/AlarmThatSendsEmail.html"]
    tags: ["cloudwatch", "alarm", "alerting"]
  - id: TMAC-AWS-CWALARM-002
    name: "Alarm with no action on OK state"
    resource_type: "aws_cloudwatch_metric_alarm"
    check: { attribute: "ok_actions", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The alarm does not notify the return to OK state, reducing incident traceability."
    mitigation: "Configure ok_actions."
    references: ["https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/"]
    tags: ["cloudwatch", "alarm"]
  - id: TMAC-AWS-CWALARM-003
    name: "Alarm without missing-data handling"
    resource_type: "aws_cloudwatch_metric_alarm"
    check: { attribute: "treat_missing_data", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The alarm does not define treat_missing_data; missing data can hide incidents."
    mitigation: "Define treat_missing_data according to the metric (breaching/notBreaching)."
    references: ["https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/AlarmThatSendsEmail.html"]
    tags: ["cloudwatch", "alarm"]
  - id: TMAC-AWS-CWALARM-004
    name: "Alarm missing a notification action on insufficient data"
    resource_type: "aws_cloudwatch_metric_alarm"
    check: { attribute: "insufficient_data_actions", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The alarm does not act on insufficient data."
    mitigation: "Configure insufficient_data_actions when applicable."
    references: ["https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/"]
    tags: ["cloudwatch", "alarm"]
  - id: TMAC-AWS-CWALARM-005
    name: "Alarm with a long evaluation period"
    resource_type: "aws_cloudwatch_metric_alarm"
    check: { attribute: "period", condition: "in", values: [3600, 21600, 86400] }
    severity: "Info"
    stride: "Denial of Service"
    description: "The alarm uses a long period; incident detection is delayed."
    mitigation: "Use periods appropriate to the criticality (e.g. 60-300s)."
    references: ["https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/"]
    tags: ["cloudwatch", "alarm"]
  - id: TMAC-AWS-CWALARM-006
    name: "Alarm without tags"
    resource_type: "aws_cloudwatch_metric_alarm"
    check: { attribute: "tags", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The alarm does not define governance tags."
    mitigation: "Add ownership and environment tags."
    references: ["https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/"]
    tags: ["cloudwatch", "alarm", "tagging"]
  - id: TMAC-AWS-CWALARM-007
    name: "Alarm with a single evaluation period"
    resource_type: "aws_cloudwatch_metric_alarm"
    check: { attribute: "evaluation_periods", condition: "equals", values: [1] }
    severity: "Info"
    stride: "Denial of Service"
    description: "The alarm evaluates a single period, prone to false positives from transient spikes."
    mitigation: "Use evaluation_periods >= 2 with datapoints_to_alarm."
    references: ["https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/"]
    tags: ["cloudwatch", "alarm"]
  - id: TMAC-AWS-CWALARM-008
    name: "Alarm without a description"
    resource_type: "aws_cloudwatch_metric_alarm"
    check: { attribute: "alarm_description", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "The alarm does not document its purpose via alarm_description."
    mitigation: "Add a meaningful alarm_description."
    references: ["https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/"]
    tags: ["cloudwatch", "alarm", "governance"]

  # ------------------------------------------------------------------
  # aws_db_proxy_default_target_group
  # ------------------------------------------------------------------
  - id: TMAC-AWS-DPTG-001
    name: "RDS Proxy Target Group without connection pooling"
    resource_type: "aws_db_proxy_default_target_group"
    check: { attribute: "connection_pool_config", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Denial of Service"
    description: "The proxy target group does not define connection_pool_config; default values can exhaust connections."
    mitigation: "Configure connection_pool_config according to the load."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy", "availability"]
  - id: TMAC-AWS-DPTG-002
    name: "RDS Proxy Target Group with a high maximum of connections"
    resource_type: "aws_db_proxy_default_target_group"
    check: { attribute: "connection_pool_config.max_connections_percent", condition: "equals", values: [100] }
    severity: "Info"
    stride: "Denial of Service"
    description: "The pool allows using 100% of connections, with no margin for spikes or failover."
    mitigation: "Reserve a margin (e.g. max_connections_percent < 100)."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy", "availability"]
  - id: TMAC-AWS-DPTG-003
    name: "RDS Proxy Target Group without a declared proxy"
    resource_type: "aws_db_proxy_default_target_group"
    check: { attribute: "db_proxy_name", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "The target group does not reference db_proxy_name, an invalid configuration."
    mitigation: "Declare db_proxy_name."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy"]
  - id: TMAC-AWS-DPTG-004
    name: "RDS Proxy Target Group with a high borrow timeout"
    resource_type: "aws_db_proxy_default_target_group"
    check: { attribute: "connection_pool_config.connection_borrow_timeout", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Denial of Service"
    description: "The pool does not define connection_borrow_timeout; clients may wait indefinitely for a connection."
    mitigation: "Define a bounded connection_borrow_timeout."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy", "availability"]
  - id: TMAC-AWS-DPTG-005
    name: "RDS Proxy Target Group without controlled session pinning"
    resource_type: "aws_db_proxy_default_target_group"
    check: { attribute: "connection_pool_config.session_pinning_filters", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "The pool does not define session_pinning_filters; session multiplexing may behave unexpectedly."
    mitigation: "Configure session_pinning_filters according to the app's behavior."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy"]
  - id: TMAC-AWS-DPTG-006
    name: "RDS Proxy Target Group with an unaudited init query"
    resource_type: "aws_db_proxy_default_target_group"
    check: { attribute: "connection_pool_config.init_query", condition: "exists", values: [] }
    severity: "Info"
    stride: "Tampering"
    description: "The pool defines init_query; verify that it does not set insecure session configurations."
    mitigation: "Review that init_query is safe and necessary."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy"]
  - id: TMAC-AWS-DPTG-007
    name: "RDS Proxy Target Group with an undeclared idle timeout"
    resource_type: "aws_db_proxy_default_target_group"
    check: { attribute: "connection_pool_config.max_idle_connections_percent", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Denial of Service"
    description: "The pool does not define max_idle_connections_percent; idle connections may consume resources."
    mitigation: "Define max_idle_connections_percent according to the load."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy"]
  - id: TMAC-AWS-DPTG-008
    name: "RDS Proxy Target Group without a default group name"
    resource_type: "aws_db_proxy_default_target_group"
    check: { attribute: "target_group_name", condition: "exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "Verify the target group name; the default group must remain as 'default'."
    mitigation: "Confirm the target_group_name convention."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy"]

  # ------------------------------------------------------------------
  # aws_db_proxy_target
  # ------------------------------------------------------------------
  - id: TMAC-AWS-DPT-001
    name: "RDS Proxy target without a declared proxy"
    resource_type: "aws_db_proxy_target"
    check: { attribute: "db_proxy_name", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Denial of Service"
    description: "The target does not reference db_proxy_name."
    mitigation: "Declare db_proxy_name."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy"]
  - id: TMAC-AWS-DPT-002
    name: "RDS Proxy target without a target group"
    resource_type: "aws_db_proxy_target"
    check: { attribute: "target_group_name", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Denial of Service"
    description: "The target does not declare target_group_name."
    mitigation: "Declare target_group_name (usually 'default')."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy"]
  - id: TMAC-AWS-DPT-003
    name: "RDS Proxy target without a destination"
    resource_type: "aws_db_proxy_target"
    check: { attribute: "db_cluster_identifier", condition: "not_exists", values: [], and_check: { attribute: "db_instance_identifier", condition: "not_exists", values: [] } }
    severity: "Medium"
    stride: "Denial of Service"
    description: "The target declares neither a destination cluster nor instance."
    mitigation: "Declare db_cluster_identifier or db_instance_identifier."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy"]
  - id: TMAC-AWS-DPT-004
    name: "RDS Proxy target pointing to a single instance"
    resource_type: "aws_db_proxy_target"
    check: { attribute: "db_instance_identifier", condition: "exists", values: [] }
    severity: "Info"
    stride: "Denial of Service"
    description: "The target points to a specific instance; prefer the cluster for transparent failover."
    mitigation: "Use db_cluster_identifier to leverage Aurora failover."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy", "availability"]
  - id: TMAC-AWS-DPT-005
    name: "RDS Proxy target with a static identifier"
    resource_type: "aws_db_proxy_target"
    check: { attribute: "db_cluster_identifier", condition: "regex", values: ["^[a-z0-9-]+$"] }
    severity: "Info"
    stride: "Repudiation"
    description: "The target references the cluster by a string; use resource references for traceability."
    mitigation: "Reference aws_rds_cluster.x.id instead of a literal string."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy", "iac"]
  - id: TMAC-AWS-DPT-006
    name: "RDS Proxy target without a default group"
    resource_type: "aws_db_proxy_target"
    check: { attribute: "target_group_name", condition: "not_equals", values: ["default"] }
    severity: "Info"
    stride: "Repudiation"
    description: "The target uses a non-'default' target group; confirm that this is intentional."
    mitigation: "Verify the target group configuration."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy"]
  - id: TMAC-AWS-DPT-007
    name: "RDS Proxy target over a cluster without verified encryption"
    resource_type: "aws_db_proxy_target"
    check: { attribute: "db_cluster_identifier", condition: "exists", values: [] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "The target points to a cluster; verify that the destination cluster has encryption at rest and TLS."
    mitigation: "Ensure storage_encrypted and require_tls on the proxy/cluster."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy", "encryption"]
  - id: TMAC-AWS-DPT-008
    name: "RDS Proxy target without a declared endpoint"
    resource_type: "aws_db_proxy_target"
    check: { attribute: "rds_resource_id", condition: "exists", values: [] }
    severity: "Info"
    stride: "Repudiation"
    description: "Verify that the target is managed via cluster/instance references and not by internal IDs."
    mitigation: "Manage the target with Terraform resource references."
    references: ["https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"]
    tags: ["rds", "proxy", "iac"]

  # ------------------------------------------------------------------
  # aws_s3_bucket_lifecycle_configuration
  # ------------------------------------------------------------------
  - id: TMAC-AWS-S3LC-001
    name: "Lifecycle without noncurrent version expiration"
    resource_type: "aws_s3_bucket_lifecycle_configuration"
    check: { attribute: "rule.noncurrent_version_expiration", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "The lifecycle does not expire noncurrent versions; old data persists indefinitely."
    mitigation: "Add noncurrent_version_expiration to the rules."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html"]
    tags: ["s3", "lifecycle"]
  - id: TMAC-AWS-S3LC-002
    name: "Lifecycle without cleanup of incomplete multipart uploads"
    resource_type: "aws_s3_bucket_lifecycle_configuration"
    check: { attribute: "rule.abort_incomplete_multipart_upload", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Denial of Service"
    description: "The lifecycle does not abort incomplete multipart uploads, accumulating orphaned storage."
    mitigation: "Add abort_incomplete_multipart_upload."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpu-abort-incomplete-mpu-lifecycle-config.html"]
    tags: ["s3", "lifecycle"]
  - id: TMAC-AWS-S3LC-003
    name: "Lifecycle without transition to cold storage"
    resource_type: "aws_s3_bucket_lifecycle_configuration"
    check: { attribute: "rule.transition", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Denial of Service"
    description: "The lifecycle does not define storage class transitions; inactive objects remain in STANDARD."
    mitigation: "Add transitions to IA/GLACIER for inactive data."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html"]
    tags: ["s3", "lifecycle", "cost"]
  - id: TMAC-AWS-S3LC-004
    name: "Lifecycle with disabled rules"
    resource_type: "aws_s3_bucket_lifecycle_configuration"
    check: { attribute: "rule.status", condition: "equals", values: ["Disabled"] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "A lifecycle rule is disabled; the retention policy is not applied."
    mitigation: "Enable the necessary rules (status = Enabled)."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html"]
    tags: ["s3", "lifecycle"]
  - id: TMAC-AWS-S3LC-005
    name: "Lifecycle without a declared bucket"
    resource_type: "aws_s3_bucket_lifecycle_configuration"
    check: { attribute: "bucket", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Repudiation"
    description: "The lifecycle configuration does not reference a bucket."
    mitigation: "Declare the target bucket."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html"]
    tags: ["s3", "lifecycle"]
  - id: TMAC-AWS-S3LC-006
    name: "Lifecycle without object expiration"
    resource_type: "aws_s3_bucket_lifecycle_configuration"
    check: { attribute: "rule.expiration", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "The lifecycle does not expire objects; sensitive data could be retained longer than necessary."
    mitigation: "Define expiration according to the retention policy."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html"]
    tags: ["s3", "lifecycle", "retention"]
  - id: TMAC-AWS-S3LC-007
    name: "Lifecycle without a defined filter"
    resource_type: "aws_s3_bucket_lifecycle_configuration"
    check: { attribute: "rule.filter", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Tampering"
    description: "The rule does not define a filter; it could apply to more objects than intended."
    mitigation: "Define a filter (prefix/tags) to scope it down."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html"]
    tags: ["s3", "lifecycle"]
  - id: TMAC-AWS-S3LC-008
    name: "Lifecycle without transition to Glacier for archiving"
    resource_type: "aws_s3_bucket_lifecycle_configuration"
    check: { attribute: "rule.transition.storage_class", condition: "not_contains", values: ["GLACIER"] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "The lifecycle does not archive to GLACIER; sensitive inactive data remains accessible."
    mitigation: "Add a transition to GLACIER/DEEP_ARCHIVE for secure archiving."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html"]
    tags: ["s3", "lifecycle", "archival"]

  # ------------------------------------------------------------------
  # aws_s3_bucket_server_side_encryption_configuration
  # ------------------------------------------------------------------
  - id: TMAC-AWS-S3SSE-001
    name: "SSE with the AES256 algorithm instead of KMS"
    resource_type: "aws_s3_bucket_server_side_encryption_configuration"
    check: { attribute: "rule.apply_server_side_encryption_by_default.sse_algorithm", condition: "equals", values: ["AES256"] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "The bucket uses SSE-S3 (AES256) instead of SSE-KMS, without its own key control or usage auditing."
    mitigation: "Use sse_algorithm = aws:kms with a managed CMK."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.html"]
    tags: ["s3", "encryption", "kms"]
  - id: TMAC-AWS-S3SSE-002
    name: "SSE without a declared KMS key"
    resource_type: "aws_s3_bucket_server_side_encryption_configuration"
    check: { attribute: "rule.apply_server_side_encryption_by_default.kms_master_key_id", condition: "not_exists", values: [] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "The SSE configuration does not specify kms_master_key_id; it could use the default aws/s3 key."
    mitigation: "Specify kms_master_key_id with a customer-managed CMK."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.html"]
    tags: ["s3", "encryption", "kms"]
  - id: TMAC-AWS-S3SSE-003
    name: "SSE without a bucket key (KMS cost/exposure)"
    resource_type: "aws_s3_bucket_server_side_encryption_configuration"
    check: { attribute: "rule.bucket_key_enabled", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "S3 Bucket Key is not enabled; it increases KMS calls and cost, with no additional security benefit."
    mitigation: "Enable bucket_key_enabled = true with SSE-KMS."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucket-key.html"]
    tags: ["s3", "encryption", "kms"]
  - id: TMAC-AWS-S3SSE-004
    name: "SSE without a declared bucket"
    resource_type: "aws_s3_bucket_server_side_encryption_configuration"
    check: { attribute: "bucket", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Repudiation"
    description: "The SSE configuration does not reference a bucket."
    mitigation: "Declare the target bucket."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/"]
    tags: ["s3", "encryption"]
  - id: TMAC-AWS-S3SSE-005
    name: "SSE without a declared rule"
    resource_type: "aws_s3_bucket_server_side_encryption_configuration"
    check: { attribute: "rule", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The configuration defines no encryption rule, leaving the bucket without effective SSE."
    mitigation: "Add a rule with apply_server_side_encryption_by_default."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/serv-side-encryption.html"]
    tags: ["s3", "encryption"]
  - id: TMAC-AWS-S3SSE-006
    name: "SSE with no declared algorithm"
    resource_type: "aws_s3_bucket_server_side_encryption_configuration"
    check: { attribute: "rule.apply_server_side_encryption_by_default.sse_algorithm", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The rule does not specify sse_algorithm; the default encryption is left undefined."
    mitigation: "Define sse_algorithm = aws:kms."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/serv-side-encryption.html"]
    tags: ["s3", "encryption"]
  - id: TMAC-AWS-S3SSE-007
    name: "SSE with DSSE not considered for critical data"
    resource_type: "aws_s3_bucket_server_side_encryption_configuration"
    check: { attribute: "rule.apply_server_side_encryption_by_default.sse_algorithm", condition: "not_equals", values: ["aws:kms:dsse"] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "For highly sensitive data, consider dual server-side encryption (DSSE-KMS)."
    mitigation: "Evaluate sse_algorithm = aws:kms:dsse for critical data."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingDSSEncryption.html"]
    tags: ["s3", "encryption", "dsse"]
  - id: TMAC-AWS-S3SSE-008
    name: "SSE with the aws/s3 alias key"
    resource_type: "aws_s3_bucket_server_side_encryption_configuration"
    check: { attribute: "rule.apply_server_side_encryption_by_default.kms_master_key_id", condition: "regex", values: ["alias/aws/s3"] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "SSE uses the managed aws/s3 key instead of its own CMK, limiting control and auditing."
    mitigation: "Use a customer-managed CMK."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.html"]
    tags: ["s3", "encryption", "kms"]

  # ------------------------------------------------------------------
  # aws_s3_bucket_website_configuration
  # ------------------------------------------------------------------
  - id: TMAC-AWS-S3WEB-001
    name: "S3 Website hosting enabled"
    resource_type: "aws_s3_bucket_website_configuration"
    check: { attribute: "index_document", condition: "exists", values: [] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The bucket serves a static website (public HTTP access without S3 TLS). Place CloudFront in front."
    mitigation: "Serve the site via CloudFront with TLS and OAC; avoid direct exposure of the bucket."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/WebsiteHosting.html"]
    tags: ["s3", "website", "exposure"]
  - id: TMAC-AWS-S3WEB-002
    name: "S3 Website with an error document that leaks info"
    resource_type: "aws_s3_bucket_website_configuration"
    check: { attribute: "error_document", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "The site does not define error_document; default error responses may leak details."
    mitigation: "Define a controlled error_document."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/WebsiteHosting.html"]
    tags: ["s3", "website"]
  - id: TMAC-AWS-S3WEB-003
    name: "S3 Website with a redirect to a non-HTTPS host"
    resource_type: "aws_s3_bucket_website_configuration"
    check: { attribute: "redirect_all_requests_to.protocol", condition: "equals", values: ["http"] }
    severity: "Medium"
    stride: "Information Disclosure"
    description: "The site redirects to unencrypted HTTP."
    mitigation: "Use protocol = https in redirect_all_requests_to."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/how-to-page-redirect.html"]
    tags: ["s3", "website", "tls"]
  - id: TMAC-AWS-S3WEB-004
    name: "S3 Website with unaudited routing rules"
    resource_type: "aws_s3_bucket_website_configuration"
    check: { attribute: "routing_rule", condition: "exists", values: [] }
    severity: "Info"
    stride: "Tampering"
    description: "The site defines routing_rules; verify they do not allow open redirects."
    mitigation: "Review the routing_rules to avoid open redirects."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/how-to-page-redirect.html"]
    tags: ["s3", "website"]
  - id: TMAC-AWS-S3WEB-005
    name: "S3 Website without a declared bucket"
    resource_type: "aws_s3_bucket_website_configuration"
    check: { attribute: "bucket", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Repudiation"
    description: "The site configuration does not reference a bucket."
    mitigation: "Declare the target bucket."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/WebsiteHosting.html"]
    tags: ["s3", "website"]
  - id: TMAC-AWS-S3WEB-006
    name: "S3 Website with error-document routing to itself"
    resource_type: "aws_s3_bucket_website_configuration"
    check: { attribute: "index_document.suffix", condition: "not_exists", values: [] }
    severity: "Info"
    stride: "Information Disclosure"
    description: "The site does not define the index_document suffix, a potentially unexpected behavior."
    mitigation: "Define index_document { suffix = \"index.html\" }."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/WebsiteHosting.html"]
    tags: ["s3", "website"]
  - id: TMAC-AWS-S3WEB-007
    name: "S3 Website exposed without CloudFront"
    resource_type: "aws_s3_bucket_website_configuration"
    check: { attribute: "index_document.suffix", condition: "exists", values: [] }
    severity: "Low"
    stride: "Spoofing"
    description: "The S3 website endpoint does not support native HTTPS; without CloudFront traffic goes unencrypted."
    mitigation: "Place CloudFront with TLS in front of the website bucket."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/website-hosting-cloudfront-walkthrough.html"]
    tags: ["s3", "website", "tls"]
  - id: TMAC-AWS-S3WEB-008
    name: "S3 Website with a redirect that preserves an insecure protocol"
    resource_type: "aws_s3_bucket_website_configuration"
    check: { attribute: "routing_rule.redirect.protocol", condition: "equals", values: ["http"] }
    severity: "Low"
    stride: "Information Disclosure"
    description: "A routing rule redirects to unencrypted HTTP."
    mitigation: "Use https in routing_rule redirects."
    references: ["https://docs.aws.amazon.com/AmazonS3/latest/userguide/how-to-page-redirect.html"]
    tags: ["s3", "website", "tls"]

  # ------------------------------------------------------------------
  # aws_wafv2_web_acl_association
  # ------------------------------------------------------------------
  - id: TMAC-AWS-WAFASSOC-001
    name: "WAF association without a declared resource"
    resource_type: "aws_wafv2_web_acl_association"
    check: { attribute: "resource_arn", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Tampering"
    description: "The association does not declare resource_arn; the WAF protects no resource."
    mitigation: "Declare the resource_arn of the ALB/API Gateway to protect."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/web-acl-associating-aws-resource.html"]
    tags: ["waf", "association"]
  - id: TMAC-AWS-WAFASSOC-002
    name: "WAF association without a Web ACL"
    resource_type: "aws_wafv2_web_acl_association"
    check: { attribute: "web_acl_arn", condition: "not_exists", values: [] }
    severity: "Medium"
    stride: "Tampering"
    description: "The association does not declare web_acl_arn."
    mitigation: "Declare the web_acl_arn of the Web ACL to associate."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/web-acl-associating-aws-resource.html"]
    tags: ["waf", "association"]
  - id: TMAC-AWS-WAFASSOC-003
    name: "WAF association with a static ARN"
    resource_type: "aws_wafv2_web_acl_association"
    check: { attribute: "web_acl_arn", condition: "regex", values: ["^arn:aws:wafv2:"] }
    severity: "Info"
    stride: "Repudiation"
    description: "The association references the Web ACL by a literal ARN instead of a resource reference."
    mitigation: "Reference aws_wafv2_web_acl.x.arn for traceability."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/"]
    tags: ["waf", "association", "iac"]
  - id: TMAC-AWS-WAFASSOC-004
    name: "WAF association to a resource by static ARN"
    resource_type: "aws_wafv2_web_acl_association"
    check: { attribute: "resource_arn", condition: "regex", values: ["^arn:aws:(elasticloadbalancing|apigateway):"] }
    severity: "Info"
    stride: "Repudiation"
    description: "The association references the protected resource by a literal ARN."
    mitigation: "Reference the resource (aws_lb.x.arn) for traceability."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/"]
    tags: ["waf", "association", "iac"]
  - id: TMAC-AWS-WAFASSOC-005
    name: "WAF association to an unsupported resource"
    resource_type: "aws_wafv2_web_acl_association"
    check: { attribute: "resource_arn", condition: "regex", values: [":cloudfront:"] }
    severity: "Low"
    stride: "Tampering"
    description: "CloudFront is associated via the Web ACL (CLOUDFRONT scope), not with a regional web_acl_association."
    mitigation: "For CloudFront, associate the Web ACL on the distribution (CLOUDFRONT scope)."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/web-acl-associating-aws-resource.html"]
    tags: ["waf", "association", "cloudfront"]
  - id: TMAC-AWS-WAFASSOC-006
    name: "WAF association to an internal load balancer"
    resource_type: "aws_wafv2_web_acl_association"
    check: { attribute: "resource_arn", condition: "regex", values: [":loadbalancer/app/"] }
    severity: "Info"
    stride: "Tampering"
    description: "The association protects an ALB; verify that the Web ACL has effective rules (OWASP, rate-limit)."
    mitigation: "Ensure the associated Web ACL has adequate rules."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/"]
    tags: ["waf", "association", "alb"]
  - id: TMAC-AWS-WAFASSOC-007
    name: "WAF association to API Gateway without a stage"
    resource_type: "aws_wafv2_web_acl_association"
    check: { attribute: "resource_arn", condition: "regex", values: [":apigateway:.*/stages/"] }
    severity: "Info"
    stride: "Tampering"
    description: "The association protects an API Gateway stage; confirm that all exposed stages are covered."
    mitigation: "Associate the WAF with all relevant public stages."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/"]
    tags: ["waf", "association", "apigateway"]
  - id: TMAC-AWS-WAFASSOC-008
    name: "WAF association without coverage verification"
    resource_type: "aws_wafv2_web_acl_association"
    check: { attribute: "resource_arn", condition: "exists", values: [] }
    severity: "Info"
    stride: "Tampering"
    description: "Verify that all public resources (ALB/API/AppSync) have a corresponding WAF association."
    mitigation: "Audit WAF coverage over all public endpoints."
    references: ["https://docs.aws.amazon.com/waf/latest/developerguide/"]
    tags: ["waf", "association", "coverage"]
