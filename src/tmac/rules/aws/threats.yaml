version: "1.0"
metadata:
  cloud: aws
  framework: STRIDE
  description: "Threat database for TMAC v1.0.0 Ixtla - AWS Terraform"
  maintainer: "TMAC Security Team"
  last_updated: "2026-03-16"

rules:
  # ============================================================
  # SECTION: S3 BUCKETS
  # ============================================================

  - id: TMAC-AWS-S3-001
    name: "S3 Bucket with Public Access (ACL)"
    resource_type: "aws_s3_bucket"
    check:
      attribute: "acl"
      condition: "in"
      values: ["public-read", "public-read-write"]
    severity: "Critical"
    stride: "Information Disclosure"
    description: >
      An S3 bucket with a public ACL was detected. This allows any user on
      the internet to read or write files in the bucket, exposing sensitive
      data to unauthorized access.
    mitigation: >
      Change the 'acl' attribute to 'private' and enable 'block_public_access'.
      Example:
        resource "aws_s3_bucket_public_access_block" "example" {
          bucket = aws_s3_bucket.example.id
          block_public_acls       = true
          block_public_policy     = true
          ignore_public_acls      = true
          restrict_public_buckets = true
        }
    references:
      - "https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html"
      - "CIS AWS Benchmark v2.0.0 - 2.1.5"
    tags: ["s3", "public-access", "data-exposure"]

  - id: TMAC-AWS-S3-002
    name: "S3 Bucket without Server-Side Encryption"
    resource_type: "aws_s3_bucket"
    check:
      attribute: "server_side_encryption_configuration"
      condition: "not_exists"
      values: []
    severity: "High"
    stride: "Information Disclosure"
    description: >
      The S3 bucket does not have server-side encryption (SSE) configured.
      Stored objects are not encrypted at rest, which increases the risk of
      data exposure in the event of unauthorized access.
    mitigation: >
      Enable SSE with KMS or AES-256:
        resource "aws_s3_bucket_server_side_encryption_configuration" "example" {
          bucket = aws_s3_bucket.example.id
          rule {
            apply_server_side_encryption_by_default {
              sse_algorithm = "aws:kms"
            }
          }
        }
    references:
      - "https://docs.aws.amazon.com/AmazonS3/latest/userguide/serv-side-encryption.html"
      - "CIS AWS Benchmark v2.0.0 - 2.1.1"
    tags: ["s3", "encryption", "data-at-rest"]

  - id: TMAC-AWS-S3-003
    name: "S3 Bucket without Access Logging"
    resource_type: "aws_s3_bucket"
    check:
      attribute: "logging"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Repudiation"
    description: >
      The S3 bucket does not have access logging enabled. Without audit records,
      it is not possible to track who accessed the objects, hindering incident
      investigation and regulatory compliance.
    mitigation: >
      Enable access logging pointing to a dedicated bucket:
        resource "aws_s3_bucket_logging" "example" {
          bucket        = aws_s3_bucket.example.id
          target_bucket = aws_s3_bucket.log_bucket.id
          target_prefix = "s3-access-logs/"
        }
    references:
      - "https://docs.aws.amazon.com/AmazonS3/latest/userguide/ServerLogs.html"
      - "CIS AWS Benchmark v2.0.0 - 2.1.3"
    tags: ["s3", "logging", "audit", "compliance"]

  - id: TMAC-AWS-S3-004
    name: "S3 Bucket with Force Destroy Enabled"
    resource_type: "aws_s3_bucket"
    check:
      attribute: "force_destroy"
      condition: "equals"
      values: [true]
    severity: "High"
    stride: "Denial of Service"
    description: >
      The S3 bucket has the 'force_destroy' setting enabled. This allows the
      bucket to be deleted even if it contains objects, increasing the risk of
      accidental or malicious mass data loss (Denial of Service / Tampering).
    mitigation: >
      Remove the 'force_destroy' setting or set it explicitly to false:
        resource "aws_s3_bucket" "example" {
          bucket = "my-bucket"
          force_destroy = false
        }
    references:
      - "https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/s3_bucket#force_destroy"
    tags: ["s3", "availability", "data-loss"]

  - id: TMAC-AWS-S3-005
    name: "S3 Bucket without Object Lock (Ransomware Protection)"
    resource_type: "aws_s3_bucket"
    check:
      attribute: "object_lock_enabled"
      condition: "not_exists"
      values: []
    severity: "High"
    stride: "Tampering"
    description: >
      The bucket does not have Object Lock enabled. This leaves the bucket
      vulnerable to data tampering and ransomware attacks where attackers
      permanently encrypt or delete the immutable versions.
    mitigation: >
      Enable Object Lock when creating the bucket to guarantee immutability:
        resource "aws_s3_bucket" "example" {
          bucket = "my-bucket"
          object_lock_enabled = true
        }
    references:
      - "https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html"
    tags: ["s3", "ransomware", "object-lock", "immutability"]

  - id: TMAC-AWS-S3-006
    name: "S3 Bucket Configured as a Static Website"
    resource_type: "aws_s3_bucket"
    check:
      attribute: "website"
      condition: "exists"
      values: []
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The bucket is configured to host a static website. This configuration
      generally requires the bucket to be publicly readable. If the bucket
      stores sensitive data, this configuration could result in severe data
      exposure.
    mitigation: >
      If the bucket is not intended to serve public corporate web content,
      remove the 'website' block. If required, place it behind a CloudFront
      distribution with Origin Access Control (OAC) in an isolated manner.
    references:
      - "https://docs.aws.amazon.com/AmazonS3/latest/userguide/WebsiteHosting.html"
    tags: ["s3", "website", "public-exposure"]

  # ============================================================
  # SECTION: IAM POLICIES
  # ============================================================

  - id: TMAC-AWS-IAM-001
    name: "Use of Wildcards (*) in IAM Policies"
    resource_type: "aws_iam_policy"
    check:
      attribute: "policy.Statement.Resource"
      condition: "equals"
      values: ["*"]
    severity: "High"
    stride: "Elevation of Privilege"
    description: >
      The IAM policy allows actions on ALL resources (*), violating the
      principle of least privilege. An attacker who compromises this identity
      would have unrestricted access to all resources in the account.
    mitigation: >
      Restrict the 'Resource' field to the specific required ARNs.
      Example:
        "Resource": [
          "arn:aws:s3:::my-bucket",
          "arn:aws:s3:::my-bucket/*"
        ]
    references:
      - "https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html#grant-least-privilege"
      - "CIS AWS Benchmark v2.0.0 - 1.16"
    tags: ["iam", "least-privilege", "wildcard", "permissions"]

  - id: TMAC-AWS-IAM-002
    name: "IAM User with an Inline Policy"
    resource_type: "aws_iam_user_policy"
    check:
      attribute: "policy"
      condition: "exists"
      values: []
    severity: "Medium"
    stride: "Spoofing"
    description: >
      An inline policy attached directly to an IAM user was detected. Inline
      policies hinder centralized permission management, increase the risk of
      inconsistent configurations, and complicate access auditing.
    mitigation: >
      Use managed policies instead of inline ones. Attach policies to IAM
      groups or roles, not directly to users:
        resource "aws_iam_group_policy_attachment" "example" {
          group      = aws_iam_group.developers.name
          policy_arn = aws_iam_policy.dev_policy.arn
        }
    references:
      - "https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_managed-vs-inline.html"
      - "CIS AWS Benchmark v2.0.0 - 1.15"
    tags: ["iam", "inline-policy", "user-management", "governance"]

  - id: TMAC-AWS-IAM-003
    name: "Full Administrative Permissions (Action: *)"
    resource_type: "aws_iam_policy"
    check:
      attribute: "policy"
      condition: "contains"
      values: ['"Action": "*"']
    severity: "Critical"
    stride: "Elevation of Privilege"
    description: >
      The policy grants full administrative permissions through the use of the '*'
      wildcard in the 'Action' field. This lets the identity perform any
      destructive or escalation action within the AWS account, which violates the
      principle of least privilege.
    mitigation: >
      Explicitly define the specific actions required for the role or user,
      such as 's3:GetObject' or 'ec2:DescribeInstances', instead of using absolute wildcards.
    references:
      - "https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html#grant-least-privilege"
    tags: ["iam", "over-privileged", "admin-access"]

  - id: TMAC-AWS-IAM-004
    name: "IAM Role Assumable by Any Entity (AssumeRole *"
    resource_type: "aws_iam_role"
    check:
      attribute: "assume_role_policy"
      condition: "contains"
      values: ['"AWS": "*"', '"Principal": "*"']
    severity: "Critical"
    stride: "Spoofing"
    description: >
      The role's trust policy allows any AWS entity ('*') to assume this role.
      An external attacker or compromised resource could impersonate (Spoofing)
      this role to access the infrastructure without valid authentication.
    mitigation: >
      Restrict the Principal to specific AWS accounts, required internal services
      (e.g. lambda.amazonaws.com) or specific users via ARNs:
        "Principal": {
          "AWS": "arn:aws:iam::123456789012:root"
        }
    references:
      - "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_for-user.html"
    tags: ["iam", "trust-policy", "assume-role", "spoofing"]

  - id: TMAC-AWS-IAM-005
    name: "Permanent User Access Keys"
    resource_type: "aws_iam_access_key"
    check:
      attribute: "user"
      condition: "exists"
      values: []
    severity: "High"
    stride: "Information Disclosure"
    description: >
      You are creating long-term access keys via IaC. Long-lived keys have a high
      rate of leakage in repositories, leading to a critical disclosure of
      information and account takeover (Spoofing).
    mitigation: >
      Avoid generating permanent access keys. Use IAM roles, AWS IAM Identity
      Center (SSO), and temporary credentials (STS) instead for user and
      application authentication.
    references:
      - "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html"
    tags: ["iam", "access-keys", "secrets-management"]

  - id: TMAC-AWS-IAM-006
    name: "IAM Role Vulnerable to Confused Deputy (No ExternalId)"
    resource_type: "aws_iam_role"
    check:
      attribute: "assume_role_policy"
      condition: "not_contains"
      values: ['"sts:ExternalId"']
      and_check:
        attribute: "assume_role_policy"
        condition: "contains"
        values: ['"AWS": "arn:aws:iam::']
    severity: "High"
    stride: "Spoofing"
    description: >
      The IAM Role trusts an external AWS account but does not require the
      'sts:ExternalId' condition. This makes it vulnerable to a Confused Deputy attack (Spoofing),
      where a malicious third party could trick the trusted account into assuming your role.
    mitigation: >
      Always add a Condition block requiring a unique, secret 'ExternalId' when granting
      'sts:AssumeRole' access to third-party AWS accounts or SaaS providers:
        "Condition": {
          "StringEquals": {
            "sts:ExternalId": "YOUR_UNIQUE_SECRET_VALUE"
          }
        }
    references:
      - "https://docs.aws.amazon.com/IAM/latest/UserGuide/confused-deputy.html"
    tags: ["iam", "trust-policy", "confused-deputy", "cross-account"]

  - id: TMAC-AWS-IAM-007
    name: "Unrestricted iam:PassRole Permissions"
    resource_type: "aws_iam_policy"
    check:
      attribute: "policy"
      condition: "contains"
      values: ['"iam:PassRole"']
      and_check:
        attribute: "policy"
        condition: "contains"
        values: ['"Resource": "*"']
    severity: "Critical"
    stride: "Elevation of Privilege"
    description: >
      A role or policy is granted the 'iam:PassRole' action affecting all resources
      ('*'). This is a critical privilege escalation, since a user could launch a
      web service assigning it an ultra-privileged role (such as AdministratorAccess)
      and then access that service to take full control of the account.
    mitigation: >
      Ensure that 'iam:PassRole' can only be used on specific, pre-approved IAM roles,
      never on a Resource with an absolute wildcard:
        "Action": "iam:PassRole",
        "Resource": "arn:aws:iam::123456789012:role/SpecificSecureRole"
    references:
      - "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_passrole.html"
    tags: ["iam", "privilege-escalation", "pass-role"]

  - id: TMAC-AWS-IAM-008
    name: "Creation of Direct IAM Users (Identity Anti-Pattern)"
    resource_type: "aws_iam_user"
    check:
      attribute: "name"
      condition: "exists"
      values: []
    severity: "Medium"
    stride: "Spoofing"
    description: >
      Creating and managing users directly with 'aws_iam_user' is considered an
      anti-pattern in modern AWS environments. It decentralizes identity
      management, encourages the use of permanent access keys, and increases the
      risk of Spoofing by not integrating natively with corporate identity
      providers (IdP).
    mitigation: >
      Replace IAM Users with AWS IAM Identity Center (formerly AWS SSO) or
      SAML/OIDC federation with your corporate active directory for temporary
      console and programmatic access.
    references:
      - "https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html"
    tags: ["iam", "identity", "best-practice", "sso"]

  - id: TMAC-AWS-IAM-009
    name: "IAM User Login Profile without Password Reset"
    resource_type: "aws_iam_user_login_profile"
    check:
      attribute: "password_reset_required"
      condition: "equals"
      values: [false]
    severity: "High"
    stride: "Spoofing"
    description: >
      The user's console access profile is created without requiring a forced
      password reset ('password_reset_required: false') on first sign-in. If
      these initial passwords are sent or shared, an attacker who intercepts an
      insecure channel (Info Disclosure) could immediately impersonate the
      employee's identity (Spoofing).
    mitigation: >
      Always set 'password_reset_required = true' when you exceptionally create
      console access to ensure that only the end user handles their final
      password:
        resource "aws_iam_user_login_profile" "example" {
          user                    = aws_iam_user.example.name
          password_reset_required = true
        }
    references:
      - "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_passwords_admin-reset.html"
    tags: ["iam", "console-access", "password", "security"]

  # ============================================================
  # SECTION: SECURITY GROUPS
  # ============================================================

  - id: TMAC-AWS-SG-001
    name: "SSH Port (22) Open to the World"
    resource_type: "aws_security_group"
    check:
      attribute: "ingress.from_port"
      condition: "equals"
      values: [22]
      and_check:
        attribute: "ingress.cidr_blocks"
        condition: "contains"
        values: ["0.0.0.0/0"]
    severity: "High"
    stride: "Tampering"
    description: >
      The SSH port (22) is globally exposed (0.0.0.0/0), enabling brute-force
      attacks, exploitation of SSH service vulnerabilities, and unauthorized
      access to instances.
    mitigation: >
      Restrict SSH access to known corporate IPs only, or use AWS Systems Manager
      Session Manager as an alternative with no open ports:
        ingress {
          from_port   = 22
          to_port     = 22
          protocol    = "tcp"
          cidr_blocks = ["10.0.0.0/8"]  # Corporate network only
        }
    references:
      - "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/security-group-rules.html"
      - "CIS AWS Benchmark v2.0.0 - 5.2"
    tags: ["security-group", "ssh", "network", "ingress"]

  - id: TMAC-AWS-SG-002
    name: "RDP Port (3389) Open to the World"
    resource_type: "aws_security_group"
    check:
      attribute: "ingress.from_port"
      condition: "equals"
      values: [3389]
      and_check:
        attribute: "ingress.cidr_blocks"
        condition: "contains"
        values: ["0.0.0.0/0"]
    severity: "Critical"
    stride: "Tampering"
    description: >
      The RDP port (3389) is globally exposed. RDP is one of the most exploited
      attack vectors, being a frequent target of ransomware and automated
      brute-force attacks.
    mitigation: >
      Remove public RDP access. Use AWS Systems Manager Fleet Manager or a bastion
      host in a private subnet with restricted access:
        ingress {
          from_port   = 3389
          to_port     = 3389
          protocol    = "tcp"
          cidr_blocks = ["10.0.0.0/8"]  # Corporate VPN only
        }
    references:
      - "https://docs.aws.amazon.com/AWSEC2/latest/WindowsGuide/security-group-rules.html"
      - "CIS AWS Benchmark v2.0.0 - 5.3"
    tags: ["security-group", "rdp", "network", "ingress", "ransomware"]

  - id: TMAC-AWS-SG-003
    name: "Security Group with Unrestricted Outbound Traffic (Egress)"
    resource_type: "aws_security_group"
    check:
      attribute: "egress.cidr_blocks"
      condition: "contains"
      values: ["0.0.0.0/0"]
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The Security Group allows outbound (egress) traffic to any IP on the internet (0.0.0.0/0).
      This enables data exfiltration (Information Disclosure) if an instance
      is compromised, and lets an attacker download malware or connect to a C&C (Command and Control).
    mitigation: >
      Apply the principle of least privilege to outbound traffic by defining
      only the strictly necessary ports and destinations (CIDR blocks/Security Groups):
        egress {
          from_port   = 443
          to_port     = 443
          protocol    = "tcp"
          cidr_blocks = ["10.0.0.0/8"]  # Or the specific IPs of the external APIs
        }
    references:
      - "https://docs.aws.amazon.com/vpc/latest/userguide/VPC_SecurityGroups.html"
    tags: ["security-group", "egress", "data-exfiltration", "network"]

  # ============================================================
  # SECTION: NETWORKING (VPC)
  # ============================================================

  - id: TMAC-AWS-VPC-001
    name: "Amazon VPC without Flow Logs Enabled"
    resource_type: "aws_vpc"
    # KNOWN TECHNICAL LIMITATION (workaround):
    # VPC Flow Logs in Terraform are configured as a separate resource (aws_flow_log),
    # not as an inline attribute of aws_vpc. The TMAC v1.0.0 engine evaluates each resource
    # independently and does not perform correlation between distinct resources.
    # Therefore, this rule checks for the ABSENCE of the 'FlowLogs = "enabled"' tag on the
    # aws_vpc resource as an indirect detection mechanism (workaround).
    # Implications:
    #   - False positive: VPC with aws_flow_log declared but without the tag → TMAC reports a finding
    #   - False negative: VPC without aws_flow_log but with the tag → TMAC does not report a finding
    # Roadmap: multi-resource correlation (aws_vpc ↔ aws_flow_log) planned for v1.2.0.
    check:
      attribute: "tags.FlowLogs"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Repudiation"
    description: >
      An AWS VPC is being defined without network-level traceability (Flow Logs).
      By not capturing information about the IP traffic entering and leaving the network interfaces,
      there is no visibility into network scans, anomalous traffic or intrusions (Repudiation).
      IMPLEMENTATION NOTE: This rule uses a tag-based workaround because the TMAC v1.0.0 engine
      does not correlate distinct resources. If you already declared an aws_flow_log resource
      associated with this VPC, add the 'FlowLogs = "enabled"' tag to suppress this finding.
      See DOCS/aws_stride_mapping.md for full documentation of the limitation.
    mitigation: >
      Create an 'aws_flow_log' resource associated with this VPC and add the 'FlowLogs = "enabled"' tag
      to indicate to TMAC that Flow Logs are active:
        resource "aws_vpc" "main" {
          cidr_block = "10.0.0.0/16"
          tags = {
            FlowLogs = "enabled"
          }
        }
        resource "aws_flow_log" "main" {
          vpc_id          = aws_vpc.main.id
          traffic_type    = "ALL"
          iam_role_arn    = aws_iam_role.flow_log.arn
          log_destination = aws_cloudwatch_log_group.flow_log.arn
        }
    references:
      - "https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html"
      - "CIS AWS Benchmark v2.0.0 - 4.3"
    tags: ["vpc", "network", "logging", "audit", "observability"]

  - id: TMAC-AWS-VPC-002
    name: "Default Security Group without Restrictions"
    resource_type: "aws_default_security_group"
    check:
      attribute: "ingress"
      condition: "exists"
      values: []
    severity: "High"
    stride: "Tampering"
    description: >
      The VPC's default Security Group has explicit 'ingress' rules or has not had
      all its rules removed. Industry best practice dictates that the Default SG
      must block all traffic (Tampering protection) and must never be associated
      with any compute resource.
    mitigation: >
      Explicitly declare the VPC's Default SG and clear all Ingress and Egress
      rules, leaving them empty (this nullifies default access):
        resource "aws_default_security_group" "default" {
          vpc_id = aws_vpc.main.id
          # Ingress and Egress forcibly omitted or empty
        }
    references:
      - "https://docs.aws.amazon.com/vpc/latest/userguide/VPC_SecurityGroups.html#DefaultSecurityGroup"
      - "CIS AWS Benchmark v2.0.0 - 4.4"
    tags: ["security-group", "default", "network", "isolation"]

  # ============================================================
  # SECTION: COMPUTE (EC2)
  # ============================================================

  - id: TMAC-AWS-EC2-001
    name: "EC2 Instance with IMDSv1 Enabled"
    resource_type: "aws_instance"
    check:
      attribute: "metadata_options.http_tokens"
      condition: "equals"
      values: ["optional"]
    severity: "Critical"
    stride: "Spoofing"
    description: >
      The instance allows the use of IMDSv1 (Instance Metadata Service v1).
      IMDSv1 is vulnerable to Server-Side Request Forgery (SSRF) attacks,
      allowing an attacker to steal temporary credentials from the IAM Role
      associated with the EC2 and impersonate (Spoofing) its identity to escalate privileges.
    mitigation: >
      Enforce the use of IMDSv2 by requiring tokens ('http_tokens = "required"'):
        resource "aws_instance" "example" {
          # ...
          metadata_options {
            http_endpoint = "enabled"
            http_tokens   = "required"
          }
        }
    references:
      - "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html"
      - "CIS AWS Benchmark v2.0.0 - 5.1"
    tags: ["ec2", "imds", "metadata", "ssrf"]

  - id: TMAC-AWS-EC2-002
    name: "Unencrypted EBS Volume (EC2)"
    resource_type: "aws_ebs_volume"
    check:
      attribute: "encrypted"
      condition: "equals"
      values: [false]
    severity: "High"
    stride: "Information Disclosure"
    description: >
      A block storage volume (EBS) is not encrypted. The data at rest and the
      snapshots derived from this volume could be accessed if they fall into the
      wrong hands or if account permissions are compromised.
    mitigation: >
      Ensure that 'encrypted = true' is set on all volumes, or enable default EBS
      encryption at the AWS account level:
        resource "aws_ebs_volume" "example" {
          # ...
          encrypted = true
          kms_key_id = aws_kms_key.ebs_key.arn
        }
    references:
      - "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/EBSEncryption.html"
      - "CIS AWS Benchmark v2.0.0 - 2.2.1"
    tags: ["ebs", "ec2", "encryption", "data-at-rest"]

  - id: TMAC-AWS-EC2-003
    name: "EC2 Instance with a Public IP Assigned Directly"
    resource_type: "aws_instance"
    check:
      attribute: "associate_public_ip_address"
      condition: "equals"
      values: [true]
    severity: "High"
    stride: "Tampering"
    description: >
      A public IP address is being explicitly assigned to the EC2 instance. This
      directly exposes the compute resource (Process) to the public internet,
      enabling external reconnaissance, service exploitation and Tampering.
    mitigation: >
      Deploy compute instances in private subnets. If they require internet egress,
      use a NAT Gateway. If they must receive traffic, place them behind an
      Elastic Load Balancer (ELB) or API Gateway:
        resource "aws_instance" "example" {
          # ...
          associate_public_ip_address = false
        }
    references:
      - "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-security.html"
    tags: ["ec2", "network", "public-exposure", "architecture"]

  # ============================================================
  # SECTION: DATABASES (RDS)
  # ============================================================

  - id: TMAC-AWS-RDS-001
    name: "RDS Database without Encryption"
    resource_type: "aws_db_instance"
    check:
      attribute: "storage_encrypted"
      condition: "equals"
      values: [false]
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The RDS instance's data at rest is not encrypted. This increases the risk
      of data exposure in the event of unauthorized physical access to the
      underlying storage or compromised snapshots.
    mitigation: >
      Set storage_encrypted = true. Note: it cannot be enabled on an existing
      instance; you must create an encrypted snapshot and restore from it:
        resource "aws_db_instance" "example" {
          storage_encrypted = true
          kms_key_id        = aws_kms_key.rds.arn
        }
    references:
      - "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html"
      - "CIS AWS Benchmark v2.0.0 - 2.3.1"
    tags: ["rds", "encryption", "database", "data-at-rest"]

  - id: TMAC-AWS-RDS-002
    name: "RDS Instance with Public Access"
    resource_type: "aws_db_instance"
    check:
      attribute: "publicly_accessible"
      condition: "equals"
      values: [true]
    severity: "High"
    stride: "Information Disclosure"
    description: >
      The RDS instance is configured as publicly accessible. Although security
      groups can restrict traffic, the instance will have a public IP and be
      visible on the internet, significantly increasing the attack surface.
    mitigation: >
      Set publicly_accessible = false and place the instance in private subnets:
        resource "aws_db_instance" "example" {
          publicly_accessible = false
          db_subnet_group_name = aws_db_subnet_group.private.name
        }
    references:
      - "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_VPC.WorkingWithRDSInstanceinaVPC.html"
      - "CIS AWS Benchmark v2.0.0 - 2.3.2"
    tags: ["rds", "public-access", "database", "network"]

  - id: TMAC-AWS-RDS-003
    name: "RDS Database without Multi-AZ Enabled"
    resource_type: "aws_db_instance"
    check:
      attribute: "multi_az"
      condition: "not_exists"
      values: []
    severity: "High"
    stride: "Denial of Service"
    description: >
      The RDS instance does not have Multi-AZ deployment enabled. This means the
      database is a single point of failure (SPOF). In the event of an availability
      zone outage, the application will suffer a Denial of Service (DoS).
    mitigation: >
      Configure 'multi_az = true' for production deployments to ensure high availability:
        resource "aws_db_instance" "example" {
          # ...
          multi_az = true
        }
    references:
      - "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html"
    tags: ["rds", "availability", "multi-az", "dos"]

  - id: TMAC-AWS-RDS-004
    name: "RDS Instance without Deletion Protection"
    resource_type: "aws_db_instance"
    check:
      attribute: "deletion_protection"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Tampering"
    description: >
      Accidental deletion protection ('deletion_protection') is disabled or not
      explicitly configured. This allows the database to be deleted easily, which
      could cause irreversible data loss through negligence or malicious tampering.
    mitigation: >
      Enable 'deletion_protection' on production databases to enforce safe deletion locks:
        resource "aws_db_instance" "example" {
          # ...
          deletion_protection = true
        }
    references:
      - "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_DeleteInstance.html"
    tags: ["rds", "data-loss", "tampering", "protection"]

  - id: TMAC-AWS-RDS-005
    name: "RDS without IAM Authentication Enabled"
    resource_type: "aws_db_instance"
    check:
      attribute: "iam_database_authentication_enabled"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Spoofing"
    description: >
      The RDS instance relies entirely on embedded static passwords, with no
      integration with AWS IAM. This raises the risk of credential theft and
      Spoofing due to the lack of automated rotation and granular permissions.
    mitigation: >
      Use IAM Database Authentication to map database users to temporary IAM roles:
        resource "aws_db_instance" "example" {
          # ...
          iam_database_authentication_enabled = true
        }
    references:
      - "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.IAMDBAuth.html"
      - "CIS AWS Benchmark v2.0.0 - 2.3.3"
    tags: ["rds", "iam", "authentication", "spoofing"]

  # ============================================================
  # SECTION: DATABASES (DYNAMODB)
  # ============================================================

  - id: TMAC-AWS-DDB-001
    name: "DynamoDB Table without Point-In-Time Recovery (PITR)"
    resource_type: "aws_dynamodb_table"
    check:
      attribute: "point_in_time_recovery"
      condition: "not_exists"
      values: []
    severity: "High"
    stride: "Tampering"
    description: >
      The DynamoDB table does not have Point-In-Time Recovery (PITR) enabled.
      Without PITR, you are not protected against accidental or malicious deletions or
      modifications (Tampering) of the table items. Someone could corrupt the data or ransomware
      could encrypt it, and there would be no direct way to revert the table to its previous state.
    mitigation: >
      Enable PITR by adding the corresponding block in the table definition:
        resource "aws_dynamodb_table" "example" {
          # ...
          point_in_time_recovery {
            enabled = true
          }
        }
    references:
      - "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/PointInTimeRecovery.html"
    tags: ["dynamodb", "nosql", "backup", "data-loss", "tampering"]

  - id: TMAC-AWS-DDB-002
    name: "DynamoDB Table without a CMK for Encryption (Server-Side Encryption)"
    resource_type: "aws_dynamodb_table"
    check:
      attribute: "server_side_encryption"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      DynamoDB encrypts data by default using an AWS-owned key, but a stronger
      security mechanism dictates using an AWS Managed CMK or Customer Managed CMK (CMK)
      to achieve real segregation of cryptographic responsibilities, thereby
      preventing Information Disclosure by having deep auditing (CloudTrail)
      over who decrypts the data.
    mitigation: >
      Explicitly enable the 'server_side_encryption' block using a managed KMS key:
        resource "aws_dynamodb_table" "example" {
          # ...
          server_side_encryption {
            enabled     = true
            kms_key_arn = aws_kms_key.ddb_key.arn
          }
        }
    references:
      - "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/EncryptionAtRest.html"
    tags: ["dynamodb", "encryption", "kms", "data-at-rest"]

  - id: TMAC-AWS-DDB-003
    name: "DynamoDB Table without Deletion Protection"
    resource_type: "aws_dynamodb_table"
    check:
      attribute: "deletion_protection_enabled"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Tampering"
    description: >
      Deletion protection ('deletion_protection_enabled') is not enabled for this
      DynamoDB table. As with RDS, allowing the table to be freely deleted exposes
      the organization to a catastrophic risk of DoS and Tampering if the IaC
      environment is compromised or tampered with.
    mitigation: >
      Enable 'deletion_protection_enabled' for production databases:
        resource "aws_dynamodb_table" "example" {
          # ...
          deletion_protection_enabled = true
        }
    references:
      - "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/WorkingWithTables.Basics.html#WorkingWithTables.Basics.DeletionProtection"
    tags: ["dynamodb", "data-loss", "tampering", "protection"]

  # ============================================================
  # SECTION: CLOUDTRAIL (AUDIT)
  # ============================================================

  - id: TMAC-AWS-CW-001
    name: "CloudTrail without Management Event Logging"
    resource_type: "aws_cloudtrail"
    check:
      attribute: "enable_logging"
      condition: "equals"
      values: [false]
    severity: "Medium"
    stride: "Repudiation"
    description: >
      CloudTrail does not have management event logging enabled. Without API call
      auditing, it is not possible to detect suspicious activity, investigate
      incidents, or meet regulatory traceability requirements.
    mitigation: >
      Enable CloudTrail with management event logging and data events for critical
      services:
        resource "aws_cloudtrail" "main" {
          name           = "main-trail"
          s3_bucket_name = aws_s3_bucket.trail.id
          enable_logging = true
          is_multi_region_trail = true
          include_global_service_events = true
        }
    references:
      - "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-create-and-update-a-trail.html"
      - "CIS AWS Benchmark v2.0.0 - 3.1"
    tags: ["cloudtrail", "logging", "audit", "compliance", "monitoring"]

  # ============================================================
  # SECTION: COMPUTE (SERVERLESS / LAMBDA)
  # ============================================================

  - id: TMAC-AWS-LMD-001
    name: "Public, Unauthenticated Lambda URL"
    resource_type: "aws_lambda_function_url"
    check:
      attribute: "authorization_type"
      condition: "equals"
      values: ["NONE"]
    severity: "Critical"
    stride: "Spoofing"
    description: >
      The Lambda function has a public invocation URL ('Function URL') configured
      with authorization type 'NONE'. This allows any anonymous user on the internet
      to invoke your function repeatedly (identity Spoofing), potentially
      extracting sensitive data and escalating privileges if the lambda's role is too permissive.
    mitigation: >
      Change the 'authorization_type' to 'AWS_IAM' to force request signing (SigV4),
      or use an API Gateway with an Authorizer (Cognito, JWT) instead for public traffic:
        resource "aws_lambda_function_url" "example" {
          function_name      = aws_lambda_function.example.function_name
          authorization_type = "AWS_IAM"
        }
    references:
      - "https://docs.aws.amazon.com/lambda/latest/dg/urls-auth.html"
    tags: ["lambda", "serverless", "unauthenticated", "spoofing"]

  - id: TMAC-AWS-LMD-002
    name: "Lambda without Tracing Configuration (X-Ray)"
    resource_type: "aws_lambda_function"
    check:
      attribute: "tracing_config"
      condition: "not_exists"
      values: []
    severity: "Low"
    stride: "Repudiation"
    description: >
      The Lambda function does not have Active Tracing with AWS X-Ray enabled.
      In distributed, event-driven architectures (Process), the lack of tracing
      makes it impossible to track the flow of requests along the chain,
      fostering Repudiation issues if the attacker hides their steps.
    mitigation: >
      Add the 'tracing_config' block and set it to 'Active'. Also ensure that the
      Lambda's Execution Role has permissions to write to X-Ray:
        resource "aws_lambda_function" "example" {
          # ...
          tracing_config {
            mode = "Active"
          }
        }
    references:
      - "https://docs.aws.amazon.com/lambda/latest/dg/services-xray.html"
    tags: ["lambda", "serverless", "tracing", "audit"]

  - id: TMAC-AWS-LMD-003
    name: "Lambda without a Concurrency Limit (Financial DoS)"
    resource_type: "aws_lambda_function"
    check:
      attribute: "reserved_concurrent_executions"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Denial of Service"
    description: >
      The Lambda function has no 'reserved_concurrent_executions' limit. By sharing
      the AWS account's default concurrency pool, an attacker who forces mass
      invocations (DDoS) will exhaust the account's global concurrency, taking down
      other parallel services and generating a sky-high bill (Financial DoS).
    mitigation: >
      Explicitly limit the maximum number of concurrent instances the function can
      scale to, according to its expected load:
        resource "aws_lambda_function" "example" {
          # ...
          reserved_concurrent_executions = 50
        }
    references:
      - "https://docs.aws.amazon.com/lambda/latest/dg/configuration-concurrency.html"
    tags: ["lambda", "serverless", "dos", "availability", "financial-dos"]

  # ============================================================
  # SECTION: NETWORKING & CONTENT DELIVERY (API GATEWAY)
  # ============================================================

  - id: TMAC-AWS-APIGW-001
    name: "API Gateway Method without Authorization"
    resource_type: "aws_api_gateway_method"
    check:
      attribute: "authorization"
      condition: "equals"
      values: ["NONE"]
    severity: "Critical"
    stride: "Spoofing"
    description: >
      An endpoint in your REST API Gateway has the authorization type set to 'NONE'.
      This allows any anonymous entity or attacker to call your API (unvalidated
      identity / Spoofing), opening the door to data injection, massive information
      leakage and financial abuse in the backend.
    mitigation: >
      Implement 'AWS_IAM', a 'COGNITO_USER_POOLS' authorizer or a 'CUSTOM' authorizer
      (Lambda). If the endpoint MUST be public, ensure that the backend functions
      behind the API Gateway assume least-privilege roles with no access to sensitive data:
        resource "aws_api_gateway_method" "example" {
          # ...
          authorization = "COGNITO_USER_POOLS"
          authorizer_id = aws_api_gateway_authorizer.example.id
        }
    references:
      - "https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-control-access-to-api.html"
      - "CIS AWS Benchmark v2.0.0 - 5.1"
    tags: ["apigateway", "unauthenticated", "spoofing", "api-security"]

  - id: TMAC-AWS-APIGW-002
    name: "API Gateway Stage without Access Logging"
    resource_type: "aws_api_gateway_stage"
    check:
      attribute: "access_log_settings"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Repudiation"
    description: >
      The API Gateway execution Stage does not have 'access_log_settings'. As the
      main HTTP entry point, lacking API-level access logs facilitates Repudiation:
      an attacker exploiting the service will leave no auditable traces of their IP,
      the endpoints queried or the bandwidth consumed.
    mitigation: >
      Configure a CloudWatch log group and add it to the Stage settings, explicitly
      defining the format you want to capture (e.g. JSON):
        resource "aws_api_gateway_stage" "example" {
          # ...
          access_log_settings {
            destination_arn = aws_cloudwatch_log_group.example.arn
            format          = jsonencode({ ... })
          }
        }
    references:
      - "https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-logging.html"
    tags: ["apigateway", "logging", "audit", "compliance"]

  - id: TMAC-AWS-APIGW-003
    name: "API Gateway Stage without X-Ray Tracing"
    resource_type: "aws_api_gateway_stage"
    check:
      attribute: "xray_tracing_enabled"
      condition: "equals"
      values: [false]
    severity: "Low"
    stride: "Repudiation"
    description: >
      The AWS X-Ray Active Tracing feature is disabled (or not configured) on this
      API Gateway Stage. As with Lambdas, the absence of traces severely limits the
      identification and correlation of distributed attacks across underlying
      components (Repudiation and lack of observability).
    mitigation: >
      Enable 'xray_tracing_enabled' on the Stage to generate a clear map of
      latencies and dependencies in your API calls:
        resource "aws_api_gateway_stage" "example" {
          # ...
          xray_tracing_enabled = true
        }
    references:
      - "https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-xray.html"
    tags: ["apigateway", "tracing", "observability", "x-ray"]

  # ============================================================
  # SECTION: SECURITY & IDENTITY (KMS)
  # ============================================================

  - id: TMAC-AWS-KMS-001
    name: "KMS Key without Automatic Rotation Enabled"
    resource_type: "aws_kms_key"
    check:
      attribute: "enable_key_rotation"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The AWS KMS customer master key (CMK) does not have automatic annual rotation
      enabled. The lack of cryptographic rotation increases the potential impact if
      the underlying cryptographic material is compromised (Information Disclosure),
      contravening institutional best practices.
    mitigation: >
      Enable 'enable_key_rotation = true'. KMS will automatically rotate the
      cryptographic material every year, retaining the history to decrypt old data:
        resource "aws_kms_key" "example" {
          description             = "My CMK"
          enable_key_rotation     = true
        }
    references:
      - "https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html"
      - "CIS AWS Benchmark v2.0.0 - 2.8"
    tags: ["kms", "encryption", "rotation", "compliance"]

  - id: TMAC-AWS-KMS-002
    name: "KMS Key in a Pending Deletion State"
    resource_type: "aws_kms_key"
    check:
      attribute: "is_enabled"
      condition: "equals"
      values: [false]
    severity: "Medium"
    stride: "Denial of Service"
    description: >
      The CMK is explicitly disabled in code ('is_enabled = false'). If the key is
      tied to production EBS, RDS or S3 volumes, turning off a master key
      immediately causes a massive Denial of Service (DoS), since no service will be
      able to access the encrypted data.
    mitigation: >
      Ensure that 'is_enabled' is true for normal operations. If you are
      decommissioning the key, first verify all dependencies using CloudTrail and Macie.
    references:
      - "https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html"
    tags: ["kms", "availability", "dos", "data-access"]

  - id: TMAC-AWS-KMS-003
    name: "KMS Policy Open to the Public"
    resource_type: "aws_kms_key"
    check:
      attribute: "policy"
      condition: "contains"
      values: ['"Principal": "*"']
    severity: "Critical"
    stride: "Information Disclosure"
    description: >
      The policy attached to the CMK (Key Policy) trusts 'Principal: *', potentially
      authorizing public or cross-account access to encryption or decryption operations.
      This enables severe confidentiality violations (Information Disclosure / Spoofing).
    mitigation: >
      Explicitly limit the Principal to the AWS account root, and use IAM Roles or
      Key Grants to grant least-privilege access:
        "Principal": {
          "AWS": "arn:aws:iam::111122223333:root"
        }
    references:
      - "https://docs.aws.amazon.com/kms/latest/developerguide/key-policies.html"
    tags: ["kms", "policy", "public-access"]

  # ============================================================
  # SECTION: APPLICATION INTEGRATION (SQS, SNS, SES)
  # ============================================================

  - id: TMAC-AWS-SQS-001
    name: "SQS Queue without Encryption (Server-Side Encryption KMS)"
    resource_type: "aws_sqs_queue"
    check:
      attribute: "kms_master_key_id"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The SQS message queue does not use a KMS Customer Managed Key (CMK) for its
      KMS encryption ('kms_master_key_id'). Messages with sensitive information in transit
      through the event bus could be intercepted or exposed to unauthorized analytical
      access (Information Disclosure).
    mitigation: >
      Add the 'kms_master_key_id' property (or rely on 'sqs_managed_sse_enabled' if
      your posture allows it, although KMS is more auditable):
        resource "aws_sqs_queue" "example" {
          # ...
          kms_master_key_id = aws_kms_key.sqs_key.arn
        }
    references:
      - "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-server-side-encryption.html"
    tags: ["sqs", "encryption", "messaging"]

  - id: TMAC-AWS-SQS-002
    name: "SQS Policy Open to the Public"
    resource_type: "aws_sqs_queue_policy"
    check:
      attribute: "policy"
      condition: "contains"
      values: ['"Principal": "*"']
    severity: "Critical"
    stride: "Spoofing"
    description: >
      The policy attached to the queue (Queue Policy) allows any source ('Principal: *')
      to interact with it. This exposes the system to mass injection of junk messages (Spoofing)
      or exposure of the event queue to third parties.
    mitigation: >
      Replace the '*' wildcard with the exact ARN of the resource that produces messages (e.g. a specific
      SNS Topic, or another role):
        "Principal": { "AWS": "arn:aws:iam::111122223333:role/Producer" }
    references:
      - "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-basic-architecture.html"
    tags: ["sqs", "policy", "public-access"]

  - id: TMAC-AWS-SNS-001
    name: "SNS Topic without Encryption (KMS)"
    resource_type: "aws_sns_topic"
    check:
      attribute: "kms_master_key_id"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The Amazon SNS Topic is not encrypted at rest or does not use a KMS CMK.
      Any published message will be processed in plaintext within the service
      infrastructure, increasing the risk surface against eavesdropping or Data Leakage (Info Disclosure).
    mitigation: >
      Apply a valid KMS key using the 'kms_master_key_id' attribute:
        resource "aws_sns_topic" "example" {
          # ...
          kms_master_key_id = aws_kms_key.sns_key.id
        }
    references:
      - "https://docs.aws.amazon.com/sns/latest/dg/sns-server-side-encryption.html"
    tags: ["sns", "encryption", "messaging"]

  - id: TMAC-AWS-SNS-002
    name: "SNS Policy Open to the Public"
    resource_type: "aws_sns_topic_policy"
    check:
      attribute: "policy"
      condition: "contains"
      values: ['"Principal": "*"']
    severity: "Critical"
    stride: "Elevation of Privilege"
    description: >
      The SNS policy has 'Principal: *', which virtually grants global permission
      to Subscribe to or Publish on this Topic to the entire internet. This represents a severe
      Elevation of Privilege, poisoning of subscribed consumers and leakage of the pub/sub bus.
    mitigation: >
      Set the Principals explicitly to the corresponding accounts or services (AWS IAM Identity).
    references:
      - "https://docs.aws.amazon.com/sns/latest/dg/sns-access-policy-use-cases.html"
    tags: ["sns", "policy", "public-access"]

  - id: TMAC-AWS-SES-001
    name: "SES Receipt Rule without Enforcing TLS (Insecure Transit)"
    resource_type: "aws_ses_receipt_rule"
    check:
      attribute: "tls_policy"
      condition: "equals"
      values: ["Optional"]
    severity: "High"
    stride: "Information Disclosure"
    description: >
      The Amazon SES (Simple Email Service) receipt rule explicitly accepts the TLS policy 'Optional'.
      If a sender sends from an unencrypted server, SES will accept the email in plaintext,
      enabling a Man-In-The-Middle interception and leakage of the content (Information Disclosure).
    mitigation: >
      Change 'tls_policy' to 'Require'. This makes the AWS MTA return a bounce and reject the transfer
      if the incoming email connection is not encrypted via Transport Layer Security.
    references:
      - "https://docs.aws.amazon.com/ses/latest/dg/receiving-email-receipt-rules-console-walkthrough.html"
    tags: ["ses", "email", "tls", "transit"]

  # ============================================================
  # SECTION: STORAGE AUXILIARY (BACKUP, EFS, FSx, STORAGE GATEWAY)
  # ============================================================

  - id: TMAC-AWS-BKP-001
    name: "AWS Backup Vault without Encryption (KMS)"
    resource_type: "aws_backup_vault"
    check:
      attribute: "kms_key_arn"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The AWS Backup Vault does not use a custom KMS key (Customer Managed Key).
      This prevents separating encryption responsibilities and hinders auditing of
      who accesses to decrypt the backups (Information Disclosure / Tampering).
    mitigation: >
      Assign a valid KMS key using the 'kms_key_arn' attribute:
        resource "aws_backup_vault" "example" {
          name        = "example_backup_vault"
          kms_key_arn = aws_kms_key.example.arn
        }
    references:
      - "https://docs.aws.amazon.com/aws-backup/latest/devguide/encryption.html"
    tags: ["backup", "encryption", "kms", "storage"]

  - id: TMAC-AWS-EFS-001
    name: "Amazon EFS without Encryption at Rest Enabled"
    resource_type: "aws_efs_file_system"
    check:
      attribute: "encrypted"
      condition: "not_exists"
      values: []
    severity: "High"
    stride: "Information Disclosure"
    description: >
      The Amazon Elastic File System (EFS) file system does not have the
      'encrypted = true' property configured. The lack of encryption at rest exposes the shared volume to
      data leakage attacks (Information Disclosure) if there are access-control gaps at the network or compute layer.
    mitigation: >
      Set 'encrypted' to true and preferably provide a 'kms_key_id':
        resource "aws_efs_file_system" "example" {
          encrypted  = true
          kms_key_id = aws_kms_key.example.arn
        }
    references:
      - "https://docs.aws.amazon.com/efs/latest/ug/encryption-at-rest.html"
    tags: ["efs", "encryption", "storage"]

  - id: TMAC-AWS-FSX-001
    name: "Amazon FSx (Windows) without Managed Encryption"
    resource_type: "aws_fsx_windows_file_system"
    check:
      attribute: "kms_key_id"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The Amazon FSx for Windows file server file system does not have a 'kms_key_id' specified. As with
      EFS and EBS, delegating file system encryption to default keys limits auditability.
    mitigation: >
      Include 'kms_key_id' pointing to a CMK key:
        resource "aws_fsx_windows_file_system" "example" {
          # ...
          kms_key_id = aws_kms_key.example.arn
        }
    references:
      - "https://docs.aws.amazon.com/fsx/latest/WindowsGuide/encryption-in-transit-and-rest.html"
    tags: ["fsx", "encryption", "storage", "windows"]

  - id: TMAC-AWS-FSX-002
    name: "Amazon FSx (Lustre) without Managed Encryption"
    resource_type: "aws_fsx_lustre_file_system"
    check:
      attribute: "kms_key_id"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The Amazon FSx for Lustre (HPC) file system lacks an explicit 'kms_key_id', putting
      the high-performance computing datasets at risk.
    mitigation: >
      Include 'kms_key_id' in the Terraform definition.
    references:
      - "https://docs.aws.amazon.com/fsx/latest/LustreGuide/encryption-in-transit-and-rest.html"
    tags: ["fsx", "encryption", "storage", "lustre"]

  - id: TMAC-AWS-SGW-001
    name: "AWS Storage Gateway (SMB Share) without KMSEncrypted"
    resource_type: "aws_storagegateway_smb_file_share"
    check:
      attribute: "kms_encrypted"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The network share exposed by AWS Storage Gateway does not request KMS-managed
      encryption ('kms_encrypted'), exposing local cache or transfer data to theft.
    mitigation: >
      Set 'kms_encrypted = true' and provide 'kms_key_arn'.
    references:
      - "https://docs.aws.amazon.com/filegateway/latest/files3/encryption.html"
    tags: ["storage-gateway", "encryption", "storage"]

  # ============================================================
  # SECTION: MANAGEMENT & GOVERNANCE
  # ============================================================

  - id: TMAC-AWS-ASG-001
    name: "Auto Scaling Group Limited to a Single Zone (SPOF)"
    resource_type: "aws_autoscaling_group"
    check:
      attribute: "vpc_zone_identifier"
      condition: "not_exists"
      values: []
    severity: "High"
    stride: "Denial of Service"
    description: >
      The Auto Scaling group does not specify multiple subnets ('vpc_zone_identifier' or
      'availability_zones'). Deploying all instances in a single AZ creates a single
      point of failure. If the zone goes down, the service suffers a Denial of Service.
    mitigation: >
      Add multiple subnets from different availability zones:
        resource "aws_autoscaling_group" "example" {
          # ...
          vpc_zone_identifier = [aws_subnet.az1.id, aws_subnet.az2.id]
        }
    references:
      - "https://docs.aws.amazon.com/autoscaling/ec2/userguide/auto-scaling-benefits.html"
    tags: ["autoscaling", "availability", "dos"]

  - id: TMAC-AWS-CWL-001
    name: "CloudWatch Log Group without Encryption"
    resource_type: "aws_cloudwatch_log_group"
    check:
      attribute: "kms_key_id"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The CloudWatch Log Group stores miscellaneous application and infrastructure logs
      in plaintext or with default encryption. The lack of its own KMS key ('kms_key_id')
      opens Information Disclosure vectors if attackers gain read access to CloudWatch.
    mitigation: >
      Apply a valid KMS key:
        resource "aws_cloudwatch_log_group" "example" {
          # ...
          kms_key_id = aws_kms_key.logs_key.arn
        }
    references:
      - "https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/encrypt-log-data-kms.html"
    tags: ["cloudwatch", "logging", "encryption"]

  - id: TMAC-AWS-CFG-001
    name: "AWS Config Recorder Disabled"
    resource_type: "aws_config_configuration_recorder"
    check:
      attribute: "recording_group.all_supported"
      condition: "equals"
      values: [false]
    severity: "Medium"
    stride: "Repudiation"
    description: >
      The AWS Config recorder is not storing all supported resources
      ('all_supported = false'). By limiting the recording scope, you lose traceability
      over changes to key security configurations, introducing a Repudiation risk
      (being unable to prove who changed what and when).
    mitigation: >
      Turn on global capture:
        resource "aws_config_configuration_recorder" "example" {
          recording_group {
            all_supported                 = true
            include_global_resource_types = true
          }
        }
    references:
      - "https://docs.aws.amazon.com/config/latest/developerguide/select-resources.html"
    tags: ["config", "audit", "compliance"]

  - id: TMAC-AWS-SSM-001
    name: "SSM Parameter without Encryption (Not a SecureString)"
    resource_type: "aws_ssm_parameter"
    check:
      attribute: "type"
      condition: "equals"
      values: ["String"]
    severity: "High"
    stride: "Information Disclosure"
    description: >
      A parameter in AWS Systems Manager Parameter Store is configured as 'String'.
      If this parameter stores secrets, passwords or API tokens, they will be readable
      in plaintext by any user with basic SSM permissions (Information Disclosure).
    mitigation: >
      Change the type to 'SecureString' to use default or custom KMS encryption:
        resource "aws_ssm_parameter" "secret" {
          type  = "SecureString"
          value = "my-secret-password"
        }
    references:
      - "https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html"
    tags: ["ssm", "secrets", "encryption"]

  - id: TMAC-AWS-ORG-001
    name: "AWS Organizations without SCPs Enabled"
    resource_type: "aws_organizations_organization"
    check:
      attribute: "feature_set"
      condition: "equals"
      values: ["CONSOLIDATED_BILLING"]
    severity: "High"
    stride: "Elevation of Privilege"
    description: >
      The organization is configured purely for billing consolidation
      (CONSOLIDATED_BILLING) instead of all features (ALL). This prevents you from
      using Service Control Policies (SCPs) to limit privileges at the root level,
      enabling a massive Elevation of Privilege across underlying accounts.
    mitigation: >
      Enable the full feature_set:
        resource "aws_organizations_organization" "example" {
          feature_set = "ALL"
        }
    references:
      - "https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_org_support-all-features.html"
    tags: ["organizations", "scp", "privilege-escalation", "governance"]

  - id: TMAC-AWS-CFN-001
    name: "CloudFormation Stack without Termination Protection"
    resource_type: "aws_cloudformation_stack"
    check:
      attribute: "disable_rollback"
      condition: "not_exists"
      values: []
    severity: "Low"
    stride: "Tampering"
    description: >
      The stack does not have explicit protection or safe rollback policies defined.
      Without termination protection (not directly operable via tf but evaluable in broader contexts),
      malicious actors could delete the entire base-infrastructure stack (Tampering / DoS).
    mitigation: >
      Configure restrictive Stack policies, or define execution roles.
    references:
      - "https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-protect-stacks.html"
    tags: ["cloudformation", "tampering", "governance"]

  # ============================================================
  # SECTION: FRONT-END WEB & MOBILE
  # ============================================================

  - id: TMAC-AWS-APPSYNC-001
    name: "AppSync GraphQL API without Logging (Field-Level Logs)"
    resource_type: "aws_appsync_graphql_api"
    check:
      attribute: "log_config"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Repudiation"
    description: >
      The AWS AppSync (GraphQL) API does not have the 'log_config' block configured.
      By not sending GraphQL execution and query logs to CloudWatch Logs,
      you lose track of activity and resolver errors, fostering Repudiation.
    mitigation: >
      Add the 'log_config' block pointing to the ARN of an IAM role that allows writing to CloudWatch Logs:
        resource "aws_appsync_graphql_api" "example" {
          # ...
          log_config {
            cloudwatch_logs_role_arn = aws_iam_role.appsync_logs.arn
            field_log_level          = "ALL"
          }
        }
    references:
      - "https://docs.aws.amazon.com/appsync/latest/devguide/monitoring.html"
    tags: ["appsync", "graphql", "logging", "audit"]

  - id: TMAC-AWS-AMP-001
    name: "Public AWS Amplify Branch (Exposed Environment)"
    resource_type: "aws_amplify_branch"
    check:
      attribute: "enable_basic_auth"
      condition: "not_exists"
      values: []
    severity: "Low"
    stride: "Information Disclosure"
    description: >
      Your AWS Amplify application branch (usually dev or staging) does not have
      'enable_basic_auth' enabled. Exposing non-production environments to the internet anonymously allows
      attackers to scan beta versions of your frontend for keys, vulnerabilities,
      or design leaks (Information Disclosure / environment Spoofing).
    mitigation: >
      For staging or development branches, enable basic authentication by configuring its credentials:
        resource "aws_amplify_branch" "staging" {
          # ...
          enable_basic_auth = true
        }
    references:
      - "https://docs.aws.amazon.com/amplify/latest/userguide/access-control.html"
    tags: ["amplify", "frontend", "auth", "exposure"]

  - id: TMAC-AWS-LOC-001
    name: "Amazon Location Tracker without Managed Encryption (KMS)"
    resource_type: "aws_location_tracker"
    check:
      attribute: "kms_key_id"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      Amazon Location Service is storing device location tracking data (Trackers)
      without the protection of a KMS Customer Managed Key ('kms_key_id' absent). Geographic
      tracking positions are critical Personally Identifiable Information (PII), and must be encrypted
      and audited restrictively.
    mitigation: >
      Associate a KMS key to protect the data at rest and in transit:
        resource "aws_location_tracker" "example" {
          tracker_name = "example"
          kms_key_id   = aws_kms_key.location_key.arn
        }
    references:
      - "https://docs.aws.amazon.com/location/latest/developerguide/encryption-at-rest.html"
    tags: ["location", "pii", "encryption"]

  - id: TMAC-AWS-DF-001
    name: "Device Farm Project outside the Private Environment (VPC)"
    resource_type: "aws_devicefarm_project"
    check:
      attribute: "vpc_config"
      condition: "not_exists"
      values: []
    severity: "Low"
    stride: "Information Disclosure"
    description: >
      AWS Device Farm is running application tests on Amazon's device cloud
      omitting a 'vpc_config' block. Without a strict VPC configuration, the traffic between the
      remote physical devices and the backend test instances travels exposed, increasing
      the risk of leakage or interception of enterprise application prototype traffic.
    mitigation: >
      Encapsulate Device Farm tests by routing the traffic to the subnets of your isolated
      private environments by adding 'vpc_config':
        resource "aws_devicefarm_project" "example" {
          name = "example"
          # ...
          vpc_config {
            security_group_ids = [aws_security_group.example.id]
            subnet_ids         = [aws_subnet.example.id]
            vpc_id             = aws_vpc.example.id
          }
        }
    references:
      - "https://docs.aws.amazon.com/devicefarm/latest/developerguide/amazon-vpc.html"
    tags: ["device-farm", "testing", "vpc", "network-isolation"]

  # ============================================================
  # SECTION: DATABASES (SPECIALIZED & IN-MEMORY)
  # ============================================================

  - id: TMAC-AWS-AURORA-001
    name: "Amazon Aurora Cluster without Encryption"
    resource_type: "aws_rds_cluster"
    check:
      attribute: "storage_encrypted"
      condition: "not_exists"
      values: []
    severity: "High"
    stride: "Information Disclosure"
    description: >
      The Amazon Aurora cluster does not have encryption at rest enabled ('storage_encrypted').
      Leaving the distributed relational database information in plaintext allows
      theft of the underlying data in the event of operational breaches or exposed snapshots.
    mitigation: >
      Enable 'storage_encrypted = true' and define the 'kms_key_id':
        resource "aws_rds_cluster" "example" {
          storage_encrypted = true
          kms_key_id        = aws_kms_key.example.arn
        }
    references:
      - "https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Overview.Encryption.html"
    tags: ["aurora", "rds", "encryption", "database"]

  - id: TMAC-AWS-DOCDB-001
    name: "Amazon DocumentDB Cluster without Encryption"
    resource_type: "aws_docdb_cluster"
    check:
      attribute: "storage_encrypted"
      condition: "not_exists"
      values: []
    severity: "High"
    stride: "Information Disclosure"
    description: >
      The Amazon DocumentDB NoSQL database cluster (MongoDB-compatible) lacks
      the 'storage_encrypted = true' property. The JSON document collection remains
      without cryptographic protection against exfiltration.
    mitigation: >
      Apply encryption at rest to the cluster:
        resource "aws_docdb_cluster" "example" {
          storage_encrypted = true
          kms_key_id        = aws_kms_key.example.arn
        }
    references:
      - "https://docs.aws.amazon.com/documentdb/latest/developerguide/encryption-at-rest.html"
    tags: ["documentdb", "mongodb", "encryption"]

  - id: TMAC-AWS-NEPTUNE-001
    name: "Amazon Neptune Cluster without Encryption"
    resource_type: "aws_neptune_cluster"
    check:
      attribute: "storage_encrypted"
      condition: "not_exists"
      values: []
    severity: "High"
    stride: "Information Disclosure"
    description: >
      The Amazon Neptune graph database cluster does not have encryption at rest.
      The logical relationships (edges/nodes) of the enterprise graph are crucial proprietary information that
      is left vulnerable (Info Disclosure).
    mitigation: >
      Set 'storage_encrypted' to true for Amazon Neptune.
    references:
      - "https://docs.aws.amazon.com/neptune/latest/userguide/encrypt-at-rest.html"
    tags: ["neptune", "graph", "encryption"]

  - id: TMAC-AWS-ELASTI-001
    name: "ElastiCache (Redis) without Encryption at Rest and in Transit"
    resource_type: "aws_elasticache_replication_group"
    check:
      attribute: "at_rest_encryption_enabled"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The Amazon ElastiCache replication group (usually Redis or Memcached) does not have
      encryption configured ('at_rest_encryption_enabled' and 'transit_encryption_enabled'). Memory dumps and backlogs
      can be captured raw if an attacker breaks into the network.
    mitigation: >
      Enable full encryption to safeguard cache sessions:
        resource "aws_elasticache_replication_group" "example" {
          # ...
          at_rest_encryption_enabled = true
          transit_encryption_enabled = true
          kms_key_id                 = aws_kms_key.example.arn
        }
    references:
      - "https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/at-rest-encryption.html"
    tags: ["elasticache", "redis", "encryption", "in-memory"]

  - id: TMAC-AWS-MEMDB-001
    name: "Amazon MemoryDB without Encryption"
    resource_type: "aws_memorydb_cluster"
    check:
      attribute: "tls_enabled"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The Amazon MemoryDB for Redis cluster does not have encryption in transit.
    mitigation: >
      Configure 'tls_enabled = true' and associate a KMS parameter.
    references:
      - "https://docs.aws.amazon.com/memorydb/latest/devguide/encryption.html"
    tags: ["memorydb", "redis", "encryption"]

  - id: TMAC-AWS-TIME-001
    name: "Amazon Timestream Database without a CMK Key"
    resource_type: "aws_timestreamwrite_database"
    check:
      attribute: "kms_key_id"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The Amazon Timestream time-series database (IoT/Analytics) has not explicitly designated
      a customer KMS CMK key for its protection.
    mitigation: >
      Specify the 'kms_key_id' property on the Timestream database.
    references:
      - "https://docs.aws.amazon.com/timestream/latest/developerguide/encryption-at-rest.html"
    tags: ["timestream", "time-series", "encryption"]

  - id: TMAC-AWS-KEYS-001
    name: "Amazon Keyspaces (Cassandra) without Encryption"
    resource_type: "aws_keyspaces_keyspace"
    check:
      attribute: "tags" # Encryption is frequently handled on the Tables, not on the Keyspace directly (KMS default)
      condition: "not_exists"
      values: []
    severity: "Low"
    stride: "Information Disclosure"
    description: >
      [Informational Notice] Amazon Keyspaces encrypts its data at rest natively with no
      option to disable it. However, in the IaC environment it is crucial to verify encryption
      at the table/column level. Extended configuration is missing in the IaC attributes.
    mitigation: >
      Apply Resource tags and verify the specific Keyspace Tables.
    references:
      - "https://docs.aws.amazon.com/keyspaces/latest/devguide/EncryptionAtRest.html"
    tags: ["keyspaces", "cassandra", "encryption"]

  # ============================================================
  # SECTION: CONTAINERS (ECR, ECS, EKS)
  # ============================================================

  - id: TMAC-AWS-ECR-001
    name: "ECR Repository without Automatic Vulnerability Scanning"
    resource_type: "aws_ecr_repository"
    check:
      attribute: "image_scanning_configuration"
      condition: "not_exists"
      values: []
    severity: "High"
    stride: "Tampering"
    description: >
      The Amazon ECR repository does not have image scanning configured ('image_scanning_configuration').
      This allows containers with vulnerable or trojanized packages (Tampering/EoP) to be
      deployed directly to production without validation.
    mitigation: >
      Enable scanning at image push time:
        resource "aws_ecr_repository" "example" {
          # ...
          image_scanning_configuration {
            scan_on_push = true
          }
        }
    references:
      - "https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-scanning.html"
    tags: ["ecr", "containers", "scanning", "vulnerabilities"]

  - id: TMAC-AWS-ECR-002
    name: "ECR Repository with Mutable Image Tags"
    resource_type: "aws_ecr_repository"
    check:
      attribute: "image_tag_mutability"
      condition: "equals"
      values: ["MUTABLE"]
    severity: "Medium"
    stride: "Tampering"
    description: >
      The image tags in ECR allow mutability ('MUTABLE'). This means
      an attacker could overwrite the production image 'v1.0' with a malicious image
      under the exact same tag, achieving arbitrary code execution behind the back of the Git repository.
    mitigation: >
      Change 'image_tag_mutability' to 'IMMUTABLE':
        resource "aws_ecr_repository" "example" {
          # ...
          image_tag_mutability = "IMMUTABLE"
        }
    references:
      - "https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-tag-mutability.html"
    tags: ["ecr", "containers", "tampering", "immutability"]

  - id: TMAC-AWS-EKS-001
    name: "EKS Cluster with a Publicly Open Endpoint"
    resource_type: "aws_eks_cluster"
    check:
      attribute: "vpc_config.endpoint_public_access"
      condition: "equals"
      values: [true]
    severity: "Critical"
    stride: "Spoofing"
    description: >
      The Kubernetes cluster (AWS EKS) exposes its API Endpoint ('endpoint_public_access = true')
      to the entire internet. This provides a direct attack point against the control plane (Spoofing / DoS / EoP).
    mitigation: >
      Turn off public access or strongly restrict 'public_access_cidrs'. It is advisable
      to use 'endpoint_private_access = true' and access via VPN/Bastion:
        resource "aws_eks_cluster" "example" {
          # ...
          vpc_config {
            endpoint_public_access  = false
            endpoint_private_access = true
          }
        }
    references:
      - "https://docs.aws.amazon.com/eks/latest/userguide/cluster-endpoint.html"
    tags: ["eks", "kubernetes", "public-access", "network"]

  - id: TMAC-AWS-EKS-002
    name: "EKS Cluster without Secrets Encryption (KMS)"
    resource_type: "aws_eks_cluster"
    check:
      attribute: "encryption_config"
      condition: "not_exists"
      values: []
    severity: "High"
    stride: "Information Disclosure"
    description: >
      The EKS system stores native Kubernetes Secret resources ('secrets') in etcd
      in plaintext within the AWS EBS store. If 'encryption_config' is missing, a physical
      breach of etcd will directly expose pod credentials (Info Disclosure).
    mitigation: >
      Configure an encryption provider connected to AWS KMS:
        resource "aws_eks_cluster" "example" {
          # ...
          encryption_config {
            resources = ["secrets"]
            provider {
              key_arn = aws_kms_key.eks_key.arn
            }
          }
        }
    references:
      - "https://docs.aws.amazon.com/eks/latest/userguide/enable-kms.html"
    tags: ["eks", "kubernetes", "encryption", "secrets"]

  - id: TMAC-AWS-EKS-003
    name: "EKS Cluster without Component Logging (Control Plane)"
    resource_type: "aws_eks_cluster"
    check:
      attribute: "enabled_cluster_log_types"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Repudiation"
    description: >
      Logging for the EKS Control Plane API, audit and authenticator is disabled.
      It is impossible to detect suspicious cluster operations or investigate whether an attacker
      took control of etcd or the scheduler.
    mitigation: >
      Add 'enabled_cluster_log_types':
        resource "aws_eks_cluster" "example" {
          # ...
          enabled_cluster_log_types = ["api", "audit", "authenticator", "controllerManager", "scheduler"]
        }
    references:
      - "https://docs.aws.amazon.com/eks/latest/userguide/control-plane-logs.html"
    tags: ["eks", "kubernetes", "logging", "audit"]

  - id: TMAC-AWS-ECS-001
    name: "ECS Cluster without Container Insights"
    resource_type: "aws_ecs_cluster"
    check:
      attribute: "setting"
      condition: "not_exists"
      values: []
    severity: "Low"
    stride: "Repudiation"
    description: >
      The Amazon ECS (Elastic Container Service) cluster does not use CloudWatch Container Insights
      ('setting' absent). It causes loss of network observability and metrics in Fargate or EC2,
      affecting forensic diagnostics related to DoS or network intrusions.
    mitigation: >
      Add the Container Insights configuration:
        resource "aws_ecs_cluster" "example" {
          name = "example-cluster"
          setting {
            name  = "containerInsights"
            value = "enabled"
          }
        }
    references:
      - "https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/ContainerInsights.html"
    tags: ["ecs", "containers", "observability", "metrics"]

  # ============================================================
  # SECTION: COMPUTE (APP RUNNER, BATCH, ELASTIC BEANSTALK)
  # ============================================================

  - id: TMAC-AWS-APPR-001
    name: "App Runner Service Publicly Exposed (No VPC Ingress)"
    resource_type: "aws_apprunner_service"
    check:
      attribute: "network_configuration.ingress_configuration"
      condition: "not_exists"
      values: []
    severity: "High"
    stride: "Spoofing"
    description: >
      AWS App Runner by default exposes all web applications to the internet publicly.
      Lacking an 'ingress_configuration' means the application is not restricted to an
      internal VPC Endpoint, opening direct Spoofing vectors and injections into your front-end/API.
    mitigation: >
      Restrict inbound access using VPC configurations:
        resource "aws_apprunner_service" "example" {
          # ...
          network_configuration {
            ingress_configuration {
              is_publicly_accessible = false
            }
          }
        }
    references:
      - "https://docs.aws.amazon.com/apprunner/latest/dg/network-vpc.html"
    tags: ["apprunner", "compute", "networking", "exposure"]

  - id: TMAC-AWS-BCH-001
    name: "AWS Batch Compute with Public IP Assignment"
    resource_type: "aws_batch_compute_environment"
    check:
      attribute: "compute_resources.subnets" # We generally validate this or visibility, but the lack of an SG also applies. We will use a representative check.
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The AWS Batch compute environment does not have explicit assignments of isolated subnets
      or security groups ('compute_resources'). Launching batch-processing instances
      on insecure networks risks the leakage of mathematical and scientific results (Info Disclosure).
    mitigation: >
      Apply a strict private-subnet configuration:
        resource "aws_batch_compute_environment" "example" {
          compute_resources {
            subnets = [aws_subnet.private.id]
            security_group_ids = [aws_security_group.batch.id]
          }
        }
    references:
      - "https://docs.aws.amazon.com/batch/latest/userguide/compute_environments.html"
    tags: ["batch", "compute", "network", "isolation"]

  - id: TMAC-AWS-EB-001
    name: "Elastic Beanstalk without Managed Updates"
    resource_type: "aws_elastic_beanstalk_environment"
    check:
      attribute: "setting"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Tampering"
    description: >
      The AWS Elastic Beanstalk environment does not explicitly require enabling managed OS
      security patches and updates (Managed Updates). Staying on old platform versions
      lets attackers exploit CVEs in the underlying EC2 (Tampering / EoP).
    mitigation: >
      Add 'setting' blocks that enforce ManagedActionsEnabled:
        resource "aws_elastic_beanstalk_environment" "example" {
          setting {
            namespace = "aws:elasticbeanstalk:managedactions"
            name      = "ManagedActionsEnabled"
            value     = "true"
          }
        }
    references:
      - "https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/environment-mgmt-managed-updates.html"
    tags: ["elastic-beanstalk", "compute", "patching", "vulnerabilities"]

  - id: TMAC-AWS-IB-001
    name: "EC2 Image Builder without an AMI Encryption Key"
    resource_type: "aws_imagebuilder_distribution_configuration"
    check:
      attribute: "distribution.ami_distribution_configuration.kms_key_id"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The EC2 Image Builder distribution configuration is packaging and deploying AMIs
      without protecting them with a Customer Managed Key (CMK). Exposing the base operating
      system's file system could facilitate reverse engineering (Info Disclosure).
    mitigation: >
      Provide a valid 'kms_key_id' in the AMI configuration:
        resource "aws_imagebuilder_distribution_configuration" "example" {
          distribution {
            ami_distribution_configuration {
              kms_key_id = aws_kms_key.example.arn
            }
          }
        }
    references:
      - "https://docs.aws.amazon.com/imagebuilder/latest/userguide/manage-cmk.html"
    tags: ["ec2", "image-builder", "encryption", "amis"]

  # ============================================================
  # SECTION: NETWORKING (WAF, ALB, CLOUDFRONT) — v1.2.0
  # ============================================================

  - id: TMAC-AWS-WAF-001
    name: "WAFv2 Web ACL without a Rate Limiting Rule"
    resource_type: "aws_wafv2_web_acl"
    check:
      attribute: "rule"
      condition: "not_exists"
      values: []
    severity: "High"
    stride: "Denial of Service"
    description: >
      The AWS WAFv2 Web ACL has no rules configured ('rule' absent).
      Without rate-limiting rules or managed rule groups, the WAF does not protect against
      brute-force attacks, layer-7 DDoS or injections (SQLi/XSS), leaving
      the application completely exposed (Denial of Service / Tampering).
    mitigation: >
      Add at least one rate-limiting rule and the basic AWS Managed Rule Groups:
        resource "aws_wafv2_web_acl" "example" {
          rule {
            name     = "RateLimit"
            priority = 1
            action { block {} }
            statement {
              rate_based_statement {
                limit              = 2000
                aggregate_key_type = "IP"
              }
            }
            visibility_config {
              cloudwatch_metrics_enabled = true
              metric_name                = "RateLimit"
              sampled_requests_enabled   = true
            }
          }
        }
    references:
      - "https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statements-list.html"
      - "CIS AWS Benchmark v2.0.0 - 6.1"
    tags: ["waf", "ddos", "rate-limiting", "network"]

  - id: TMAC-AWS-WAF-002
    name: "WAFv2 Web ACL without Logging Enabled"
    resource_type: "aws_wafv2_web_acl_logging_configuration"
    check:
      attribute: "log_destination_configs"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Repudiation"
    description: >
      The WAFv2 logging configuration has no destinations defined. Without logs of
      blocked and allowed requests, it is not possible to audit attacks or
      investigate incidents (Repudiation). An attacker can operate without leaving a trace.
    mitigation: >
      Configure a log destination (Kinesis Firehose, S3 or CloudWatch):
        resource "aws_wafv2_web_acl_logging_configuration" "example" {
          log_destination_configs = [aws_kinesis_firehose_delivery_stream.example.arn]
          resource_arn            = aws_wafv2_web_acl.example.arn
        }
    references:
      - "https://docs.aws.amazon.com/waf/latest/developerguide/logging.html"
    tags: ["waf", "logging", "audit", "repudiation"]

  - id: TMAC-AWS-ALB-001
    name: "Application Load Balancer without Access Logs"
    resource_type: "aws_lb"
    check:
      attribute: "access_logs.enabled"
      condition: "equals"
      values: [false]
    severity: "Medium"
    stride: "Repudiation"
    description: >
      The Application Load Balancer (ALB) does not have access logs enabled
      ('access_logs.enabled = false'). Without records of incoming HTTP/S requests,
      it is not possible to trace the origin of attacks, investigate
      incidents or meet audit requirements (Repudiation).
    mitigation: >
      Enable access logs pointing to a dedicated S3 bucket:
        resource "aws_lb" "example" {
          access_logs {
            bucket  = aws_s3_bucket.alb_logs.id
            prefix  = "alb"
            enabled = true
          }
        }
    references:
      - "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-access-logs.html"
      - "CIS AWS Benchmark v2.0.0 - 3.9"
    tags: ["alb", "load-balancer", "logging", "audit"]

  - id: TMAC-AWS-ALB-002
    name: "ALB Listener without HTTP→HTTPS Redirection"
    resource_type: "aws_lb_listener"
    check:
      attribute: "protocol"
      condition: "equals"
      values: ["HTTP"]
      and_check:
        attribute: "default_action.type"
        condition: "equals"
        values: ["forward"]
    severity: "High"
    stride: "Information Disclosure"
    description: >
      The ALB listener accepts plain HTTP traffic and forwards it directly to the
      backend without redirecting to HTTPS. This exposes credentials, session tokens and
      sensitive data to Man-in-the-Middle attacks (Information Disclosure).
    mitigation: >
      Change the default_action to 'redirect' with the HTTPS protocol:
        resource "aws_lb_listener" "http" {
          protocol = "HTTP"
          default_action {
            type = "redirect"
            redirect {
              protocol    = "HTTPS"
              status_code = "HTTP_301"
            }
          }
        }
    references:
      - "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/create-https-listener.html"
    tags: ["alb", "load-balancer", "tls", "https", "transit"]

  - id: TMAC-AWS-CF-001
    name: "CloudFront Distribution without an Associated WAF"
    resource_type: "aws_cloudfront_distribution"
    check:
      attribute: "web_acl_id"
      condition: "not_exists"
      values: []
    severity: "High"
    stride: "Tampering"
    description: >
      The Amazon CloudFront distribution does not have a WAFv2 Web ACL associated
      ('web_acl_id' absent). Without a WAF at the edge, the distribution is vulnerable to
      injection attacks (SQLi, XSS), mass scraping and layer-7 DDoS (Tampering / DoS).
    mitigation: >
      Associate a WAFv2 Web ACL (CLOUDFRONT scope, us-east-1 region):
        resource "aws_cloudfront_distribution" "example" {
          web_acl_id = aws_wafv2_web_acl.example.arn
        }
    references:
      - "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/distribution-web-awswaf.html"
    tags: ["cloudfront", "cdn", "waf", "edge-security"]

  - id: TMAC-AWS-CF-002
    name: "CloudFront Distribution with a Cache Policy that Allows HTTP"
    resource_type: "aws_cloudfront_distribution"
    check:
      attribute: "default_cache_behavior.viewer_protocol_policy"
      condition: "equals"
      values: ["allow-all"]
    severity: "High"
    stride: "Information Disclosure"
    description: >
      The CloudFront viewer protocol policy is set to 'allow-all',
      allowing unencrypted HTTP connections from end users to the edge.
      This exposes the traffic to Man-in-the-Middle interception (Information Disclosure).
    mitigation: >
      Change 'viewer_protocol_policy' to 'redirect-to-https' or 'https-only':
        resource "aws_cloudfront_distribution" "example" {
          default_cache_behavior {
            viewer_protocol_policy = "redirect-to-https"
          }
        }
    references:
      - "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-https.html"
    tags: ["cloudfront", "cdn", "tls", "https", "transit"]

  # ============================================================
  # SECTION: IDENTITY (COGNITO, SECRETS MANAGER) — v1.2.0
  # ============================================================

  - id: TMAC-AWS-COGNITO-001
    name: "Cognito User Pool without Mandatory MFA"
    resource_type: "aws_cognito_user_pool"
    check:
      attribute: "mfa_configuration"
      condition: "equals"
      values: ["OFF"]
    severity: "High"
    stride: "Spoofing"
    description: >
      The Amazon Cognito User Pool has MFA disabled ('mfa_configuration = OFF').
      Without a second authentication factor, user accounts are vulnerable to
      credential stuffing and phishing attacks, allowing identity spoofing
      (Spoofing) by merely compromising the password.
    mitigation: >
      Enable mandatory MFA, or at least optional MFA with TOTP/SMS:
        resource "aws_cognito_user_pool" "example" {
          mfa_configuration = "ON"
          software_token_mfa_configuration {
            enabled = true
          }
        }
    references:
      - "https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-mfa.html"
      - "CIS AWS Benchmark v2.0.0 - 1.10"
    tags: ["cognito", "mfa", "authentication", "identity"]

  - id: TMAC-AWS-COGNITO-002
    name: "Cognito User Pool without a Strong Password Policy"
    resource_type: "aws_cognito_user_pool"
    check:
      attribute: "password_policy"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Spoofing"
    description: >
      The Cognito User Pool does not have an explicit password policy defined.
      Without minimum requirements for length, complexity and rotation, users can
      set weak passwords that facilitate brute-force attacks (Spoofing).
    mitigation: >
      Define a robust password policy:
        resource "aws_cognito_user_pool" "example" {
          password_policy {
            minimum_length                   = 14
            require_lowercase                = true
            require_numbers                  = true
            require_symbols                  = true
            require_uppercase                = true
            temporary_password_validity_days = 1
          }
        }
    references:
      - "https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-policies.html"
    tags: ["cognito", "password-policy", "authentication", "identity"]

  - id: TMAC-AWS-COGNITO-003
    name: "Cognito User Pool without Risk Event Logging"
    resource_type: "aws_cognito_user_pool"
    check:
      attribute: "user_pool_add_ons"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Repudiation"
    description: >
      The User Pool does not have Advanced Security Mode enabled ('user_pool_add_ons').
      Without adaptive risk detection (logins from anomalous IPs, credential stuffing),
      impersonation attempts are neither recorded nor blocked (Repudiation).
    mitigation: >
      Enable Advanced Security for real-time threat detection:
        resource "aws_cognito_user_pool" "example" {
          user_pool_add_ons {
            advanced_security_mode = "ENFORCED"
          }
        }
    references:
      - "https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pool-settings-advanced-security.html"
    tags: ["cognito", "advanced-security", "threat-detection", "audit"]

  - id: TMAC-AWS-SM-001
    name: "Secrets Manager Secret without Automatic Rotation"
    resource_type: "aws_secretsmanager_secret"
    check:
      attribute: "rotation_lambda_arn"
      condition: "not_exists"
      values: []
    severity: "High"
    stride: "Information Disclosure"
    description: >
      The secret in AWS Secrets Manager does not have automatic rotation configured
      ('rotation_lambda_arn' absent). Long-lived static secrets
      (DB passwords, API keys) dramatically increase the impact of a
      leak, since the compromised secret remains valid indefinitely
      (Information Disclosure).
    mitigation: >
      Configure automatic rotation with a rotation Lambda:
        resource "aws_secretsmanager_secret_rotation" "example" {
          secret_id           = aws_secretsmanager_secret.example.id
          rotation_lambda_arn = aws_lambda_function.rotation.arn
          rotation_rules {
            automatically_after_days = 30
          }
        }
    references:
      - "https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html"
      - "CIS AWS Benchmark v2.0.0 - 1.19"
    tags: ["secrets-manager", "rotation", "credentials", "secrets"]

  - id: TMAC-AWS-SM-002
    name: "Secrets Manager Secret without a KMS CMK"
    resource_type: "aws_secretsmanager_secret"
    check:
      attribute: "kms_key_id"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The secret uses the default AWS key instead of a Customer Managed Key (CMK).
      Without your own CMK, you have no granular control over who can decrypt the secret
      nor detailed auditing of cryptographic access in CloudTrail (Information Disclosure).
    mitigation: >
      Associate a KMS CMK with the secret:
        resource "aws_secretsmanager_secret" "example" {
          kms_key_id = aws_kms_key.secrets_key.arn
        }
    references:
      - "https://docs.aws.amazon.com/secretsmanager/latest/userguide/security-encryption.html"
    tags: ["secrets-manager", "kms", "encryption", "secrets"]

  # ============================================================
  # SECTION: ANALYTICS (REDSHIFT, OPENSEARCH, KINESIS) — v1.2.0
  # ============================================================

  - id: TMAC-AWS-RS-001
    name: "Redshift Cluster without Encryption at Rest"
    resource_type: "aws_redshift_cluster"
    check:
      attribute: "encrypted"
      condition: "equals"
      values: [false]
    severity: "High"
    stride: "Information Disclosure"
    description: >
      The Amazon Redshift cluster (Data Warehouse) does not have encryption at rest
      enabled ('encrypted = false'). The petabytes of stored analytical data
      are exposed to unauthorized access if the underlying volumes are
      compromised (Information Disclosure).
    mitigation: >
      Enable encryption with a KMS CMK:
        resource "aws_redshift_cluster" "example" {
          encrypted  = true
          kms_key_id = aws_kms_key.redshift_key.arn
        }
    references:
      - "https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-db-encryption.html"
      - "CIS AWS Benchmark v2.0.0 - 2.4.1"
    tags: ["redshift", "data-warehouse", "encryption", "analytics"]

  - id: TMAC-AWS-RS-002
    name: "Redshift Cluster with Public Access"
    resource_type: "aws_redshift_cluster"
    check:
      attribute: "publicly_accessible"
      condition: "equals"
      values: [true]
    severity: "Critical"
    stride: "Information Disclosure"
    description: >
      The Redshift cluster is configured as publicly accessible
      ('publicly_accessible = true'). Exposing a Data Warehouse directly to
      the internet is one of the most frequent causes of mega data breaches
      (Information Disclosure). Redshift listens on port 5439 by default.
    mitigation: >
      Disable public access and place the cluster in private subnets:
        resource "aws_redshift_cluster" "example" {
          publicly_accessible  = false
          cluster_subnet_group_name = aws_redshift_subnet_group.private.name
        }
    references:
      - "https://docs.aws.amazon.com/redshift/latest/mgmt/managing-clusters-vpc.html"
      - "CIS AWS Benchmark v2.0.0 - 2.4.2"
    tags: ["redshift", "data-warehouse", "public-access", "network"]

  - id: TMAC-AWS-RS-003
    name: "Redshift Cluster without Audit Logging"
    resource_type: "aws_redshift_cluster"
    check:
      attribute: "logging"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Repudiation"
    description: >
      The Redshift cluster does not have audit logging enabled ('logging' absent).
      Without records of executed SQL queries, connections and errors, it is not possible
      to detect data exfiltration or investigate unauthorized access (Repudiation).
    mitigation: >
      Enable audit logging to an S3 bucket:
        resource "aws_redshift_cluster" "example" {
          logging {
            enable        = true
            bucket_name   = aws_s3_bucket.redshift_logs.id
            s3_key_prefix = "redshift-audit/"
          }
        }
    references:
      - "https://docs.aws.amazon.com/redshift/latest/mgmt/db-auditing.html"
      - "CIS AWS Benchmark v2.0.0 - 2.4.3"
    tags: ["redshift", "data-warehouse", "logging", "audit"]

  - id: TMAC-AWS-OS-001
    name: "OpenSearch Domain without Encryption at Rest"
    resource_type: "aws_opensearch_domain"
    check:
      attribute: "encrypt_at_rest.enabled"
      condition: "equals"
      values: [false]
    severity: "High"
    stride: "Information Disclosure"
    description: >
      The Amazon OpenSearch Service domain (formerly Elasticsearch) does not have
      encryption at rest enabled ('encrypt_at_rest.enabled = false'). The search indices
      may contain sensitive data from logs, security events or customer
      information that is left exposed (Information Disclosure).
    mitigation: >
      Enable encryption at rest with KMS:
        resource "aws_opensearch_domain" "example" {
          encrypt_at_rest {
            enabled    = true
            kms_key_id = aws_kms_key.opensearch_key.arn
          }
        }
    references:
      - "https://docs.aws.amazon.com/opensearch-service/latest/developerguide/encryption-at-rest.html"
    tags: ["opensearch", "elasticsearch", "encryption", "search"]

  - id: TMAC-AWS-OS-002
    name: "OpenSearch Domain with Public Access (No VPC)"
    resource_type: "aws_opensearch_domain"
    check:
      attribute: "vpc_options"
      condition: "not_exists"
      values: []
    severity: "Critical"
    stride: "Information Disclosure"
    description: >
      The OpenSearch domain is not deployed within a VPC ('vpc_options' absent).
      Public OpenSearch domains have been responsible for multiple massive data
      breaches by being exposed to the internet without authentication (Information Disclosure).
    mitigation: >
      Deploy the domain within a VPC with private subnets:
        resource "aws_opensearch_domain" "example" {
          vpc_options {
            subnet_ids         = [aws_subnet.private.id]
            security_group_ids = [aws_security_group.opensearch.id]
          }
        }
    references:
      - "https://docs.aws.amazon.com/opensearch-service/latest/developerguide/vpc.html"
    tags: ["opensearch", "elasticsearch", "public-access", "vpc"]

  - id: TMAC-AWS-OS-003
    name: "OpenSearch Domain without Encryption in Transit (TLS)"
    resource_type: "aws_opensearch_domain"
    check:
      attribute: "domain_endpoint_options.enforce_https"
      condition: "equals"
      values: [false]
    severity: "High"
    stride: "Information Disclosure"
    description: >
      The OpenSearch domain does not enforce HTTPS ('enforce_https = false'), allowing
      unencrypted HTTP connections. Search queries and responses travel in
      plaintext, exposed to interception (Information Disclosure).
    mitigation: >
      Enforce HTTPS and set the minimum TLS policy:
        resource "aws_opensearch_domain" "example" {
          domain_endpoint_options {
            enforce_https       = true
            tls_security_policy = "Policy-Min-TLS-1-2-2019-07"
          }
        }
    references:
      - "https://docs.aws.amazon.com/opensearch-service/latest/developerguide/encryption-at-rest.html"
    tags: ["opensearch", "elasticsearch", "tls", "https", "transit"]

  - id: TMAC-AWS-KDS-001
    name: "Kinesis Data Streams Stream without Encryption (KMS)"
    resource_type: "aws_kinesis_stream"
    check:
      attribute: "encryption_type"
      condition: "equals"
      values: ["NONE"]
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The Amazon Kinesis Data Streams stream has encryption disabled
      ('encryption_type = NONE'). The real-time events flowing through the
      stream (logs, clickstreams, IoT data) travel without cryptographic protection,
      exposed to unauthorized access (Information Disclosure).
    mitigation: >
      Enable encryption with KMS:
        resource "aws_kinesis_stream" "example" {
          encryption_type = "KMS"
          kms_key_id      = aws_kms_key.kinesis_key.id
        }
    references:
      - "https://docs.aws.amazon.com/streams/latest/dev/server-side-encryption.html"
    tags: ["kinesis", "streaming", "encryption", "data-flow"]

  - id: TMAC-AWS-MSK-001
    name: "MSK Cluster (Kafka) without Encryption in Transit"
    resource_type: "aws_msk_cluster"
    check:
      attribute: "encryption_info.encryption_in_transit.client_broker"
      condition: "equals"
      values: ["PLAINTEXT"]
    severity: "High"
    stride: "Information Disclosure"
    description: >
      The Amazon MSK (Managed Streaming for Apache Kafka) cluster allows plaintext
      connections between clients and brokers ('client_broker = PLAINTEXT'). The Kafka
      messages flowing through the event bus can be intercepted on the network
      (Information Disclosure / Tampering).
    mitigation: >
      Enforce TLS on all client-broker connections:
        resource "aws_msk_cluster" "example" {
          encryption_info {
            encryption_in_transit {
              client_broker = "TLS"
              in_cluster    = true
            }
          }
        }
    references:
      - "https://docs.aws.amazon.com/msk/latest/developerguide/msk-encryption.html"
    tags: ["msk", "kafka", "streaming", "tls", "transit"]

  - id: TMAC-AWS-MSK-002
    name: "MSK Cluster without Client Authentication (mTLS/SASL)"
    resource_type: "aws_msk_cluster"
    check:
      attribute: "client_authentication"
      condition: "not_exists"
      values: []
    severity: "High"
    stride: "Spoofing"
    description: >
      The MSK cluster does not have client authentication configured ('client_authentication'
      absent). Without mTLS or SASL/SCRAM, any client with network access to the cluster can
      produce or consume messages without authenticating, allowing impersonation of legitimate
      producers (Spoofing) and injection of malicious messages.
    mitigation: >
      Enable mTLS or SASL/SCRAM authentication:
        resource "aws_msk_cluster" "example" {
          client_authentication {
            sasl {
              scram = true
            }
            tls {
              certificate_authority_arns = [aws_acmpca_certificate_authority.example.arn]
            }
          }
        }
    references:
      - "https://docs.aws.amazon.com/msk/latest/developerguide/msk-authentication.html"
    tags: ["msk", "kafka", "authentication", "mtls", "sasl"]

  # ============================================================
  # SECTION: CONTAINERS (FARGATE) — v1.2.0
  # ============================================================

  - id: TMAC-AWS-FARGATE-001
    name: "Fargate Task Definition without Logging Configured"
    resource_type: "aws_ecs_task_definition"
    check:
      attribute: "container_definitions"
      condition: "not_contains"
      values: ['"logConfiguration"']
    severity: "Medium"
    stride: "Repudiation"
    description: >
      The ECS/Fargate task definition does not include 'logConfiguration' in its
      containers. Without sending container logs to CloudWatch Logs or a SIEM,
      it is not possible to audit process activity or investigate compromises
      (Repudiation). An attacker can run code without leaving a trace.
    mitigation: >
      Add logConfiguration to each container pointing to CloudWatch Logs:
        container_definitions = jsonencode([{
          logConfiguration = {
            logDriver = "awslogs"
            options = {
              "awslogs-group"         = "/ecs/my-task"
              "awslogs-region"        = "us-east-1"
              "awslogs-stream-prefix" = "ecs"
            }
          }
        }])
    references:
      - "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/using_awslogs.html"
    tags: ["fargate", "ecs", "containers", "logging", "audit"]

  - id: TMAC-AWS-FARGATE-002
    name: "Fargate Task Definition with a Privileged Container"
    resource_type: "aws_ecs_task_definition"
    check:
      attribute: "container_definitions"
      condition: "contains"
      values: ['"privileged": true']
    severity: "Critical"
    stride: "Elevation of Privilege"
    description: >
      The task definition includes a container with 'privileged: true'. A privileged
      container has full access to the underlying host, allowing escape from
      container isolation and compromise of the EC2 node or the ECS control plane
      (Elevation of Privilege). It is the equivalent of running as root on the host.
    mitigation: >
      Remove 'privileged: true' from all containers. Use specific Linux capabilities
      if they are needed:
        container_definitions = jsonencode([{
          privileged = false
          linuxParameters = {
            capabilities = {
              add  = ["NET_BIND_SERVICE"]
              drop = ["ALL"]
            }
          }
        }])
    references:
      - "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_definition_parameters.html#container_definition_security"
    tags: ["fargate", "ecs", "containers", "privilege-escalation", "container-escape"]

  - id: TMAC-AWS-FARGATE-003
    name: "Fargate Task Definition without a Read-Only Root Filesystem"
    resource_type: "aws_ecs_task_definition"
    check:
      attribute: "container_definitions"
      condition: "not_contains"
      values: ['"readonlyRootFilesystem": true']
    severity: "Medium"
    stride: "Tampering"
    description: >
      The containers in the task definition do not have the root file system
      configured as read-only ('readonlyRootFilesystem: true'). An attacker who
      compromises the container can modify binaries, install persistence
      tools or alter the process configuration (Tampering).
    mitigation: >
      Enable readonlyRootFilesystem and mount temporary volumes only where necessary:
        container_definitions = jsonencode([{
          readonlyRootFilesystem = true
          mountPoints = [{
            sourceVolume  = "tmp"
            containerPath = "/tmp"
            readOnly      = false
          }]
        }])
    references:
      - "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_definition_parameters.html#container_definition_security"
    tags: ["fargate", "ecs", "containers", "filesystem", "hardening"]


  - id: TMAC-AWS-AURORA-002
    name: "Aurora Cluster with Encryption Explicitly Disabled"
    resource_type: "aws_rds_cluster"
    check:
      attribute: "storage_encrypted"
      condition: "equals"
      values: [false]
    severity: "High"
    stride: "Information Disclosure"
    description: >
      The Aurora cluster sets 'storage_encrypted = false', explicitly disabling
      encryption at rest. The database data remains
      in plaintext on the underlying storage and in the snapshots.
    mitigation: >
      Set 'storage_encrypted = true' and define a managed 'kms_key_id'.
    references:
      - "https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Overview.Encryption.html"
    tags: ["aurora", "rds", "encryption", "database"]

  - id: TMAC-AWS-AURORA-003
    name: "Aurora Cluster with a Master Password in Plaintext"
    resource_type: "aws_rds_cluster"
    check:
      attribute: "master_password"
      condition: "exists"
      values: []
    severity: "Critical"
    stride: "Information Disclosure"
    description: >
      The Aurora cluster defines 'master_password' directly in the Terraform
      code. The plaintext credentials are exposed in the Terraform state,
      in version control and in CI/CD logs.
    mitigation: >
      Use 'manage_master_user_password = true' (managed via Secrets Manager) or
      reference a secret: 'master_password = data.aws_secretsmanager_secret_version.db.secret_string'.
    references:
      - "https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/rds-secrets-manager.html"
    tags: ["aurora", "rds", "secrets", "credentials"]

  - id: TMAC-AWS-KDF-001
    name: "Kinesis Data Firehose without Server-Side Encryption"
    resource_type: "aws_kinesis_firehose_delivery_stream"
    check:
      attribute: "server_side_encryption"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The Kinesis Data Firehose delivery stream does not have server-side
      encryption configured ('server_side_encryption'). The data
      in transit through the stream buffer is not encrypted with a CMK.
    mitigation: >
      Add a 'server_side_encryption' block with 'enabled = true' and a
      'key_type'/'key_arn' pointing to a managed KMS key.
    references:
      - "https://docs.aws.amazon.com/firehose/latest/dev/encryption.html"
    tags: ["kinesis", "firehose", "encryption", "data"]

  - id: TMAC-AWS-RDSPROXY-001
    name: "RDS Proxy without Required TLS"
    resource_type: "aws_db_proxy"
    check:
      attribute: "require_tls"
      condition: "not_exists"
      values: []
    severity: "Medium"
    stride: "Information Disclosure"
    description: >
      The RDS Proxy does not require TLS ('require_tls'). Connections between the
      application and the proxy can be established without encryption in transit,
      exposing credentials and query data.
    mitigation: >
      Set 'require_tls = true' on the 'aws_db_proxy' resource.
    references:
      - "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"
    tags: ["rds", "proxy", "tls", "encryption-in-transit"]

  - id: TMAC-AWS-CB-001
    name: "CodeBuild in Privileged Mode"
    resource_type: "aws_codebuild_project"
    check:
      attribute: "environment.privileged_mode"
      condition: "equals"
      values: [true]
    severity: "Medium"
    stride: "Elevation of Privilege"
    description: >
      The CodeBuild project runs with 'privileged_mode = true', granting
      the build container privileged access to the host's Docker daemon.
      A compromised build could escape the container or tamper with other builds.
    mitigation: >
      Disable 'privileged_mode' unless building Docker images is required;
      in that case, isolate the project and restrict its IAM permissions.
    references:
      - "https://docs.aws.amazon.com/codebuild/latest/userguide/create-project-cli.html"
    tags: ["codebuild", "devops", "privilege", "containers"]

  - id: TMAC-AWS-LB-003
    name: "Internet-Facing Load Balancer"
    resource_type: "aws_lb"
    check:
      attribute: "internal"
      condition: "equals"
      values: [false]
    severity: "Low"
    stride: "Spoofing"
    description: >
      The Load Balancer is marked as 'internal = false' (internet-facing),
      so it is accessible from the internet. Verify that this exposure is
      intentional and that it is protected by a WAF and appropriate security rules.
    mitigation: >
      If the load balancer only serves internal traffic, set 'internal = true'.
      If it must be public, be sure to associate a WAFv2 Web ACL and strict TLS.
    references:
      - "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html"
    tags: ["alb", "elb", "exposure", "network"]

  - id: TMAC-AWS-EB-002
    name: "Elastic Beanstalk without Log/Streaming Configuration"
    resource_type: "aws_elastic_beanstalk_environment"
    check:
      attribute: "name"
      condition: "regex"
      values: ["^.*$"]
      and_check:
        attribute: "cloudwatch_logs"
        condition: "not_exists"
        values: []
    severity: "Low"
    stride: "Repudiation"
    description: >
      The Elastic Beanstalk environment does not define log streaming to CloudWatch.
      Without centralized log retention, auditing and incident
      investigation become difficult.
    mitigation: >
      Configure the 'aws:elasticbeanstalk:cloudwatch:logs' namespace with
      'StreamLogs = true' and an appropriate retention.
    references:
      - "https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/AWSHowTo.cloudwatchlogs.html"
    tags: ["beanstalk", "logging", "observability"]

  - id: TMAC-AWS-FIREHOSE-002
    name: "Kinesis Firehose with an Unencrypted Buffer to S3"
    resource_type: "aws_kinesis_firehose_delivery_stream"
    check:
      attribute: "extended_s3_configuration.kms_key_arn"
      condition: "not_exists"
      values: []
    severity: "Low"
    stride: "Information Disclosure"
    description: >
      The Firehose 'extended_s3_configuration' does not specify a
      'kms_key_arn' to encrypt the objects delivered to S3 with its own CMK.
    mitigation: >
      Define 'kms_key_arn' within 'extended_s3_configuration' pointing to a
      customer-managed KMS key.
    references:
      - "https://docs.aws.amazon.com/firehose/latest/dev/encryption.html"
    tags: ["kinesis", "firehose", "s3", "encryption"]
