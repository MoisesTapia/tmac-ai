name: TMAC Security Analysis

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.tf"

permissions:
  pull-requests: write
  contents: read

jobs:
  tmac:
    name: Threat Model Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TMAC
        run: pip install .

      - name: Run TMAC CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmac ci \
            --dir . \
            --base-ref ${{ github.base_ref }} \
            --head-ref ${{ github.head_ref }} \
            --comment \
            --fail-on high \
            --report md \
            --output tmac-report.md

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmac-security-report
          path: tmac-report.md
