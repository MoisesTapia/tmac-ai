[tool.poetry]
name = "tmac"
version = "1.0.0"
description = "Threat Modeling as Code - Automated static analysis for infrastructure as code"
authors = ["TMAC Security Team"]
readme = "README.md"
packages = [{include = "tmac", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.1.7"
pydantic = "^2.6.0"
python-hcl2 = "^4.3.2"
Pygments = "^2.17.2"
Jinja2 = "^3.1.3"
PyYAML = "^6.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
black = "^24.2.0"
ruff = "^0.2.2"
mypy = "^1.8.0"
hypothesis = "^6.100.0"

[tool.poetry.scripts]
tmac = "tmac.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
