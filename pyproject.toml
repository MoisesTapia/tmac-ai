[tool.poetry]
name = "tmac"
version = "1.1.0"
description = "Threat Modeling as Code - Automated static analysis for infrastructure as code"
authors = ["TMAC Security Team"]
readme = "README.md"
packages = [{include = "tmac", from = "src"}]

# Floors match the versions audited in requirements.txt (pip-audit, 2026-10-22).
# Exact pins for reproducible installs live in requirements.txt / requirements-dev.txt.
[tool.poetry.dependencies]
python = "^3.10"
click = ">=8.5.0,<9"
pydantic = ">=2.14.1,<3"
# >= 5 changes the HCL output format and breaks rule matching.
python-hcl2 = ">=4.3.5,<5"
Jinja2 = ">=3.1.6,<4"
PyYAML = ">=6.0.3,<7"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
black = ">=26.10.1,<27"
ruff = ">=0.17.2,<0.18"
mypy = ">=2.4.0,<3"
hypothesis = ">=6.170.8,<7"
pip-audit = ">=2.10.1,<3"

[tool.poetry.scripts]
tmac = "tmac.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
